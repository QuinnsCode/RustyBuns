# Everyday app tests, on PRs only: one Linux job per app the PR touched (every app if
# packages/ or the lockfile moved), plus the packages' own tests when packages/ moved and the
# agent guard hook's tests when .claude/ moved.
# An app with boot: true in scripts/ci-apps.ts also builds its dev host and boots it on the local twins.
# Desktop binaries (smoke rows, bootOn) are built and started hourly by desktop-hourly.yml, not per PR.
name: apps
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default; a job that needs more says so.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.p.outputs.apps }}
      any: ${{ steps.p.outputs.any }}
      packages: ${{ steps.p.outputs.packages }}
      hooks: ${{ steps.p.outputs.hooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      # Actions stay free: standard runners only, and every job has a timeout (scripts/ci-guard.ts).
      - run: bun scripts/ci-guard.ts
      - id: p
        # A manual run has no PR base: diff against the root commit, so every app runs.
        env: { BASE: "${{ github.event.pull_request.base.sha }}" }
        run: bun scripts/ci-apps.ts test "${BASE:-$(git rev-list --max-parents=0 HEAD)}" >> "$GITHUB_OUTPUT"

  packages:
    needs: plan
    if: needs.plan.outputs.packages == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
      - run: bun scripts/ci-test-count.ts "bun test packages"

  # The agent guard hook (.claude/hooks/guard.ts). bun test skips dot directories, hence the explicit path.
  hooks:
    needs: plan
    if: needs.plan.outputs.hooks == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - run: bun scripts/ci-test-count.ts "bun test ./.claude/hooks"

  test:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.apps) }}
    name: test ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - if: matrix.prep
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; the toolchain is the input below
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - if: matrix.prep
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: "${{ matrix.cargo }}" }
      - run: bun install --frozen-lockfile
        working-directory: .
      - if: matrix.prep
        run: ${{ matrix.prep }}
      # the test count goes on the check run as an annotation, for the office's PR health bar
      - if: matrix.test
        run: bun ../../scripts/ci-test-count.ts "${{ matrix.test }}"
      # Borg tier 1: the dev host builds and boots on the local twins (scripts/boot.ts).
      - if: matrix.boot
        run: bun ../../scripts/boot.ts

  # The container images a PR touched (an app's rustybuns.config.ts bindings): planned once, then one job per app so
  # they build in parallel; each builds for linux/amd64 and boots (rustybuns containers smoke), with a size (and its change
  # against the base) and boot table in its job summary. A PR that touches no image skips the build jobs. Not part of the `apps` gate below.
  containers-plan:
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      containers: ${{ steps.p.outputs.containers }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
      - id: p
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CODESPLITTER_AGENTS: "1"
          CODESPLITTER_DEPLOYS: "1"
          CODESPLITTER_CHECKS: "1"
        run: bun scripts/ci-containers.ts plan "$BASE" >> "$GITHUB_OUTPUT"

  containers:
    needs: containers-plan
    if: needs.containers-plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.containers-plan.outputs.containers) }}
    name: containers ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
      # BuildKit's GitHub Actions layer cache (type=gha, a scope per image) needs the docker-container driver.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0 (exports ACTIONS_RESULTS_URL for the cache)
      # codeSplitter's check, deploy and agent images are behind these flags in its rustybuns.config.ts.
      - env:
          CODESPLITTER_AGENTS: "1"
          CODESPLITTER_DEPLOYS: "1"
          CODESPLITTER_CHECKS: "1"
          BASE: ${{ github.event.pull_request.base.sha }}
          APP: ${{ matrix.app }}
          BINDINGS: ${{ matrix.bindings }}
        run: bun scripts/ci-containers.ts run "$APP" $BINDINGS

  # One check for the ruleset on main to require (.github/rulesets/main.json): the jobs above only run for the
  # apps a PR touched, so their names come and go. This passes when none of them failed or got cancelled.
  apps:
    needs: [plan, packages, hooks, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env: { RESULTS: "${{ join(needs.*.result, ' ') }}" }
        run: |
          echo "plan, packages, hooks, test: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
