# Everyday app tests, on PRs only: one Linux job per app the PR touched (every app if
# packages/ or the lockfile moved), plus the packages' own tests when packages/ moved and the
# agent guard hook's tests when .claude/ moved.
# An app with boot: true in scripts/ci-apps.ts also builds its dev host and boots it on the local twins.
# An app with a smoke row in scripts/ci-apps.ts (agent-office) also builds its binary on each Mac and Linux
# runner and checks it starts, and an app with bootOn (splat-spray) builds its binary on windows-11-arm and boots it
# (scripts/boot.ts --bin); those binaries are thrown away. The ones handed out come from desktop-drop.yml.
name: apps
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default; a job that needs more says so.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.p.outputs.apps }}
      any: ${{ steps.p.outputs.any }}
      packages: ${{ steps.p.outputs.packages }}
      hooks: ${{ steps.p.outputs.hooks }}
      smoke: ${{ steps.p.outputs.smoke }}
      smokes: ${{ steps.p.outputs.smokes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      # Actions stay free: standard runners only, and every job has a timeout (scripts/ci-guard.ts).
      - run: bun scripts/ci-guard.ts
      - id: p
        # A manual run has no PR base: diff against the root commit, so every app runs.
        env: { BASE: "${{ github.event.pull_request.base.sha }}" }
        run: bun scripts/ci-apps.ts test "${BASE:-$(git rev-list --max-parents=0 HEAD)}" >> "$GITHUB_OUTPUT"

  packages:
    needs: plan
    if: needs.plan.outputs.packages == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - run: bun install --frozen-lockfile
      - run: bun scripts/ci-test-count.ts "bun test packages"

  # The agent guard hook (.claude/hooks/guard.ts). bun test skips dot directories, hence the explicit path.
  hooks:
    needs: plan
    if: needs.plan.outputs.hooks == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - run: bun scripts/ci-test-count.ts "bun test ./.claude/hooks"

  test:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.apps) }}
    name: test ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - if: matrix.prep
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; the toolchain is the input below
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - if: matrix.prep
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: "${{ matrix.cargo }}" }
      - run: bun install --frozen-lockfile
        working-directory: .
      - if: matrix.prep
        run: ${{ matrix.prep }}
      # the test count goes on the check run as an annotation, for the office's PR health bar
      - if: matrix.test
        run: bun ../../scripts/ci-test-count.ts "${{ matrix.test }}"
      # Borg tier 1: the dev host builds and boots on the local twins (scripts/boot.ts).
      - if: matrix.boot
        run: bun ../../scripts/boot.ts

  # The app's own binary, built for the runner it's on and started: linux-x64, linux-arm64, darwin-arm64, darwin-x64,
  # and the bootOn targets (windows-arm64).
  smoke:
    needs: plan
    if: needs.plan.outputs.smokes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke) }}
    name: smoke ${{ matrix.app }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: ${{ matrix.smoke }}

  # One check for the ruleset on main to require (.github/rulesets/main.json): the jobs above only run for the
  # apps a PR touched, so their names come and go. This passes when none of them failed or got cancelled.
  apps:
    needs: [plan, packages, hooks, test, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env: { RESULTS: "${{ join(needs.*.result, ' ') }}" }
        run: |
          echo "plan, packages, hooks, test, smoke: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
