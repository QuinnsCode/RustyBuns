# Repo-wide typecheck: tsc over the root tsconfig (packages/) and every apps/*/tsconfig.json.
# Runs on every PR, no path filter, since a change in packages/ can break any app.
name: typecheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default; a job that needs more says so.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run docs --check
      - run: bun run site --check
