# Repo-wide typecheck: tsc over the root tsconfig (packages/) and every apps/*/tsconfig.json.
# Runs on every PR, no path filter, since a change in packages/ can break any app.
name: typecheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
