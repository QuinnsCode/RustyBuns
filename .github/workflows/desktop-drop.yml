# Desktop binaries for every app (or a few), on demand, into R2 under hidden folders.
# Run it from the Actions tab (pick apps, leave dry on to only see what builds), or
# push a tag <app>-v<version> to drop one app for real (<app>-v1.2.0 is stable,
# <app>-v1.3.0-beta.1 experimental). Each app keeps the latest stable, the latest
# experimental and the stable before; older builds are deleted. Links are in each drop job's summary.
# A stable tag also makes a public GitHub Release with the binaries: that's what the
# README links. The R2 drops stay hidden, for beta testers.
# A PR that changes this pipeline dry-runs every app, so a broken build shows before merge;
# one that only edits some apps' rows in scripts/ci-apps.ts dry-runs just those.
#
# Apps with Rust cdylibs (native/) build on one runner per OS; the rest cross-compile
# every target from one Linux job. The table lives in scripts/ci-apps.ts.
# The drop job runs on a Mac so it can sign and notarize the darwin-* binaries
# (scripts/mac/sign.sh, credentials per APPLE_SIGNING.md) before they go anywhere.
name: desktop-drop
on:
  push:
    tags: ["*-v*"]
  pull_request:
    paths: [".github/workflows/desktop-drop.yml", "scripts/ci-apps.ts", "scripts/drop.ts", "scripts/mac/**"]
  workflow_dispatch:
    inputs:
      apps:
        description: "all, or a comma list (hippo-tycoon,fm-daw)"
        default: all
      version:
        description: "Version label for the folder (default: each app's package.json version)"
        required: false
      channel:
        description: "stable, or experimental (newest, may break)"
        type: choice
        options: [experimental, stable]
        default: experimental
      dry:
        description: "Dry run: build and keep the binaries as run artifacts, upload nothing to R2"
        type: boolean
        default: true

concurrency:
  group: desktop-drop-${{ github.ref }}

# Read-only token by default; a job that needs more says so.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.p.outputs.build }}
      apps: ${{ steps.p.outputs.apps }}
      version: ${{ steps.p.outputs.version }}
      channel: ${{ steps.p.outputs.channel }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - id: p
        # Inputs go through env, never pasted into the script: a typed `$(...)` would run.
        env:
          APPS: ${{ inputs.apps }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel || 'experimental' }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          apps="$APPS"; version="$VERSION"; channel="$CHANNEL"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then   # <app>-v<version>; a prerelease (1.3.0-beta.1) is experimental
            tag="${GITHUB_REF#refs/tags/}"; apps="${tag%-v*}"; version="${tag##*-v}"
            [[ "$version" == *-* ]] && channel=experimental || channel=stable
          fi
          # It names an R2 folder and a release title: a version, nothing else.
          [[ -z "$version" || "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "bad version: $version"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            bun scripts/ci-apps.ts drop pr "$BASE" >> "$GITHUB_OUTPUT"
          else
            bun scripts/ci-apps.ts drop "$apps" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false      # one broken app shouldn't hide whether the rest build
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    name: ${{ matrix.app }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - if: matrix.prep
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; the toolchain is the input below
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - if: matrix.prep
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: "${{ matrix.cargo }}" }
      - run: bun install --frozen-lockfile
        working-directory: .
      - if: matrix.prep
        run: ${{ matrix.prep }}
      - if: matrix.test
        run: ${{ matrix.test }}     # a native binary still gets its tests on its own OS
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-${{ matrix.target }}
          path: apps/${{ matrix.app }}/dist/${{ matrix.app }}-*
          if-no-files-found: error
          retention-days: 7

  drop:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.any == 'true' }}     # drop whichever apps built, even if another failed
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    name: drop ${{ matrix.app }}
    runs-on: macos-latest   # codesign and notarytool are Apple's
    timeout-minutes: 45     # notarization waits on Apple, usually a few minutes
    concurrency: drop-${{ matrix.app }}   # channels.json is read, changed, written: one drop per app at a time
    # The drop secrets live in the `drops` environment, which waits for the owner's approval, so a
    # workflow_dispatch of an edited copy of this file on some branch can't reach them. A PR and a
    # dry dispatch (which uploads nothing) get none, so neither asks for the approval either.
    environment: ${{ github.event_name != 'pull_request' && !inputs.dry && 'drops' || '' }}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}   # the release notes say whether the Mac binaries are signed
    permissions:
      contents: read    # a PR's drop.ts and sign.sh run here, so nothing in this job can write; the release is its own job
      actions: read     # the artifact count below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }   # a PR's drop.ts and sign.sh run here; the write token stays out of .git/config
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: bins, pattern: "${{ matrix.app }}-*", merge-multiple: true }
      - name: Every target built?
        run: |
          # A half-built app (say, Windows failed) isn't dropped; its artifacts are still on the run.
          ls -la bins
          want=$(bun -e 'const m=JSON.parse(process.argv[1]).include.filter(e=>e.app===process.argv[2]);console.log(m.length)' "$BUILD" "$APP")
          got=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq "[.artifacts[].name | select(startswith(\"$APP-\"))] | length")
          echo "artifacts: $got of $want"
          [ "$got" = "$want" ]
        env:
          GH_TOKEN: "${{ github.token }}"
          BUILD: ${{ needs.plan.outputs.build }}   # through env, not pasted into the script: a PR writes this table
          APP: ${{ matrix.app }}
      - name: Sign and notarize the Mac binaries
        id: sign
        # Without the secrets (a PR, or before the owner enrolls) this signs nothing and the
        # release notes keep the xattr workaround.
        run: scripts/mac/sign.sh bins
        env:
          APP: ${{ matrix.app }}
          APPLE_DEVELOPER_ID_P12: ${{ github.event_name != 'pull_request' && secrets.APPLE_DEVELOPER_ID_P12 || '' }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_NOTARY_KEY_P8: ${{ github.event_name != 'pull_request' && secrets.APPLE_NOTARY_KEY_P8 || '' }}
          APPLE_NOTARY_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          APPLE_NOTARY_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
      - name: Drop
        run: |
          v="$VERSION"
          [ -z "$v" ] && v="$(bun -p 'require("./apps/" + process.env.APP + "/package.json").version')"
          bun scripts/drop.ts --app "$APP" --version "$v" --channel "$CHANNEL" ${{ (inputs.dry || github.event_name == 'pull_request') && '--dry out' || '' }} bins/*
        env:
          # The version and channel can come from a typed input, so through env, not the script.
          APP: ${{ matrix.app }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          SIGNED: ${{ steps.sign.outputs.signed }}   # the page drops the xattr note for signed Mac builds
          # One bucket for every app's drops; each app gets its own top-level folder.
          CLOUDFLARE_ACCOUNT_ID: c2d417e655e0ef55de8fe2d07874f521
          R2_BUCKET: rustybuns-drops
          R2_PUBLIC_URL: ${{ vars.DROPS_PUBLIC_URL }}
          # A PR runs its own drop.ts, which could ignore --dry, so a PR gets no secrets at all
          # (a dry run fills in placeholders).
          CLOUDFLARE_API_TOKEN: ${{ github.event_name != 'pull_request' && secrets.DROPS_CLOUDFLARE_API_TOKEN || '' }}  # R2 token: Object Read & Write on rustybuns-drops only
          DROP_SECRET: ${{ github.event_name != 'pull_request' && secrets.DROP_SECRET || '' }}
      - name: Keep the signed binaries for the release
        if: github.event_name == 'push' && needs.plan.outputs.channel == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.app }}
          path: bins/*
          if-no-files-found: error
          retention-days: 1

  # The only job that can write to the repo, and it never runs a PR's code: it takes the binaries
  # the drop job signed and attaches them to a release for the tag.
  release:
    needs: [plan, drop]
    if: ${{ github.event_name == 'push' && needs.plan.outputs.channel == 'stable' && needs.drop.result == 'success' }}
    name: release ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    permissions:
      contents: write   # the GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: bins, name: "release-${{ matrix.app }}" }
      - name: GitHub Release
        run: |
          app="$APP"; v="$VERSION"
          (cd bins && shasum -a 256 * > SHA256SUMS)
          if [ "$SIGNED" = true ]; then
            mac="**Mac:** signed and notarized by Apple. In Terminal: \`cd ~/Downloads && chmod +x $app-darwin-*\` (a download drops the bit), then \`./$app-darwin-arm64\` (or \`-x64\`)."
          else
            mac="**Mac:** it isn't signed, so macOS blocks a double click. In Terminal: \`cd ~/Downloads && chmod +x $app-darwin-* && xattr -d com.apple.quarantine $app-darwin-*\`, then \`./$app-darwin-arm64\` (or \`-x64\`)."
          fi
          cat > notes.md <<EOF
          Desktop binaries for [$app](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME/apps/$app), built from $GITHUB_REF_NAME. One file, nothing to install: Bun is inside.

          Pick yours: \`darwin-arm64\` is a Mac with Apple silicon, \`darwin-x64\` an Intel Mac, \`windows-x64\` Windows, \`windows-arm64\` Windows on Arm (Snapdragon), \`linux-x64\` / \`linux-arm64\` Linux.

          $mac

          **Windows:** SmartScreen may warn about an unknown app: More info, then Run anyway.

          **Linux:** \`chmod +x $app-linux-*\` and run it.
          EOF
          # --latest=false: the repo's "latest" release stays the npm packages' one.
          gh release create "$GITHUB_REF_NAME" bins/* --title "$app $v" --notes-file notes.md --latest=false --verify-tag
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: ${{ github.repository }}   # no checkout in this job
          APP: ${{ matrix.app }}
          VERSION: ${{ needs.plan.outputs.version }}
          SIGNED: ${{ needs.drop.outputs.signed }}
