# Hippo Tycoon is pure TypeScript, so one Linux job tests it and cross-compiles
# a binary for every desktop target (no per-OS matrix, unlike apps with a Rust cdylib).
name: hippo-tycoon
on:
  push:
    paths: ["apps/hippo-tycoon/**", "packages/**", ".github/workflows/hippo-tycoon.yml"]
  pull_request:
    paths: ["apps/hippo-tycoon/**", "packages/**", ".github/workflows/hippo-tycoon.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hippo-tycoon
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - run: bun install
        working-directory: .
      - run: bun test test             # sim, bots, room, wire, worker, and the real LAN party
      - name: Build a binary for every target
        run: |
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            bun ../../packages/cli/src/index.ts build desktop --check --target "$t"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hippo-tycoon
          path: apps/hippo-tycoon/dist/hippo-tycoon-*
