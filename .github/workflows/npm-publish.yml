# The @rustybuns packages go to npm from here, never a laptop: npm trusted publishing
# (OIDC, no token anywhere) with --provenance, so each version links back to this
# run and commit. Push a tag v<x.y.z> on any commit (the stable ring's pick) to publish that
# commit as x.y.z: the version comes from the tag, not packages/*/package.json;
# run it from the Actions tab to only pack and dry-run.
# Bun packs (it turns workspace:* into versions); npm publishes, since trusted
# publishing and provenance are npm's.
name: npm-publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: npm-publish

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The npm environment (trusted publishing checks it) only on a tag push: a dispatch from a branch only packs and dry-runs.
    environment: ${{ github.event_name == 'push' && 'npm' || '' }}
    permissions:
      contents: read
      id-token: write   # the OIDC token npm trades for a one-off publish credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }   # no registry-url: its placeholder token would stand in for OIDC
      - run: npm install -g npm@11.6.2   # trusted publishing needs npm 11.5.1+
      - run: bun install --frozen-lockfile --ignore-scripts   # no package's install script next to the publish credential
      # A tag push sets the tag's version at pack time (#4528), so the tag goes on the commit the stable ring soaked
      # and no bump commit has to land on top of it first. A dispatch only checks what main says.
      - name: Version from the tag
        run: |
          if [ "${{ github.event_name }}" = push ]; then bun scripts/check-release.ts --set "${GITHUB_REF_NAME#v}"
          else bun scripts/check-release.ts; fi
      - name: Pack
        run: for p in $(bun scripts/check-release.ts --list); do (cd "packages/$p" && bun pm pack --destination ../../npm-dist --quiet); done
      - name: Publish
        # Dependencies first (check-release.ts --list), so nothing lands pointing at a version that isn't up yet.
        # A version already on npm is skipped, so re-running a half-failed release finishes it.
        run: |
          for p in $(bun scripts/check-release.ts --list); do
            v="$(bun -p "require('./packages/$p/package.json').version")"
            if [ "${{ github.event_name }}" = push ] && npm view "@rustybuns/$p@$v" version >/dev/null 2>&1; then echo "@rustybuns/$p@$v is already up"; continue; fi
            npm publish ./npm-dist/rustybuns-$p-*.tgz --provenance --access public ${{ github.event_name != 'push' && '--dry-run' || '' }}
          done
