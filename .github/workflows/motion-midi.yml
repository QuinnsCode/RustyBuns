# Motion MIDI: the Rust cdylib doesn't cross-compile, so each OS builds its own
# library and its own binary. Artifacts: one desktop binary per platform.
name: motion-midi
on:
  push:
    paths: ["apps/motion-midi/**", "packages/**", ".github/workflows/motion-midi.yml"]
  pull_request:
    paths: ["apps/motion-midi/**", "packages/**", ".github/workflows/motion-midi.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/motion-midi
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install
        working-directory: .
      - run: bun run build:native
      - run: bun test test            # includes the Rust == TS golden test
      - run: bun ../../packages/cli/src/index.ts build desktop --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: motion-midi-${{ matrix.target }}
          path: apps/motion-midi/dist/motion-midi-*
