# Motion MIDI, everyday check: one Linux job, Rust == TS golden test, no binaries.
# Desktop binaries for every OS come from motion-midi-drop.yml, run on milestones.
name: motion-midi
on:
  push:
    branches: [main]
    paths: ["apps/motion-midi/**", "packages/native/**", ".github/workflows/motion-midi.yml"]
  pull_request:
    paths: ["apps/motion-midi/**", "packages/native/**", ".github/workflows/motion-midi.yml"]
  workflow_dispatch:

concurrency:
  group: motion-midi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/motion-midi
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/motion-midi/native }
      - run: bun install
        working-directory: .
      - run: bun run build:native
      - run: bun test test            # includes the Rust == TS golden test
