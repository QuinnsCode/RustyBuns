# The stable ring (notes/RELEASE_RINGS.md step 7, #4494), Monday after deps-doctor (06:17 UTC): scripts/stable.ts picks
# the newest commit whose daily run and the two dailies after it were green, writes release notes from the squash titles
# since the last v* tag, and opens one MANUAL RUN taste issue for `bun run manual` (or moves last week's open one).
# The owner pushes the v tag and approves npm (npm-publish.yml), as before. Until the daily ring (#4493) has three greens
# in a row it logs that there's nothing to pick and stays green.
name: stable
on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pick:
    if: github.ref == 'refs/heads/main'   # issues: write, so only main's copy of this file runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # the tags and the squash titles since the last one
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - run: bun scripts/stable.ts "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
