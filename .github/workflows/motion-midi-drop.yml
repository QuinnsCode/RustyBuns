# Motion MIDI milestone drop: build the desktop binary on every OS (the Rust
# cdylib doesn't cross-compile), then put them all in R2 under an unguessable
# folder with a page to share. Run it from the Actions tab, or push a tag
# motion-midi-v0.2.0. The link is in the run summary.
name: motion-midi-drop
on:
  push:
    tags: ["motion-midi-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the folder (default: apps/motion-midi/package.json version)"
        required: false

concurrency:
  group: motion-midi-drop-${{ github.ref }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/motion-midi
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/motion-midi/native }
      - run: bun install
        working-directory: .
      - run: bun run build:native
      - run: bun test test            # a shipped binary still gets the golden test on its own OS
      - run: bun ../../packages/cli/src/index.ts build desktop --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: motion-midi-${{ matrix.target }}
          path: apps/motion-midi/dist/motion-midi-*
          retention-days: 7

  drop:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: actions/download-artifact@v4
        with: { path: bins, pattern: motion-midi-*, merge-multiple: true }
      - name: Version
        id: v
        run: |
          v="${{ inputs.version }}"
          [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/motion-midi-v* ]] && v="${GITHUB_REF#refs/tags/motion-midi-v}"
          [ -z "$v" ] && v="$(jq -r .version apps/motion-midi/package.json)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: bun scripts/drop.ts --app motion-midi --version "${{ steps.v.outputs.version }}" bins/*
        env:
          # One bucket for every app's drops; each app gets its own top-level folder.
          CLOUDFLARE_ACCOUNT_ID: c2d417e655e0ef55de8fe2d07874f521
          R2_BUCKET: rustybuns-drops
          R2_PUBLIC_URL: ${{ vars.DROPS_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.DROPS_CLOUDFLARE_API_TOKEN }}  # R2 write on rustybuns-drops only
          DROP_SECRET: ${{ secrets.DROP_SECRET }}
