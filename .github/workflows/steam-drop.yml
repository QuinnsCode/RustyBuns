# Steam builds (#2877): `rustybuns build steam` on one runner per OS, then SteamPipe.
# Each app with targets.steam in its rustybuns.config.ts gets a depot per OS: its desktop host
# inside an Electron window with steamworks.js (packages/cli/src/steam.ts).
#
# A tag <app>-v1.3.0-beta.2 uploads and sets the Steam `beta` branch live. A stable tag
# <app>-v1.3.0 uploads only: setting it live on the default branch is the owner's click in
# Steamworks. Uploads run in the `drops` environment, which waits for the owner's approval.
# A PR that changes the Steam lane, and a dry dispatch, build the depots and stop there.
#
# Secrets in `drops`: STEAM_USERNAME (a builder account with Edit App Metadata + Publish), and
# STEAM_CONFIG_VDF, base64 of config/config.vdf from a machine where that account logged in to
# steamcmd once, so Steam Guard doesn't ask CI for a code.
name: steam-drop
on:
  push:
    tags: ["*-v*"]
  pull_request:
    paths: [".github/workflows/steam-drop.yml", "packages/cli/src/steam.ts", "packages/cli/src/steam-shell/**"]
  workflow_dispatch:
    inputs:
      app:
        description: "An app with targets.steam"
        default: hippo-tycoon
      dry:
        description: "Dry run: build the depots as run artifacts, upload nothing to Steam"
        type: boolean
        default: true

concurrency:
  group: steam-drop-${{ github.ref }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.p.outputs.app }}
      version: ${{ steps.p.outputs.version }}
      live: ${{ steps.p.outputs.live }}
      steam: ${{ steps.p.outputs.steam }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: p
        # Inputs go through env, never pasted into the script.
        env:
          APP: ${{ inputs.app || 'hippo-tycoon' }}
        run: |
          app="$APP"; version=""; live=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"; app="${tag%-v*}"; version="${tag##*-v}"
            [[ "$version" == *-* ]] && live=beta
          fi
          [[ "$app" =~ ^[a-z0-9-]+$ ]] || { echo "bad app: $app"; exit 1; }
          [[ -z "$version" || "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "bad version: $version"; exit 1; }
          # Only apps that ship on Steam: a tag for any other app ends here.
          steam=false; grep -qE '^\s+steam: \{' "apps/$app/rustybuns.config.ts" 2>/dev/null && steam=true
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"; echo "steam=$steam" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.steam == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, os: windows, runner: windows-latest }
          - { target: darwin-arm64, os: darwin, runner: macos-latest }
          - { target: linux-x64, os: linux, runner: ubuntu-latest }
    name: ${{ needs.plan.outputs.app }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/${{ needs.plan.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; the toolchain is the input below
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - run: bun install --frozen-lockfile
        working-directory: .
      # An app with native/ builds its crates for this runner's OS first.
      - run: if [ -f native/Cargo.toml ]; then bun run build:native; fi
      # 1.4.4 compiles the host, as desktop-drop.yml does (#2228, #2506).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.4" }
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bunx rustybuns build steam --target ${{ matrix.target }} ${VERSION:+--version "$VERSION"}
      # A tar keeps the executable bits that an artifact zip drops.
      - run: tar -cf "depot-${{ matrix.os }}.tar" -C dist/steam/depots ${{ matrix.os }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-depot-${{ matrix.os }}
          path: apps/${{ needs.plan.outputs.app }}/depot-${{ matrix.os }}.tar
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [plan, build]
    if: needs.plan.outputs.steam == 'true'
    name: steampipe ${{ needs.plan.outputs.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Secrets only behind the owner's approval; a PR or a dry dispatch gets none and asks for none.
    environment: ${{ github.event_name != 'pull_request' && !inputs.dry && 'drops' || '' }}
    defaults:
      run:
        working-directory: apps/${{ needs.plan.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.3" }
      - run: bun install --frozen-lockfile
        working-directory: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: steam-depot-*
          path: apps/${{ needs.plan.outputs.app }}/dist/steam/tars
          merge-multiple: true
      - run: |
          mkdir -p dist/steam/depots
          for t in dist/steam/tars/*.tar; do tar -xf "$t" -C dist/steam/depots; done
          rm -rf dist/steam/tars
          du -sh dist/steam/depots/*
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
          LIVE: ${{ needs.plan.outputs.live }}
        run: |
          bunx rustybuns build steam --vdf-only ${VERSION:+--version "$VERSION"} ${LIVE:+--live "$LIVE"}
          cat dist/steam/app_build.vdf
          { echo "### Steam depots"; echo; du -sh dist/steam/depots/* | sed 's/^/- /'; echo; echo '```'; cat dist/steam/app_build.vdf; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name != 'pull_request' && !inputs.dry
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          [ -n "$STEAM_USERNAME" ] && [ -n "$STEAM_CONFIG_VDF" ] || { echo "STEAM_USERNAME and STEAM_CONFIG_VDF are not set in the drops environment"; exit 1; }
          sudo apt-get install -y -q lib32gcc-s1      # steamcmd is 32-bit
          mkdir -p ~/steamcmd/config ~/Steam/config
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C ~/steamcmd
          # steamcmd reads its login from beside itself, or from ~/Steam once it has updated itself.
          echo "$STEAM_CONFIG_VDF" | base64 -d | tee ~/steamcmd/config/config.vdf > ~/Steam/config/config.vdf
          ~/steamcmd/steamcmd.sh +login "$STEAM_USERNAME" +run_app_build "$PWD/dist/steam/app_build.vdf" +quit
