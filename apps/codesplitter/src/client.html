// The landing intro, calm to swarm: a file sits still on clean paper; a slit
// opens across it; its lines tear free and take off as a flock, swooping and
// circling while agents edit them; then they dive back and land in order as a
// git commit. Positions are computed per frame (no layout transitions).
let stopIntro = () => {};
function intro(stage, phases) {
  const before = ["// my taste in code", "var foo = 0", "function add(n) {", "  foo = foo + n", "  return foo", "}"];
  const edits = [[1, "let total = 0", "agent-linter"], [3, "  total = total + n", "agent-renamer"], [4, "  return total", "agent-renamer"], [0, "// my taste in code, tidied", "you"]];
  // Perches, as fractions of the stage: spread out, never overlapping.
  const perch = [[.03, .06], [.54, .03], [.30, .36], [.60, .47], [.04, .68], [.45, .80]];
  stage.innerHTML = before.map((t) => `<div class="piece"><span class="who">ryan</span><span class="txt">${esc(t)}</span></div>`).join("")
    + `<div class="slit"></div><div class="seal"></div>`;
  const pieces = [...stage.querySelectorAll(".piece")], seal = $(".seal", stage), slit = $(".slit", stage);
  const mark = (n) => [...phases.children].forEach((li, i) => li.classList.toggle("on", i === n));
  const reset = () => pieces.forEach((p, i) => { $(".txt", p).textContent = before[i]; $(".who", p).textContent = "ryan"; p.classList.remove("apart", "hit"); });
  const home = (i) => [0, 14 + i * 24.7];
  const spot = (i, W, H) => [perch[i][0] * W, perch[i][1] * H];
  // A quadratic curve: start, a control point the bird arcs through, end.
  const bez = (a, c, b, t) => [(1 - t) ** 2 * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]];
  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
  const clamp = (t) => Math.max(0, Math.min(1, t));
  const T = { split: 1200, fly: 1800, hover: 3400, dive: 6400, land: 7900, loop: 10800 };
  let t0 = 0, raf = 0, timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function frame(now) {
    const t = now - t0, W = stage.clientWidth, H = stage.clientHeight;
    pieces.forEach((p, i) => {
      const h = home(i), s = spot(i, W, H), lag = i * 90;
      s[0] = Math.max(4, Math.min(s[0], W - p.offsetWidth - 6));   // a long line still perches inside a narrow stage
      let [x, y] = h, r = 0, k = 1;
      if (t >= T.fly + lag && t < T.dive + lag) {
        // Hovering at the perch: a slow loop, a little bob, the odd wingbeat.
        const w = (t - T.fly - lag) / 1000, wob = Math.min(1, w / .6);
        x = s[0] + Math.sin(w * 2.1 + i) * 10 * wob;
        y = s[1] + Math.cos(w * 2.7 + i * 1.7) * 6 * wob;
        r = Math.sin(w * 3 + i) * 2 * wob;
        // Takeoff: arc up through the sky above the stage centre, flapping.
        const f = clamp((t - T.fly - lag) / 1300);
        if (f < 1) {
          const e = ease(f), c = [W * (.25 + .5 * ((i * 37) % 10) / 10), -H * (.35 + (i % 3) * .1)];
          [x, y] = bez(h, c, s, e);
          r = Math.sin(f * 26) * 9 * (1 - f);
          k = 1 + Math.sin(f * 26) * .06 * (1 - f);
        }
      } else if (t >= T.dive + lag) {
        // The dive home: drop below the line first, then sweep up into place.
        const f = clamp((t - T.dive - lag) / 1100), e = ease(f);
        const from = [s[0] + Math.sin(((T.dive - T.fly) / 1000) * 2.1 + i) * 10, s[1] + Math.cos(((T.dive - T.fly) / 1000) * 2.7 + i * 1.7) * 6];
        [x, y] = bez(from, [W * (.1 + (i % 4) * .2), H * 1.05], h, e);
        r = (1 - f) * (i % 2 ? -14 : 14) * Math.sin(f * Math.PI);
      }
      p.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${k.toFixed(3)})`;
    });
    if (t < T.loop) raf = requestAnimationFrame(frame);
  }

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cycle = () => {
    timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf);
    reset(); seal.classList.remove("on"); slit.classList.remove("go"); mark(0);
    if (still) {
      pieces.forEach((p, i) => { const [x, y] = home(i); p.style.transform = `translate(${x}px, ${y}px)`; });
      edits.forEach(([i, t, who]) => { $(".txt", pieces[i]).textContent = t; $(".who", pieces[i]).textContent = who; });
      seal.textContent = "a014902 · pushed to git"; seal.classList.add("on"); mark(3);
      return;
    }
    t0 = performance.now(); raf = requestAnimationFrame(frame);
    at(T.split, () => { slit.classList.add("go"); mark(1); });
    at(T.fly - 100, () => pieces.forEach((p) => p.classList.add("apart")));
    edits.forEach(([i, t, who], k) => at(T.hover + 400 + k * 650, () => {
      mark(2);
      const p = pieces[i];
      $(".txt", p).textContent = t; $(".who", p).textContent = who;
      p.classList.remove("hit"); void p.offsetWidth; p.classList.add("hit");
    }));
    at(T.dive, () => mark(3));
    at(T.land + 300, () => pieces.forEach((p) => p.classList.remove("apart")));
    at(T.land + 500, () => { seal.textContent = Math.random().toString(16).slice(2, 9) + " · pushed to git"; seal.classList.add("on"); });
    at(T.loop, cycle);
  };
  stopIntro = () => { timers.forEach(clearTimeout); cancelAnimationFrame(raf); };
  cycle();
}

// ---- the command palette ---------------------------------------------------------------
// Commands depend on where you are. Each names the one API call it makes.
/** A branch's (or main's) check runs as a row of pills, ours and GitHub's, and why a merge waits on them. */
const CHECK_ICONS = { queued: "circle-dashed", running: "loader", passed: "circle-check", failed: "circle-x", cancelled: "circle-slash" };
function checkRow(c) {
  if (!c || (!c.runs.length && !c.gate.required.length && !c.where)) return "";
  const runs = c.runs.map((r) => {
    const label = `${icon(CHECK_ICONS[r.status])}${esc(r.name)} <span class="muted">${r.runner === "github" ? "GitHub" : esc(r.runner === "external" && r.runner_label || r.runner)} · ${r.status}</span>`;
    return `<span class="check ${r.status}" title="${esc(r.name)}: ${r.status}">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${label}</a>` : label}</span>`;
  }).join("");
  const g = c.gate, why = g.ok ? "" : [g.failed.length && `${g.failed.join(", ")} failed`, g.waiting.length && `waiting on ${g.waiting.join(", ")}`].filter(Boolean).join("; ");
  const later = g.deferred?.length ? `<span class="muted">${icon("cloud-off")} GitHub is down: ${esc(g.deferred.join(", "))} put off until it's back. Ours passed, so it merges now.</span>` : "";
  const tip = !g.ok && c.offline ? " GitHub is down: run checks here, and once they pass it can merge without it." : "";
  return `<span class="checks">${icon("list-checks")}${runs || '<span class="muted">No checks yet</span>'}${c.sha ? `<code class="muted">${esc(c.sha.slice(0, 7))}</code>` : ""}</span>${why ? `<span class="muted">${icon("shield-alert")} Merge waits for required checks: ${esc(why)}.${esc(tip)}</span>` : ""}${later}`;
}

/**
 * Above the branches: where checks run (GitHub first for a mirror, here always on offer),
 * what to expect while GitHub is down, and main's own checks, where GitHub's catch up.
 */
async function wireCheckHead(el, owner, repo, r) {
  const [s, main] = await Promise.all([api(`/repos/${owner}/${repo}/checks/settings`).catch(() => null), api(`/repos/${owner}/${repo}/checks?ref=main`).catch(() => null)]);
  if (!s) return;
  document.getElementById("checkhead")?.remove();
  const isOwner = owner === me();
  const opts = [...(s.github ? [["github", "On GitHub, here when it's down"]] : []), ["here", "Here, on this machine"], ...(s.github ? [["both", "Here and on GitHub"]] : [])];
  const pick = isOwner ? `<label class="muted" style="font-size:12px">${icon("list-checks")} Checks run <select id="check-where" autocomplete="off">${s.where ? "" : `<option value="" selected>nowhere yet</option>`}${opts.map(([v, t]) => `<option value="${v}"${s.where === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>
    <span id="check-where-save" hidden><button class="btn primary" title="save where checks run">${icon("check")}Save</button><button class="btn ghost" title="put it back">${icon("x")}</button></span>` : "";
  const down = s.offline ? `<span class="muted">${icon("cloud-off")} GitHub has been down${s.down_since ? ` since ${new Date(s.down_since).toLocaleTimeString()}` : ""}. Keep going: commits, branches and merges work here, checks run on this machine, and everything syncs to GitHub when it's back.</span>` : "";
  const mainRow = main?.runs.length ? `<div class="commit"><code>main</code><span class="muted">checks on the latest commit${s.github ? ", GitHub's included once it has them" : ""}</span>${checkRow(main)}</div>` : "";
  if (!pick && !down && !mainRow) return;
  const ci = isOwner ? `<details id="citokens" style="margin-top:6px"><summary class="muted" style="font-size:12px;cursor:pointer">${icon("key-round")} CI tokens: report checks from Jenkins, CircleCI or any CI that talks to GitHub</summary><div class="body"></div></details>` : "";
  el.insertAdjacentHTML("beforebegin", `<div id="checkhead" class="commit" style="display:block">${pick}${down ? `<div>${down}</div>` : ""}${mainRow}${ci}</div>`);
  $("#citokens")?.addEventListener("toggle", (e) => { if (e.target.open) wireCiTokens(owner, repo); }, { once: true });
  // Picking an option only stages it: a focused select also changes on a stray key (type-ahead,
  // arrows) or a scroll, so nothing is saved until Save is clicked (#657).
  const sel = $("#check-where"), save = $("#check-where-save"), saved = s.where ?? "";
  sel?.addEventListener("change", () => { save.hidden = sel.value === saved; });
  save?.lastElementChild.addEventListener("click", () => { sel.value = saved; save.hidden = true; });
  save?.firstElementChild.addEventListener("click", async (e) => {
    if (!e.isTrusted || sel.value === saved) return;
    try { await api(`/repos/${owner}/${repo}/checks/settings`, { where: sel.value || null }, "PUT"); toast(sel.value === "here" ? "Checks run here now: local first" : "Saved"); route(); }
    catch (err) { toast(err.message); }
  });
  icons();
}

// A repo's CI tokens (GET|POST /api/repos/:o/:r/checks/tokens, DELETE …/:id; src/gh-compat.ts), in the checks head, for its owner.
// External CI points its GitHub API base URL at /api/gh/v3 and sends one as its GitHub token. A new one's secret shows once, masked.
const ghBase = () => `${location.origin}/api/gh/v3`;
async function wireCiTokens(owner, repo, made) {
  const el = $("#citokens .body");
  if (!el) return;
  const base = `/repos/${owner}/${repo}/checks/tokens`, list = await api(base).catch(() => []);
  const fresh = made ? `<div style="display:grid;gap:4px;margin:6px 0"><b>${icon("key-round")} ${esc(made.label)}</b><span class="muted" style="font-size:12px">Copy it now: it won't be shown again. Give it to your CI as its GitHub token.</span>
      <div class="copyline"><input readonly value="${esc(masked(made.token))}" title="hidden: copy it with the button"><button class="btn" id="citoken-copy" title="copy the token">${icon("copy")}</button></div></div>` : "";
  el.innerHTML = `<div style="display:grid;gap:4px;margin:6px 0"><span class="muted" style="font-size:12px">Set your CI's GitHub API URL (the GitHub Enterprise option) to this, and its statuses and check runs land here, gating merges like any other check.</span>
      <div class="copyline"><input readonly value="${esc(ghBase())}"><button class="btn" id="ghbase-copy" title="copy the URL">${icon("copy")}</button></div></div>` + fresh
    + `<div class="list">${list.map((t) => `<div class="row" style="flex-wrap:nowrap">${icon("server")}<span style="flex:1;min-width:0">${esc(t.label)} <span class="muted">· …${esc(t.last4)} · ${t.expired ? "expired" : `expires ${new Date(t.expires_at).toLocaleDateString()}`}${t.last_used_at ? ` · used ${ago(t.last_used_at)}` : " · never used"}</span></span>
      <button class="btn ghost" data-revoke="${esc(t.id)}" title="revoke">${icon("trash-2")}</button></div>`).join("")}</div>
    <form id="newcitoken" style="display:flex;gap:6px;margin:8px 0 4px"><input name="label" placeholder="which CI, like jenkins" maxlength="60" required style="flex:1;min-width:0">
      <select name="days" title="how long it lasts"><option value="30">30 days</option><option value="90" selected>90 days</option><option value="365">1 year</option></select><button class="btn primary">${icon("plus")}Make</button></form>`;
  icons();
  $("#ghbase-copy").addEventListener("click", () => copy(ghBase(), "URL copied"));
  $("#citoken-copy")?.addEventListener("click", () => copy(made.token, "Token copied"));
  $("#newcitoken").addEventListener("submit", async (e) => {
    e.preventDefault();
    try { wireCiTokens(owner, repo, await api(base, { label: e.target.elements.label.value, days: Number(e.target.elements.days.value) })); } catch (err) { toast(err.message); }
  });
  el.querySelectorAll("[data-revoke]").forEach((b) => b.addEventListener("click", async () => {
    try { await api(`${base}/${b.dataset.revoke}`, undefined, "DELETE"); toast("CI token revoked"); wireCiTokens(owner, repo); } catch (err) { toast(err.message); }
  }));
}

async function commands() {
  const out = [], add = (group, ic, title, apiCall, run, ask) => out.push({ group, ic, title, api: apiCall, run, ask });
  const c = ctx, u = me();
  if (c.view === "f") {
    // The picked runs of lines, or the ones typed in, like 4-12.
    const range = c.sel ? runsLabel(c.sel) : null, one = c.sel?.length === 1 ? c.sel[0] : null;
    const typed = (arg) => { const [from, to] = String(arg).split(/[-–, ]+/).map(Number); return [[from, to || from]]; };
    if (u) add("This file", "share-2", one ? `Share ${range}` : "Share lines…", `POST /api/repos/${c.owner}/${c.repo}/shares`, async (arg) => {
      const [[from, to]] = one ? [one] : typed(arg);
      const s = await api(`/repos/${c.owner}/${c.repo}/shares`, { path: c.path, from, to });
      copy(`${location.origin}/#/s/${s.id}`, `Link to lines ${s.from}–${s.to} copied`);
    }, one ? null : "which lines, like 4-12");
    if (u) add("This file", "thumbs-up", range ? `Stamp ${range} +1` : "Stamp lines +1…", `POST /api/repos/${c.owner}/${c.repo}/stamps`, async (arg) => {
      for (const [from, to] of c.sel ?? typed(arg)) await api(`/repos/${c.owner}/${c.repo}/stamps`, { path: c.path, stamp: "+1", from, to });
      await c.loadStamps?.();
    }, c.sel ? null : "which lines, like 4-12");
    if (c.canWrite && !c.branch && range) add("This file", "lock", `${$("#lock span")?.textContent ?? "Make private"}: ${range}`, `POST /api/repos/${c.owner}/${c.repo}/do/private`, async () => $("#lock").click());
    if (c.canWrite) add("This file", "scissors", range ? `Cut ${range} out` : "Cut lines out…", `POST /api/repos/${c.owner}/${c.repo}/cuts`, async (arg) => {
      location.hash = "#/c/" + (await cutLines(c.owner, c.repo, (c.sel ?? typed(arg)).map(([from, to]) => ({ path: c.path, from, to })))).id;
    }, c.sel ? null : "which lines, like 4-12");
    if (c.canWrite && !c.branch) add("This file", "git-commit-horizontal", "Commit this file", `POST /api/repos/${c.owner}/${c.repo}/do/commit`, async (msg) => {
      const r = await api(`${c.base}/commit${c.q}`, { message: msg }); toast(r.git?.commit ? `Pushed ${r.git.commit.slice(0, 7)}` : "Committed");
    }, "commit message");
    for (const h of c.agents?.harnesses ?? []) add("This file", "bot", `Give ${h} a task on this file`, `POST /api/repos/${c.owner}/${c.repo}/agents`, async (task) => {
      await api(`/repos/${c.owner}/${c.repo}/agents`, { path: c.path, harness: h, task }); toast(`agent-${h} is on it`); c.pollAgents?.();
    }, "the task");
    if (c.agents?.harnesses?.length) add("This file", "square", "Stop every agent on this file", `POST /api/repos/${c.owner}/${c.repo}/agents/stop`, async () => {
      const { stopped } = await api(`/repos/${c.owner}/${c.repo}/agents/stop`, { path: c.path }); toast(stopped.length ? `Stopped ${stopped.length} agent${stopped.length > 1 ? "s" : ""}` : "Nothing was running"); c.pollAgents?.();
    });
  }
  if (c.view === "f" || c.view === "r") {
    if (c.canWrite) add("This repo", "file-plus", "Add a file", `POST /api/repos/${c.owner}/${c.repo}/files`, async (p) => {
      await api(`/repos/${c.owner}/${c.repo}/files`, { path: p, content: "" }); location.hash = `#/f/${c.owner}/${c.repo}/${encodeURIComponent(p)}`;
    }, "path, like src/hello.ts");
    if (c.isOwner) add("This repo", "user-plus", "Invite someone to the crew", `POST /api/repos/${c.owner}/${c.repo}/invites`, async (who) => {
      const i = await invite(c.owner, c.repo, who); await copy(i.link, `${inviteSaid(i)} Link copied`); route();
    }, "@handle or email");
    if (c.isOwner) add("This repo", c.visibility === "private" ? "globe" : "lock", c.visibility === "private" ? "Make this repo public" : "Make this repo private", `PUT /api/repos/${c.owner}/${c.repo}`, async () => {
      await api(`/repos/${c.owner}/${c.repo}`, { visibility: c.visibility === "private" ? "public" : "private" }, "PUT"); route();
    });
    if (c.isOwner) add("This repo", "trash-2", "Delete this repo", `DELETE /api/repos/${c.owner}/${c.repo}?confirm=${c.repo}`, async (name) => {
      try { await deleteRepo(c.owner, c.repo, name.trim()); } catch (e) { toast(e.message); }
    }, `type ${c.repo} to confirm`);
    if (c.canWrite) add("This repo", "git-branch-plus", "Start a branch", `POST /api/repos/${c.owner}/${c.repo}/branches`, (name) => startBranch(c.owner, c.repo, name), "branch name");
    if (c.canWrite) out.at(-1).tidy = tidyBranch;
    if (c.canWrite) add("This repo", "git-merge", "Merge a branch", `POST /api/repos/${c.owner}/${c.repo}/branches/:name/merge`, async (name) => {
      try { await api(`/repos/${c.owner}/${c.repo}/branches/${encodeURIComponent(name)}/merge`, {}); toast(`Merged ${name}`); if (branchPicked(c.owner, c.repo) === name) pickBranch(c.owner, c.repo, null); } catch (e) { toast(`Not merged: ${e.message}`); }
      route();
    }, "branch name");
    if (c.canWrite) add("This repo", "list-checks", "Run checks", `POST /api/repos/${c.owner}/${c.repo}/checks/run`, async (ref) => {
      try { await api(`/repos/${c.owner}/${c.repo}/checks/run`, { ref: ref.trim() || "main" }); toast(`Checks queued on ${ref.trim() || "main"}`); route(); } catch (e) { toast(`Not queued: ${e.message}`); }

    <div class="tour-dots">${TOUR.map((_, k) => `<i class="${k <= t.i ? "on" : ""}"></i>`).join("")}</div>
    <p>${esc(s.say(t))}</p><p class="tour-said" aria-live="polite"></p>
    <div class="tour-btns">${t.i ? `<button class="btn" data-back title="back">${icon("arrow-left")}</button>` : ""}<span class="grow"></span>
      ${s.go || s.href || s.panels ? `<button class="btn primary" data-go>${icon("zap")}${s.href ? (s.open ? "Open it" : "Go") : s.panels ? "Show me" : "Do it"}</button>` : ""}
      ${last ? "" : `<button class="btn" data-next>Next${icon("arrow-right")}</button>`}</div>`;
  document.body.append(card); icons();
  const said = $(".tour-said", card), hot = s.at && $(s.at);
  if (hot) { hot.classList.add("tour-hot"); hot.scrollIntoView?.({ block: "nearest", behavior: "smooth" }); }
  const step = (i) => { tourSave({ ...t, i }); tour(); };
  card.addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if ("x" in b.dataset) return tourStop(true);
    if ("back" in b.dataset) return step(t.i - 1);
    if ("next" in b.dataset) return step(t.i + 1);
    if (!("go" in b.dataset)) return;
    if (s.href) { if (last) tourStop(true); else step(t.i + 1); return s.open ? open(s.href(t), "_blank", "noopener") : (location.href = s.href(t)); }
    if (s.panels) {
      // Open each panel in turn, flash it, and say what it's for.
      const secs = $$(".dpanels > .sec").filter((x) => PANEL_SAY[x.dataset.key]);
      let k = 0; clearInterval(tourTimer); b.disabled = true; hot?.classList.remove("tour-hot");
      const show = () => {
        $$(".dpanels > .sec.tour-hot").forEach((x) => x.classList.remove("tour-hot"));
        const x = secs[k++]; if (!x) { clearInterval(tourTimer); b.disabled = false; said.textContent = "That's the lot."; return; }
        x.classList.remove("shut"); x.classList.add("tour-hot"); x.scrollIntoView({ block: "nearest", behavior: "smooth" });
        said.textContent = `${x.querySelector("h2").textContent.trim()}: ${PANEL_SAY[x.dataset.key]}`;
      };
      show(); tourTimer = setInterval(show, 1600); return;
    }
    b.disabled = true; said.textContent = "…";
    try { said.textContent = (await s.go(t)) || ""; } catch (err) { said.textContent = err.message; }
    finally { b.disabled = false; }
  });
}

// Views and how many plain segments come before a path tail: #/f/owner/repo/<path>.
const FIXED = { f: 2, r: 2, l: 1, b: 2 };
// Settles when the page has drawn, so an agent's tool call can answer with where it landed.
let routing = Promise.resolve();
async function route() {
  let drawn; routing = new Promise((r) => (drawn = r));
  followed = fetchingFollows = null;
  socket?.close(); socket = null;
  clearTimeout(agentTimer);
  stopIntro();
  stopStrip();
  stopBoard();
  stopWord();
  clearTimeout(levelPoll);
  document.body.classList.remove("ide-mode");
  $("#wiremap")?.shut();
  const [, view = "home", ...args] = location.hash.replace(/^#/, "").split("/");
  const n = FIXED[view];
  const parts = n === undefined ? args.map(decodeURIComponent) : [...args.slice(0, n).map(decodeURIComponent), decodeURIComponent(args.slice(n).join("/"))];
  try { await (views[view] && view !== "repoHead" && view !== "wireRepoHead" ? views[view] : views.home)(...parts); }
  catch (err) {
    const b = err.onBranch;
    app.innerHTML = `<div class="wrap" style="padding-top:24px"><h1 class="sr">Couldn't open this page</h1><div class="box"><div class="body">${esc(err.message)}${b ? ` on branch <code>${esc(b[2])}</code> <button class="btn" id="err-main">${icon("undo-2")}Back to main</button>` : ""}</div></div></div>`;
    if (b) { $("#err-main").addEventListener("click", () => { pickBranch(b[0], b[1], null); route(); }); icons(); }
  }
  window.scrollTo(0, 0);
  wireFollows();
  await webTools();
  tour();
  drawn();
}
addEventListener("hashchange", route);
refreshSession().then(() => { header(); noticeBar(); route(); mailedLink(); });
icons();
</script>
