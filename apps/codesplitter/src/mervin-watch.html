<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Mervin work</title>
<link href="/fonts/geist.css" rel="stylesheet">
<script src="/vendor/lucide.min.js"></script>
<style>
  :root { --bg: #fff; --fg: #0a0a0a; --muted: #6b6b6b; --border: #cfcfcf; --paper: #fcfbf8; --accent: #e8590c; --ok: #2f7d32; --bad: #b3261e;
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; }
  :root[data-theme="dark"] { --bg: #0a0a0a; --fg: #f2f2f2; --muted: #9a9a9a; --border: #3a3a3a; --paper: #151515; --ok: #6fbf73; --bad: #ef7b73; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font: 600 26px/1.1 var(--sans); letter-spacing: -0.04em; margin: 0 0 14px; } h1 em { font-style: normal; color: var(--accent); }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; color: var(--fg); border: 1px solid var(--border); border-radius: 5px; background: var(--paper); cursor: pointer; }
  .btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn svg { width: 16px; height: 16px; }
  #clock { font: 14px var(--mono); width: 7ch; white-space: nowrap; }
  #speedtxt { font: 12px var(--mono); width: 5ch; white-space: nowrap; color: var(--muted); }
  input[type=range] { width: 140px; accent-color: var(--accent); }
  .cols { display: grid; grid-template-columns: 1fr 340px; gap: 14px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .wave { margin-bottom: 14px; }
  .wave h2 { font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; }
  .card { border: 1px solid var(--border); border-radius: 6px; background: var(--paper); padding: 10px 12px; margin-bottom: 8px; transition: border-color .2s, opacity .2s; }
  .card.queued { opacity: .55; } .card.merging { border-color: var(--accent); } .card.merged { border-color: var(--ok); } .card.held { border-color: var(--bad); }
  .card .head { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .card .head b { font-family: var(--mono); font-weight: 600; } .card .head .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .card svg { width: 15px; height: 15px; flex: none; }
  .merged svg.s { color: var(--ok); } .held svg.s { color: var(--bad); } .merging svg.s { color: var(--accent); }
  .why { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .file { display: flex; gap: 8px; font: 12px var(--mono); margin-top: 4px; white-space: nowrap; }
  .file .p { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tier { display: inline-block; min-width: 7ch; text-align: center; border: 1px solid var(--border); border-radius: 3px; font: 11px var(--mono); }
  .tier.certain, .tier.agree { color: var(--ok); } .tier.mervin, .tier.differ { color: var(--accent); } .tier.card { color: var(--bad); border-color: var(--bad); }
  .ask { margin-top: 6px; padding: 6px 8px; border: 1px dashed var(--bad); border-radius: 5px; font-size: 12px; animation: pop .3s ease-out; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  #log { font: 12px/1.6 var(--mono); border: 1px solid var(--border); border-radius: 6px; background: var(--paper); padding: 8px 10px; height: 360px; overflow: auto; white-space: nowrap; }
  #tiers { display: flex; gap: 10px; flex-wrap: wrap; font: 12px var(--mono); color: var(--muted); margin-bottom: 8px; }
  .lanes { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; font: 12px var(--mono); }
  .lane { flex: 1; min-width: 180px; border: 1px solid var(--border); border-radius: 6px; background: var(--paper); padding: 6px 10px; }
  .lane h2 { font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 4px; }
  .lane div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .lane .ok { color: var(--ok); } .lane .fail { color: var(--bad); } .lane .run { color: var(--accent); }
  .lane svg { width: 13px; height: 13px; vertical-align: -2px; }
  .diff { margin-top: 4px; border-left: 2px solid var(--border); font: 12px/1.45 var(--mono); white-space: pre; overflow: hidden; }
  .diff.settled { border-left-color: var(--ok); }
  .diff div { padding: 0 6px; animation: slide .15s ease-out; text-overflow: ellipsis; overflow: hidden; }
  .diff .pr { background: color-mix(in srgb, var(--ok) 14%, transparent); } .diff .main { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .diff.settled div { background: none; color: var(--muted); }
  @keyframes slide { from { transform: translateX(-8px); opacity: 0; } }
  textarea { width: 100%; height: 80px; margin-top: 12px; font: 12px var(--mono); background: var(--paper); color: var(--fg); border: 1px solid var(--border); border-radius: 5px; padding: 8px; }
  .muted { color: var(--muted); }
  #rounds { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font: 12px var(--mono); margin-bottom: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--paper); }
  #rounds:empty { display: none; }
  #rounds span { white-space: nowrap; } #rounds svg, .card .head svg.r { width: 13px; height: 13px; vertical-align: -2px; }
  #rounds b { color: var(--accent); font-weight: 600; }
  .ci { font: 12px var(--mono); width: 5ch; text-align: right; color: var(--muted); white-space: nowrap; }
  .card .head svg.r { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Watch <em>Mervin</em> work</h1>
  <div class="bar" role="toolbar" aria-label="Playback">
    <button class="btn" id="play" title="Play"><i data-lucide="play"></i></button>
    <button class="btn" id="pause" title="Pause: hold the next step"><i data-lucide="pause"></i></button>
    <button class="btn" id="stop" title="Stop: back to the start"><i data-lucide="square"></i></button>
    <button class="btn" id="step" title="Step: the next event"><i data-lucide="skip-forward"></i></button>
    <i data-lucide="gauge" title="Speed" style="width:16px;height:16px"></i>
    <input type="range" id="speed" min="0" max="6" step="1" value="2" aria-label="Speed" title="Speed">
    <span id="speedtxt">1x</span>
    <span class="grow"></span>
    <span id="clock" title="Round time played">00:00.0</span>
    <button class="btn" id="theme" title="Light or dark"><i data-lucide="sun-moon"></i></button>
  </div>
  <div id="rounds" aria-label="Recorded rounds"></div>
  <div class="lanes" id="lanes"></div>
  <div class="cols">
    <div id="waves"></div>
    <div><div id="tiers"></div><div id="log" aria-live="polite"></div></div>
  </div>
  <textarea id="src" spellcheck="false" aria-label="a round file from .mervin/rounds (bun scripts/mervin-merge.ts)" placeholder="Paste a round file from .mervin/rounds"></textarea>
</div>
<script type="module">
import { events, Player, view, readRound, readRounds, clockText, ciText, SPEEDS, LANES } from "/mervin-replay.js";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SAMPLE = {
  board: { stages: [
    { pr: 1501, title: "Fix the lockfile drift", files: [{ path: "bun.lock", tier: "certain" }, { path: "package.json", tier: "agree" }] },
    { pr: 1502, title: "Route for the board", stackedOn: 1501, files: [{ path: "src/worker.ts", tier: "mervin", why: "both added a route; line ids settled it", lines: [
      { text: "  app.get(\"/health\", health);", side: "both" }, { text: "+ app.get(\"/board\", board);", side: "pr" },
      { text: "+ app.get(\"/runs\", runs);", side: "main" }, { text: "  app.listen();", side: "both" }] }, { path: "src/api.ts", tier: "differ" }] },
    { pr: 1503, title: "Rewrite the stamps", files: [{ path: "src/stamps.ts", tier: "card" }] },
  ] },
  verdicts: [
    { pr: 1501, go: true, wave: 1, why: "clear to merge" },
    { pr: 1502, go: true, wave: 2, why: "after #1501" },
    { pr: 1503, go: false, why: "Mervin asks on src/stamps.ts" },
  ],
  lanes: [
    { lane: "add", name: "bun install", state: "ok", pr: 1501 },
    { lane: "build", name: "typecheck", state: "run", pr: 1501 }, { lane: "build", name: "typecheck", state: "ok", pr: 1501 },
    { lane: "deploy", name: "preview", state: "ok", pr: 1501 },
  ],
};
const LIVE = new URLSearchParams(location.search).has("live");
// ?repo=owner/name: that repo's recorded rounds from its board (only when it records them).
const REPO = new URLSearchParams(location.search).get("repo");
let rounds = null;
try { const t = localStorage.getItem("map-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
if (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
let round = LIVE ? { board: { stages: [] }, verdicts: [] } : SAMPLE, player = new Player(LIVE ? [] : events(round), LIVE), last = 0, fed = 0, serverPaused = false;
const ICON = { queued: "clock", held: "octagon-alert", merging: "git-merge", merged: "circle-check" };

function draw() {
  const v = view(round, player.steps.slice(0, player.at));
  const groups = new Map();
  for (const p of v.prs) { const k = p.state === "held" ? "held" : `wave ${p.wave ?? "?"}`; (groups.get(k) ?? groups.set(k, []).get(k)).push(p); }
  $("waves").innerHTML = [...groups].sort(([a], [b]) => (a === "held") - (b === "held") || a.localeCompare(b)).map(([k, ps]) => `<div class="wave"><h2>${esc(k)}</h2>${ps.map((p) =>
    `<div class="card ${p.state}"><div class="head"><i class="s" data-lucide="${ICON[p.state]}"></i><b>#${p.pr}</b><span class="t">${esc(p.title)}</span>`
    + (rounds?.needless.includes(p.pr) ? `<i class="r" data-lucide="hourglass" title="Held for nothing: the board held #${p.pr} and every file of it landed exactly as Mervin wrote it"></i>` : "")
    + (p.state === "merged" && rounds?.ci?.last.has(p.pr) ? `<span class="ci" title="How long #${p.pr} waited on its slowest CI check">${ciText(rounds.ci.last.get(p.pr))}</span>` : "")
    + `</div>`
    + (p.why ? `<div class="why">${esc(p.why)}</div>` : "")
    + p.files.map((f) => `<div class="file"><span class="tier ${f.tier}">${f.tier}</span><span class="p" title="${esc(f.why)}">${esc(f.path)}</span></div>`
      + (f.lines.length ? `<div class="diff${f.settled ? " settled" : ""}">${f.lines.map((l) => `<div class="${l.side}">${esc(l.text)}</div>`).join("")}</div>` : "")).join("")
    + p.cards.map((c) => `<div class="ask"><i data-lucide="message-circle-question" style="width:13px;height:13px;vertical-align:-2px"></i> Mervin asks about <b>${esc(c)}</b></div>`).join("")
    + `</div>`).join("")}</div>`).join("");
  $("lanes").innerHTML = LANES.map((l) => `<div class="lane"><h2>${l}</h2>${v.lanes[l].map((x) => `<div class="${x.state}"><i data-lucide="${{ run: "loader", ok: "circle-check", fail: "circle-x" }[x.state]}"></i> ${esc(x.name)}${x.pr ? ` #${x.pr}` : ""}</div>`).join("") || '<div class="muted">idle</div>'}</div>`).join("");
  $("rounds").innerHTML = rounds?.of ? [
    `<span title="Files that landed exactly as Mervin wrote them, over ${rounds.rounds} recorded rounds"><i data-lucide="target"></i> <b>${Math.round(100 * rounds.exact / rounds.of)}%</b> hit (${rounds.exact} of ${rounds.of})</span>`,
    ...rounds.tiers.filter((t) => t.of).map((t) => `<span title="${esc(t.tier)}: ${t.exact} of ${t.of} landed exact">${esc(t.tier)} ${Math.round(100 * t.exact / t.of)}%</span>`),
    rounds.ci ? `<span title="How long a landed PR waited on CI: the median, then the longest, over ${rounds.ci.prs} PRs"><i data-lucide="timer"></i> ${ciText(rounds.ci.median)} / ${ciText(rounds.ci.max)}</span>` : "",
    rounds.needless.length ? `<span title="Held for nothing: PRs the board held that then landed exactly as written"><i data-lucide="hourglass"></i> ${rounds.needless.map((n) => `#${n}`).join(" ")}</span>` : "",
    rounds.kinds.length ? `<span title="The file kinds Mervin got wrong most"><i data-lucide="file-warning"></i> ${esc(rounds.kinds.map((k) => `${k.kind} ${k.wrong}`).join(", "))}</span>` : "",
  ].join("") : "";
  $("tiers").innerHTML = Object.entries(v.tiers).map(([t, n]) => `<span>${t} ${n}</span>`).join("");
  const log = $("log"), stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
  log.innerHTML = v.log.map((l) => `<div>${esc(l)}</div>`).join("");
  if (stick) log.scrollTop = log.scrollHeight;
  $("clock").textContent = clockText(player.clock);
  for (const [id, m] of [["play", "playing"], ["pause", "paused"], ["stop", "stopped"]]) $(id).setAttribute("aria-pressed", String(player.mode === m));
  if (LIVE) $("pause").title = serverPaused ? "Held: the next merge waits. Play lets it go" : "Pause: hold the next merge";
  lucide.createIcons();
}
function frame(now) {
  const dt = last ? now - last : 0; last = now;
  if (player.tick(dt).length || player.mode === "playing") draw();
  requestAnimationFrame(frame);
}
// A live pause is real: the feed's pause file holds mervin-merge.ts before its next `gh pr merge --auto`.
const hold = (on) => LIVE && fetch("/pause", { method: on ? "PUT" : "DELETE" }).then(() => { serverPaused = on; draw(); }).catch(() => {});
$("play").onclick = () => { player.play(); hold(false); draw(); };
$("pause").onclick = () => { player.pause(); hold(true); draw(); };
$("stop").onclick = () => { player.stop(); draw(); };
$("step").onclick = () => { player.step(); draw(); };
$("speed").oninput = () => { player.setSpeed(SPEEDS[$("speed").value]); $("speedtxt").textContent = `${player.speed}x`; };
$("theme").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; try { localStorage.setItem("map-theme", t); } catch {} };
$("src").value = JSON.stringify(SAMPLE, null, 1);
$("src").addEventListener("input", () => {
  try { const r = readRound(JSON.parse($("src").value)); if (typeof r === "string") return; round = r; player = new Player(events(r)); player.setSpeed(SPEEDS[$("speed").value]); draw(); } catch {}
});
if (LIVE) {
  $("src").style.display = "none"; player.play();
  setInterval(() => fetch(`/feed?from=${fed}`).then((r) => r.json()).then((f) => { fed = f.next; serverPaused = f.paused; if (f.steps.length) player.push(f.steps); draw(); }).catch(() => {}), 1000);
}
if (REPO) {
  const pull = () => fetch(`/api/repos/${REPO.split("/").map(encodeURIComponent).join("/")}/board`).then((r) => r.json()).then((b) => { rounds = readRounds(b); draw(); }).catch(() => {});
  pull(); if (LIVE) setInterval(pull, 30000);
}
draw(); requestAnimationFrame(frame);
</script>
</body>
</html>
