<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeSplitter API</title>
<link href="/fonts/geist.css" rel="stylesheet">
<style>
  /* The API reference, drawn from GET /api (src/api.ts): every read and action
     the site's own page uses, for anyone building their own UI or agent on it. */
  :root { --bg: #fff; --border: #e6e6e6; --fg: #0a0a0a; --muted: #6b6b6b; --accent: #e8590c; --accent-ink: #c2410c; --accent-soft: #fff4ec; --paper: #fcfbf8;
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  a { color: var(--fg); } a:hover { color: var(--accent); }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 24px 64px; }
  .label { font: 500 11px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 600 30px/1.1 var(--sans); letter-spacing: -0.04em; margin: 8px 0 6px; } h1 em { font-style: normal; color: var(--accent); }
  h2 { font: 600 17px/1.3 var(--sans); letter-spacing: -0.02em; margin: 32px 0 4px; }
  p { color: var(--muted); margin: 0 0 12px; max-width: 680px; }
  code { font: 12.5px var(--mono); overflow-wrap: anywhere; }
  ol { color: var(--muted); max-width: 680px; padding-left: 22px; } ol li { margin: 0 0 8px; }
  dl { max-width: 680px; margin: 10px 0 0; } dt { font: 500 13px var(--mono); margin-top: 8px; } dd { margin: 0; color: var(--muted); }
  ul { list-style: none; margin: 10px 0 0; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--paper); }
  li { display: grid; grid-template-columns: 64px 1fr; gap: 2px 12px; padding: 10px 12px; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  .m { font: 500 11px/20px var(--mono); color: var(--accent-ink); }
  .p { font: 500 13px/20px var(--mono); overflow-wrap: anywhere; }
  .d { grid-column: 2; color: var(--muted); font-size: 13px; }
  .b { font: 12px var(--mono); color: var(--fg); background: var(--accent-soft); padding: 0 4px; border-radius: 3px; }
  .who { font-size: 12px; color: var(--accent-ink); }
  @media (max-width: 560px) { .wrap { padding: 20px 16px 48px; } li { grid-template-columns: 1fr; } .d { grid-column: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="label" href="/">← codeSplitter</a>
  <h1>The <em>API</em></h1>
  <p id="about"></p>
  <p>The same as JSON: <a href="/api"><code>GET /api</code></a>. Build your own UI on it, or hand it to an agent: <a href="/mcp">as an MCP server</a>, or as <a href="/api/openapi.json">OpenAPI</a>.</p>
  <div id="start"></div>
  <div id="groups"><p>Loading…</p></div>
</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
fetch("/api").then((r) => r.json()).then((ref) => {
  document.getElementById("about").textContent = ref.about;
  document.getElementById("start").innerHTML = `<h2>Start here</h2><p>${esc(ref.what)}</p><ol>`
    + ref.start.map((s) => `<li>${esc(s.step)}<br><code>${esc(s.call)}</code></li>`).join("") + `</ol><h2>Glossary</h2><dl>`
    + ref.glossary.map((g) => `<dt>${esc(g.term)}</dt><dd>${esc(g.means)}</dd>`).join("") + "</dl>";
  document.getElementById("groups").innerHTML = ref.groups.map((g) => `<h2>${esc(g.name)}</h2>${g.about ? `<p>${esc(g.about)}</p>` : ""}<ul>`
    + g.endpoints.map((e) => `<li><span class="m">${esc(e.method)}</span><span class="p">${esc(e.path)}${e.body ? ` <span class="b">${esc(e.body)}</span>` : ""}</span>`
      + `<span class="d">${esc(e.does)}${e.who ? ` <span class="who">· ${esc(e.who)}</span>` : ""}</span></li>`).join("") + "</ul>").join("");
}).catch((e) => { document.getElementById("groups").innerHTML = `<p>Couldn't load the reference: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
