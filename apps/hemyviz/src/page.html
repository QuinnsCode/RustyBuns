<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hemyviz</title>
  <link rel="stylesheet" href="./page.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><b>hemyviz</b></div>
    <nav class="seg" id="dims" aria-label="Dimension"></nav>
    <nav class="seg" id="modes" aria-label="Mode"></nav>
    <div class="tools">
      <select id="stack" aria-label="Stack"></select>
      <label class="search"><span id="search-icon"></span><input id="find" type="search" placeholder="Find" aria-label="Find a resource"></label>
      <button id="orbit" class="icon" title="Turn the 3D view" aria-label="Turn the 3D view"></button>
      <button id="fit" class="icon" title="Fit the view" aria-label="Fit the view"></button>
    </div>
  </header>
  <main>
    <canvas id="view"></canvas>
    <div id="stats" class="stats"></div>
    <div id="legend" class="legend"></div>
    <div id="tip" class="tip" hidden></div>
    <div id="empty" class="empty" hidden></div>
    <aside id="panel" class="panel" hidden></aside>
  </main>
  <script type="module" src="./page.ts"></script>
</body>
</html>
