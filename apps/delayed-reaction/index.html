<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Delayed Reaction</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="stage" aria-label="The tunnel you run down"></canvas>
  <div id="hud">
    <div id="score" aria-live="off">0</div>
    <div id="combo"></div>
    <div id="judge" aria-live="polite"></div>
    <div id="lives-track"><div id="lives"></div></div>
  </div>
  <div id="pads" role="group" aria-label="Pads">
    <button class="pad" data-lane="0" aria-label="Pad 1 (D)"><span>D</span></button>
    <button class="pad" data-lane="1" aria-label="Pad 2 (F)"><span>F</span></button>
    <button class="pad" data-lane="2" aria-label="Pad 3 (J)"><span>J</span></button>
    <button class="pad" data-lane="3" aria-label="Pad 4 (K)"><span>K</span></button>
  </div>
  <div id="menu">
    <div class="fascia">
      <header class="station">
        <div class="display">
          <button class="info" popovertarget="about" title="How to play" aria-label="How to play"></button>
          <h1 data-copy="title"></h1>
          <p class="pitch" data-copy="pitch"></p>
          <div id="result"></div>
          <div class="tuner" id="tuner"></div>
          <p class="tuned" id="tuned" aria-live="polite" data-copy="tuning"></p>
        </div>
        <div class="knobs" id="knobs"></div>
      </header>
      <button id="play" class="play" data-copy="play"></button>
      <h2 class="engrave" data-copy="presets"></h2>
      <div id="levels"></div>
      <h2 class="engrave" data-copy="tapes"></h2>
      <div id="tracks"></div>
      <div id="account"></div>
    </div>
  </div>
  <div id="about" class="about" popover>
    <p class="blurb"><span data-copy="howToBefore"></span> <b id="delay-words" data-copy="howToDelay"></b><span data-copy="howToAfter"></span></p>
    <p class="hint" data-copy="pads"></p>
  </div>
  <div id="controls-host"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
