<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Splat spy</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="view" aria-label="A dark room. Fire paint to reveal it, then pick the thing you were asked to find."></canvas>
    <div class="crosshair" aria-hidden="true"></div>
    <div class="mode-edge" aria-hidden="true"></div>
    <!-- One switch decides what a press on the room does: scan (light it up) or pick (that's the thing). -->
    <div id="modes" class="modes" role="group" aria-label="What a press on the room does">
      <p id="mode-tip" class="mode-tip" role="status"></p>
      <div class="switch">
        <button id="mode-scan" type="button" aria-pressed="true"><span class="ic" data-icon="scan"></span><b>Scan</b></button>
        <button id="mode-pick" type="button" aria-pressed="false"><span class="ic" data-icon="pick"></span><b>Pick</b><kbd class="mouse-only">Shift</kbd></button>
      </div>
    </div>
    <section id="menu" class="panel" hidden>
      <h2>Splat spy</h2>
      <p class="dim">Race your friends to spy the same thing in the same dark room.</p>
      <div class="row"><label>Your name <input id="menu-name" maxlength="24" autocomplete="nickname" placeholder="Spy" /></label><span id="menu-account"></span></div>
      <button id="menu-quick" type="button" class="primary">Quick play</button>
      <div class="row">
        <input id="menu-code" maxlength="8" placeholder="Room code" aria-label="Room code" autocapitalize="characters" />
        <button id="menu-join" type="button">Join</button>
        <button id="menu-make" type="button">New room</button>
      </div>
      <button id="menu-solo" type="button">Practice alone</button>
      <p id="menu-msg" class="dim" role="status"></p>
    </section>
    <section id="lobby" class="panel" hidden></section>
    <div id="racers" class="racers" hidden></div>
    <div id="count" class="bigcount" hidden></div>
    <header class="hud">
      <div class="count"><span id="rounds">0</span><small>shots<br />this find</small><span id="timer" class="timer">0.0s</span></div>
      <h1 id="prompt">Loading…</h1>
      <p id="hint"></p>
      <p id="score" class="score"></p>
    </header>
    <div class="tools" id="tools">
      <button id="next" type="button" hidden class="solo-only">Next</button>
      <label title="Rounds per second while the trigger is held">Rate <input id="rate" type="range" min="3" max="20" value="9" /></label>
      <button id="reveal" type="button" class="solo-only">Reveal all</button>
      <button id="reset" type="button" class="solo-only">Start over</button>
      <button id="leave" type="button" class="online-only" hidden>Leave room</button>
    </div>
  </body>
  <script type="module" src="/src/main.ts"></script>
</html>
