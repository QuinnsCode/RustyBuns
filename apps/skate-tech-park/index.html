<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skate Tech Park</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 11 15 6v3L1 13z%22 fill=%22%23f4f5f2%22 stroke=%22%23222%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="taps" class="taps"></div>
    <header class="hud">
      <div class="score"><span id="score">0</span><small id="speed">0 km/h</small></div>
      <div class="buttons">
        <button type="button" id="together" class="icon-btn"></button>
        <button type="button" id="swap" class="icon-btn"></button>
        <button type="button" id="reset" class="icon-btn" title="Back to the start (R)" aria-label="Back to the start"></button>
      </div>
    </header>
    <div id="room" class="room"></div>
    <div id="trick" class="trick" aria-live="polite"></div>
    <div id="combo" class="combo"></div>
    <div id="tip" class="tip" hidden></div>
    <footer id="keys" class="keys"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
