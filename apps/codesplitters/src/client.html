<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeSplitters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  /* A bright code host in GitHub's shape, with a little of the archive in it:
     parchment on the headers, a wax-seal red for the main actions, gold for
     the odd flourish, and an old printed serif for the masthead. */
  :root {
    --bg: #ffffff;
    --canvas: #f6f8fa;       /* panels, bars */
    --border: #d1d9e0;
    --fg: #1f2328;
    --muted: #59636e;
    --link: #0969da;
    --seal: #8c2f22;         /* primary actions */
    --seal-hover: #a63a2b;
    --parchment: #faf5e8;    /* headers, the hero */
    --parchment-edge: #e8dcbf;
    --gold: #a4823b;
    --select: #fff8c5;       /* selected lines */
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --serif: "IM Fell English", Georgia, serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  [data-lucide], svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; vertical-align: -3px; flex: none; }
  code { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }

  /* Buttons, inputs: GitHub's proportions. */
  input, select, textarea { font: 400 14px/20px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--link); outline-offset: -1px; border-color: transparent; }
  textarea { font-family: var(--mono); font-size: 13px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/20px var(--sans); color: var(--fg); background: var(--canvas); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; cursor: pointer; white-space: nowrap; text-decoration: none !important; }
  .btn:hover { background: #eff2f5; }
  .btn.primary { background: var(--seal); border-color: var(--seal); color: #fff; }
  .btn.primary:hover { background: var(--seal-hover); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn .count { background: rgba(31,35,40,.08); border-radius: 10px; padding: 0 6px; font-size: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/18px var(--sans); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; background: var(--bg); }
  button.badge { cursor: pointer; } button.badge:hover { border-color: var(--muted); }
  .label { font: 500 11px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  /* The top bar. */
  .top { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: var(--canvas); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--fg); font: 600 15px var(--sans); letter-spacing: -0.01em; }
  .brand:hover { text-decoration: none; }
  .brand svg { width: 26px; height: 26px; }
  .jump { display: flex; align-items: center; gap: 8px; min-width: 280px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; font: 400 13px var(--sans); }
  .jump:hover { border-color: var(--muted); }
  .jump kbd, .palette kbd { margin-left: auto; font: 500 11px var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--canvas); }
  #who { display: flex; align-items: center; gap: 8px; }
  #who form { display: flex; gap: 6px; }
  main { padding: 0 0 60px; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px; }

  /* Repo pages are a workbench, edge to edge like an editor: a slim header,
     the explorer on the left, the code in the middle, details on the right,
     and a status bar along the bottom. */
  body.ide-mode { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body.ide-mode #topplay { display: none; }
  body.ide-mode main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0; }
  .repohead { background: var(--parchment); border-bottom: 1px solid var(--parchment-edge); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 12px; }
  .repohead h1 { margin: 0; font: 400 15px/1.3 var(--sans); display: flex; align-items: center; gap: 6px; }
  .repohead h1 b { font-weight: 600; }
  .repohead .btn { padding: 2px 10px; }
  .wb { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) 290px; }
  .wb > * { min-height: 0; overflow: auto; }
  .explorer { background: var(--canvas); border-right: 1px solid var(--border); padding-bottom: 12px; }
  .pad { padding: 8px 12px 4px; }
  .tree a { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 calc(8px + var(--d, 0) * 12px); color: var(--fg); font-size: 13px; white-space: nowrap; cursor: pointer; }
  .tree a:hover { background: #eaeef2; text-decoration: none; }
  .tree a.on { background: #dde3ea; box-shadow: inset 2px 0 var(--seal); font-weight: 500; }
  .tree svg.lucide { width: 14px; height: 14px; vertical-align: 0; }
  .tree .chev { color: var(--muted); } .tree .ic-dir { color: #54aeff; fill: #b6e3ff; } .tree .ic-file { color: var(--muted); margin-left: 19px; }
  .editor { display: flex; flex-direction: column; overflow: hidden; }
  .tabs { display: flex; background: var(--canvas); border-bottom: 1px solid var(--border); flex: none; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 13px; background: var(--bg); border-right: 1px solid var(--border); box-shadow: inset 0 2px var(--seal); margin-bottom: -1px; }
  .crumbbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 12px; border-bottom: 1px solid var(--border); font-size: 13px; flex: none; min-height: 34px; }
  .crumbbar .btn { padding: 1px 8px; font-size: 12.5px; }
  .crumbbar .crumbs { font-weight: 500; font-size: 13px; }
  .editor .scroll { flex: 1; min-height: 0; overflow: auto; }
  .details { border-left: 1px solid var(--border); font-size: 13px; }
  .sec { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .sec h3 { margin: 0 0 6px; font: 500 11px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sec p { margin: 0 0 6px; } .sec .btn { margin: 2px 4px 2px 0; }
  .sec .commit { display: grid; grid-template-columns: auto 1fr; gap: 0 6px; padding: 3px 0; } .sec .commit .muted { grid-column: 2; font-size: 12px; }
  .status { display: flex; align-items: center; gap: 14px; flex: none; height: 24px; padding: 0 12px; background: var(--seal); color: #f6e7e2; font: 400 12px var(--sans); white-space: nowrap; overflow: hidden; }
  .status span { display: inline-flex; align-items: center; gap: 4px; } .status svg.lucide { width: 13px; height: 13px; vertical-align: 0; }
  .status .grow { flex: 1; }
  @media (max-width: 1199px) {
    body.ide-mode { height: auto; overflow: visible; display: block; } body.ide-mode main { display: block; }
    .wb { grid-template-columns: 230px minmax(0, 1fr); } .wb > * { overflow: visible; }
    .explorer { grid-row: span 2; } .editor { overflow: visible; } .editor .scroll { overflow-x: auto; }
    .details { border-left: 0; border-top: 1px solid var(--border); grid-column: 2; }
    .status { position: sticky; bottom: 0; }
  }
  .box { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 16px; background: var(--bg); }
  .box > .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; background: var(--canvas); border-bottom: 1px solid var(--border); font-size: 13px; }
  .box > .body { padding: 14px 16px; }
  .crumbs { font: 600 14px var(--sans); } .crumbs a { font-weight: 400; } .crumbs .sep { color: var(--muted); margin: 0 4px; }
  .table a.rowlink { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: center; padding: 7px 16px; border-top: 1px solid var(--border); color: var(--fg); }
  .table a.rowlink:first-child { border-top: 0; } .table a.rowlink:hover { background: var(--canvas); text-decoration: none; }
  /* A fork: lines modded since the clone get a seal mark; where it came from sits under the header. */
  .ln.mod { box-shadow: inset 2px 0 var(--seal); } .ln.mod .by { color: var(--seal); }
  .gh-list { max-height: 220px; overflow: auto; margin-top: 8px; }
  .gh-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 3px 0; font: inherit; color: var(--link); cursor: pointer; }
  .gh-list button[disabled] { color: var(--muted); cursor: default; }

  /* Code: a line-number gutter you can click, blame faint on the side. */
  .code { font: 400 13px/20px var(--mono); overflow-x: auto; tab-size: 4; }
  .ln { display: grid; grid-template-columns: 52px 92px minmax(0, 1fr); }
  .ln .n { text-align: right; padding-right: 12px; color: #8c959f; cursor: pointer; user-select: none; }
  .ln .n:hover { color: var(--fg); }
  .ln .by { color: #8c959f; font-size: 11.5px; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-right: 1px solid var(--border); user-select: none; }
  .ln .t { white-space: pre; padding: 0 16px; }
  .code.plain .ln { grid-template-columns: 52px minmax(0, 1fr); }
  .ln.sel { background: var(--select); } .ln.sel .n { color: var(--fg); box-shadow: inset 2px 0 0 var(--gold); }
  .ln.flash { animation: flash 1.4s ease-out; } @keyframes flash { from { background: #dafbe1; } }
  .ln.claim .t { box-shadow: inset 2px 0 0 #bf8700; }
  .ln input { width: 100%; font: inherit; padding: 0 4px; border-radius: 3px; }
  .ln:first-child { padding-top: 6px; } .ln:last-child { padding-bottom: 6px; }
  mark { background: #fff8c5; color: inherit; border-radius: 2px; }

  /* Popovers (share, clone, invite). */
  .pop { position: relative; }
  .pop > .panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 340px; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(140,149,159,.25); display: grid; gap: 8px; }
  .pop > .panel[hidden] { display: none; }
  .copyline { display: flex; gap: 6px; } .copyline input { flex: 1; font: 12px var(--mono); }

  /* The hero: a parchment sheet with a fine double rule, like a charter. */
  .hero { background: var(--parchment); border-bottom: 1px solid var(--parchment-edge); }
  .hero .wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-top: 28px; padding-bottom: 26px; }
  .est { font: italic 400 15px var(--serif); color: var(--gold); letter-spacing: .02em; }
  .headline { font: 600 clamp(32px, 4.6vw, 52px)/1.04 var(--sans); letter-spacing: -0.035em; margin: 8px 0 14px; }
  .headline em { font: italic 400 1.08em var(--serif); color: var(--seal); letter-spacing: -0.01em; }
  .lede { color: var(--muted); font-size: 16px; max-width: 560px; margin: 0 0 22px; }
  .stage { position: relative; height: 290px; border: 1px solid var(--parchment-edge); outline: 1px solid var(--parchment-edge); outline-offset: 3px; border-radius: 4px; background: #fffdf7; overflow: hidden; font: 400 12.5px/1.9 var(--mono); }
  .piece { position: absolute; left: 0; top: 0; display: flex; gap: 14px; padding: 0 12px 0 18px; white-space: pre; border: 1px solid transparent; border-radius: 6px; will-change: transform; transition: border-color .5s, background .5s, padding .5s, box-shadow .5s; }
  .piece .who { width: 96px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .piece.apart { border-color: var(--border); background: var(--bg); padding: 4px 12px; box-shadow: 0 6px 14px -10px rgba(31,35,40,.35); }
  .slit { position: absolute; top: 8px; bottom: 8px; left: 0; width: 1px; background: var(--seal); opacity: 0; pointer-events: none; }
  .slit.go { animation: slit .75s cubic-bezier(.7, 0, .3, 1) forwards; }
  @keyframes slit { 0% { left: 0; opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { left: 100%; opacity: 0; } }
  .piece.hit { animation: hit 1.1s ease-out; } .piece.hit .txt { animation: type .5s steps(24, end); }
  @keyframes hit { from { border-color: var(--seal); box-shadow: 0 0 0 3px rgba(140,47,34,.08); } }
  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .seal { position: absolute; right: 14px; bottom: 12px; font: 500 11px/1.7 var(--mono); color: var(--seal); border: 1px solid var(--seal); border-radius: 4px; padding: 1px 8px; opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s; background: #fffdf7; }
  .seal.on { opacity: 1; transform: none; }
  .phases { display: flex; gap: 18px; flex-wrap: wrap; list-style: none; padding: 0; margin: 10px 2px 0; font: 500 11px/1.6 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); counter-reset: ph; }
  .phases li { opacity: .45; transition: opacity .4s; counter-increment: ph; } .phases li::before { content: counter(ph) " · "; } .phases li.on { opacity: 1; color: var(--fg); }

  /* Home sections. */
  .section { padding-top: 24px; }
  .section h2 { font: 600 20px var(--sans); letter-spacing: -0.02em; margin: 4px 0 4px; }
  .section > .wrap > p { margin: 0 0 16px; }
  .cmds { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .cmd { display: grid; grid-template-columns: 32px 1fr; gap: 4px 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
  .cmd .ico { grid-row: span 3; width: 32px; height: 32px; border-radius: 6px; background: var(--parchment); border: 1px solid var(--parchment-edge); display: grid; place-items: center; color: var(--seal); }
  .cmd b { font-weight: 600; } .cmd span { color: var(--muted); font-size: 13px; } .cmd code { color: var(--muted); font-size: 11.5px; }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .level { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
  .level:hover { border-color: var(--muted); text-decoration: none; }
  .level b { display: block; font-weight: 600; } .level .muted { font: 12px var(--mono); }
  .lvl-n { font: italic 400 20px var(--serif); color: var(--gold); }
  .lvl-st { font: 500 11px var(--sans); color: var(--muted); } .st-ready { color: #1a7f37; }

  /* Profiles, collections, search. */
  .cards { display: grid; gap: 16px; padding-top: 20px; } .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .photo iframe { width: 100%; height: 220px; border: 0; display: block; background: #fff; }
  .list a { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); } .list a:first-child { border-top: 0; }

  /* The command palette. */
  .palette { position: fixed; inset: 0; z-index: 50; background: rgba(31,35,40,.35); display: grid; justify-items: center; align-items: start; padding-top: 12vh; }
  .palette[hidden] { display: none; }
  .palette .sheet { width: min(640px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 16px 48px rgba(31,35,40,.3); overflow: hidden; }
  .palette .q { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .palette .q input { flex: 1; border: 0; outline: 0; font-size: 15px; padding: 4px 0; }
  .palette .q .ask { font: 500 12px var(--sans); color: var(--seal); background: var(--parchment); border: 1px solid var(--parchment-edge); border-radius: 4px; padding: 0 6px; }
  .palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
  .palette li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .palette li .api { margin-left: auto; font: 11.5px var(--mono); color: var(--muted); }
  .palette li.on { background: var(--canvas); box-shadow: inset 2px 0 0 var(--seal); }
  .palette .group { padding: 8px 10px 2px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); cursor: default; }
  .palette .foot { padding: 7px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); background: var(--canvas); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 60; }

  @media (max-width: 860px) {
    .hero .wrap, .two, .wb { grid-template-columns: 1fr; } .explorer { max-height: 220px; grid-row: auto; } .details { grid-column: auto; }
    .jump { min-width: 0; flex: 1; } .jump span { display: none; } .ln { grid-template-columns: 44px minmax(0, 1fr); } .ln .by { display: none; }
    .wrap { padding: 0 16px; } .top { padding: 10px 16px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="codeSplitters home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#8c2f22"/><circle cx="16" cy="16" r="11" fill="none" stroke="#e9b8a8" stroke-width=".8" stroke-dasharray="1.5 1.5"/><path d="M9 16h6M17 16h6M16 9v14" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    codeSplitters
  </a>
  <button class="jump" id="jump" type="button"><i data-lucide="search"></i><span>Search or run a command</span><kbd>⌘K</kbd></button>
  <span class="grow"></span>
  <a class="btn ghost" id="topplay" href="/play.html#l/mitt" title="the game"><i data-lucide="gamepad-2"></i>Play</a>
  <span id="who"></span>
</header>
<main id="app"></main>
<div class="palette" id="palette" hidden><div class="sheet" role="dialog" aria-label="Commands">
  <div class="q"><i data-lucide="command"></i><span class="ask" id="pal-ask" hidden></span><input id="pal-q" placeholder="Type a command, or search code" autocomplete="off"><kbd>esc</kbd></div>
  <ul id="pal-list"></ul>
  <div class="foot">Every command here is one API call, shown on the right, so a person and an agent do the same thing the same way.</div>
</div></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const icon = (name, cls = "") => `<i data-lucide="${name}"${cls ? ` class="${cls}"` : ""}></i>`;
const icons = () => { try { lucide.createIcons(); } catch {} };
// Who you are comes from the server: an alias (desktop, demos) or a Better Auth account.
let session = { mode: "alias", user: null, providers: [] };
const me = () => session.user;
const api = async (path, body, method) => {
  const r = await fetch("/api" + path, body === undefined && !method ? {} : { method: method || "POST", headers: { "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || j.message || r.status);
  return j;
};
const app = $("#app");
let socket = null;
// What the page is showing, so the palette can offer what makes sense here.
let ctx = {};
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2400); }
async function copy(text, what = "Copied") { try { await navigator.clipboard.writeText(text); toast(what); } catch { prompt("Copy this:", text); } }

async function refreshSession() { session = await api("/session").catch(() => session); }

function header() {
  const u = me();
  if (u) {
    $("#who").innerHTML = `<a class="btn ghost" href="#/u/${u}">${icon("user")}@${esc(u)}</a><button class="btn ghost" id="out" title="sign out">${icon("log-out")}</button>`;
    $("#out").addEventListener("click", signOut);
    return icons();
  }
  if (session.mode === "alias") {
    $("#who").innerHTML = `<form id="login"><input name="name" placeholder="your alias" required pattern="[a-z0-9]+(-[a-z0-9]+)*" size="12"><button class="btn primary">${icon("log-in")}Sign in</button></form>`;
    $("#login").addEventListener("submit", async (e) => { e.preventDefault(); await api("/login", { name: e.target.name.value }); await refreshSession(); header(); route(); });
    return icons();
  }
  // Accounts: a small panel with the configured providers and email.
  const label = { github: "GitHub", google: "Google" };
  $("#who").innerHTML = `<div class="pop"><button class="btn primary" id="signin">${icon("log-in")}Sign in</button><div class="panel" hidden>
      ${session.providers.filter((p) => p !== "email").map((p) => `<button class="btn" data-provider="${p}">Continue with ${label[p] ?? p}</button>`).join("")}
      <form id="email" style="display:grid;gap:8px"><input name="email" type="email" placeholder="email" required autocomplete="email">

/** A button that opens the panel next to it; a click elsewhere closes it. */
function popover(btn) {
  const panel = btn.nextElementSibling;
  btn.addEventListener("click", (e) => { e.stopPropagation(); panel.hidden = !panel.hidden; panel.querySelector("input")?.focus(); });
  panel.addEventListener("click", (e) => e.stopPropagation());
  document.addEventListener("click", () => (panel.hidden = true));
  return panel;
}

function crumbs(base, root, path) {
  const segs = path.split("/").filter(Boolean);
  return `<span class="crumbs"><a href="${base}">${esc(root)}</a>${segs.map((seg, i) => `<span class="sep">/</span>` + (i === segs.length - 1 ? `<b>${esc(seg)}</b>` : `<a href="${base}/${encodeURIComponent(segs.slice(0, i + 1).join("/"))}">${esc(seg)}</a>`)).join("")}</span>`;
}
/** The explorer: the whole repo as a tree. Folders open in place; the ones on
 *  the way to what you're looking at start open, and stay open as you move. */
const openDirs = new Map(), treeCache = new Map();
function mountExplorer(el, key, load, href, current) {
  const open = openDirs.get(key) ?? new Set(); openDirs.set(key, open);
  const segs = current.split("/").filter(Boolean);
  for (let i = 1; i <= segs.length; i++) open.add(segs.slice(0, i).join("/"));
  // Level trees never change; a repo's can, so it's read fresh on each page.
  const cache = key.startsWith("l/") ? treeCache : new Map();
  const get = (dir) => { const k = key + ":" + dir; if (!cache.has(k)) cache.set(k, load(dir).catch(() => ({ entries: [] }))); return cache.get(k); };
  const rows = async (dir, d) => {
    const t = await get(dir);
    const kids = await Promise.all(t.entries.map((e) => e.type === "dir" && open.has(e.path) ? rows(e.path, d + 1) : ""));
    return t.entries.map((e, i) => e.type === "dir"
      ? `<a data-dir="${esc(e.path)}" class="${e.path === current ? "on" : ""}" style="--d:${d}" title="${esc(e.path)}">${icon(open.has(e.path) ? "chevron-down" : "chevron-right", "chev")}${icon(open.has(e.path) ? "folder-open" : "folder", "ic-dir")}${esc(e.name)}</a>${kids[i]}`
      : `<a href="${href(e)}" class="${e.path === current ? "on" : ""}" style="--d:${d}" title="${esc(e.path)}">${icon("file", "ic-file")}${esc(e.name)}</a>`).join("")
      || (d ? "" : '<p class="muted pad" style="margin:0">nothing here yet</p>');
  };
  const draw = async () => { el.innerHTML = await rows("", 0); icons(); el.querySelector("a.on")?.scrollIntoView({ block: "nearest" }); };
  el.addEventListener("click", (e) => {
    const a = e.target.closest("[data-dir]"); if (!a) return;
    const p = a.dataset.dir; open.has(p) ? open.delete(p) : open.add(p); draw();
  });
  return draw();
}
/** A repo or level page: header, then explorer | editor | details, then the status bar. */
function workbench(head, { tab, bar, body, details, status }) {
  document.body.classList.add("ide-mode");
  return `${head}<div class="wb"><aside class="explorer"><div class="label pad">Explorer</div><nav class="tree" id="tree"></nav></aside>
    <section class="editor">${tab ? `<div class="tabs"><span class="tab">${tab}</span></div>` : ""}<div class="crumbbar">${bar}</div><div class="scroll">${body}</div></section>
    <aside class="details">${details}</aside></div><footer class="status">${status}</footer>`;
}
const sec = (ic, title, html) => `<section class="sec"><h3>${icon(ic)}${title}</h3>${html}</section>`;
const readmeOf = (tree) => tree.entries.find((e) => e.type === "file" && /^readme(\.|$)/i.test(e.name)) ?? tree.entries.find((e) => e.type === "file");
function table(tree, href) {

  return `<div class="table">${tree.entries.map((e) => `<a class="rowlink" href="${href(e)}">${e.type === "dir" ? icon("folder", "ic-dir") : icon("file", "ic-file")}<span>${esc(e.name)}</span></a>`).join("")}</div>`;
}
function codeRows(lines, { blame = true, start = 1 } = {}) {
  return lines.map((l, i) => `<div class="ln" data-i="${i}" data-id="${esc(l.id ?? "")}"><span class="n">${(l.n ?? start + i)}</span>${blame ? `<span class="by" title="${esc(l.by)} · r${l.rev}">${esc(l.by)}</span>` : ""}<span class="t">${esc(l.text) || " "}</span></div>`).join("");
}
/** Click a line number to select it; shift-click to select a range. Calls back with [from, to] (1-based). */
function selectable(box, onChange) {
  let anchor = null;
  box.addEventListener("click", (e) => {
    const n = e.target.closest(".n"); if (!n) return;
    const i = Number(n.parentElement.dataset.i);
    const [a, b] = e.shiftKey && anchor !== null ? [Math.min(anchor, i), Math.max(anchor, i)] : [i, i];
    if (!e.shiftKey) anchor = i;
    box.querySelectorAll(".ln").forEach((el, k) => el.classList.toggle("sel", k >= a && k <= b));

// Where a fork came from, where its git lives, and who owns it.

}

    }
    icons();
    // Live: every applied op from every editor arrives here, and is applied in
    // place. Our own edits go out on the same socket and wait for an ack.
    let seq = 0;
    const pending = new Map();
    const send = (ops) => {
      if (socket?.readyState !== WebSocket.OPEN) return api(`${base}/ops${q}`, { ops });
      const id = ++seq;
      socket.send(JSON.stringify({ type: "ops", id, ops }));
      return new Promise((ok, fail) => {
        pending.set(id, { ok, fail });

      const i = doc.lines.findIndex((l) => l.id === (a.op.kind === "insert" ? a.op.after : a.line));
      if (a.op.kind === "insert") doc.lines.splice(a.op.after === null ? 0 : i + 1, 0, { id: a.line, text: a.op.text, by: a.by, rev: a.rev });
      else if (a.op.kind === "set") doc.lines[i] = { id: a.line, text: a.op.text, by: a.by, rev: a.rev };

      doc.rev = a.rev;
    };
    socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api${base}/ws${q}`);
    socket.onmessage = async (m) => {
      const msg = JSON.parse(m.data);
      if (msg.type === "ack" || msg.type === "nack") {

      if (msg.type !== "ops") return;
      // In order: apply in place. Missed something (a gap): fetch the whole file.
      if (msg.applied[0]?.rev === doc.rev + 1) msg.applied.forEach(applyLocal);
      else if (msg.rev > doc.rev) doc = await api(`${base}/file${q}`);
      const rev = $("#rev"); rev.max = doc.rev; if (viewing === null) rev.value = doc.rev;
      if (viewing === null && !box.querySelector(".ln input")) draw(doc, new Set(msg.applied.map((a) => a.line)));
    };
  },

// The landing intro, calm to swarm: a file sits still on clean paper; a slit
// opens across it; its lines tear free and take off as a flock, swooping and
// circling while agents edit them; then they dive back and land in order as a
// git commit. Positions are computed per frame (no layout transitions).
let stopIntro = () => {};
function intro(stage, phases) {
  const before = ["// my taste in code", "var foo = 0", "function add(n) {", "  foo = foo + n", "  return foo", "}"];
  const edits = [[1, "let total = 0", "agent-linter"], [3, "  total = total + n", "agent-renamer"], [4, "  return total", "agent-renamer"], [0, "// my taste in code, tidied", "you"]];
  // Perches, as fractions of the stage: spread out, never overlapping.
  const perch = [[.03, .06], [.54, .03], [.30, .36], [.60, .47], [.04, .68], [.45, .80]];
  stage.innerHTML = before.map((t) => `<div class="piece"><span class="who">ryan</span><span class="txt">${esc(t)}</span></div>`).join("")
    + `<div class="slit"></div><div class="seal"></div>`;
  const pieces = [...stage.querySelectorAll(".piece")], seal = $(".seal", stage), slit = $(".slit", stage);
  const mark = (n) => [...phases.children].forEach((li, i) => li.classList.toggle("on", i === n));
  const reset = () => pieces.forEach((p, i) => { $(".txt", p).textContent = before[i]; $(".who", p).textContent = "ryan"; p.classList.remove("apart", "hit"); });
  const home = (i) => [0, 14 + i * 24.7];
  const spot = (i, W, H) => [perch[i][0] * W, perch[i][1] * H];
  // A quadratic curve: start, a control point the bird arcs through, end.
  const bez = (a, c, b, t) => [(1 - t) ** 2 * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]];
  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
  const clamp = (t) => Math.max(0, Math.min(1, t));
  const T = { split: 1200, fly: 1800, hover: 3400, dive: 6400, land: 7900, loop: 10800 };
  let t0 = 0, raf = 0, timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function frame(now) {
    const t = now - t0, W = stage.clientWidth, H = stage.clientHeight;
    pieces.forEach((p, i) => {
      const h = home(i), s = spot(i, W, H), lag = i * 90;
      s[0] = Math.max(4, Math.min(s[0], W - p.offsetWidth - 6));   // a long line still perches inside a narrow stage
      let [x, y] = h, r = 0, k = 1;
      if (t >= T.fly + lag && t < T.dive + lag) {
        // Hovering at the perch: a slow loop, a little bob, the odd wingbeat.
        const w = (t - T.fly - lag) / 1000, wob = Math.min(1, w / .6);
        x = s[0] + Math.sin(w * 2.1 + i) * 10 * wob;
        y = s[1] + Math.cos(w * 2.7 + i * 1.7) * 6 * wob;
        r = Math.sin(w * 3 + i) * 2 * wob;
        // Takeoff: arc up through the sky above the stage centre, flapping.
        const f = clamp((t - T.fly - lag) / 1300);
        if (f < 1) {
          const e = ease(f), c = [W * (.25 + .5 * ((i * 37) % 10) / 10), -H * (.35 + (i % 3) * .1)];
          [x, y] = bez(h, c, s, e);
          r = Math.sin(f * 26) * 9 * (1 - f);
          k = 1 + Math.sin(f * 26) * .06 * (1 - f);
        }
      } else if (t >= T.dive + lag) {
        // The dive home: drop below the line first, then sweep up into place.
        const f = clamp((t - T.dive - lag) / 1100), e = ease(f);
        const from = [s[0] + Math.sin(((T.dive - T.fly) / 1000) * 2.1 + i) * 10, s[1] + Math.cos(((T.dive - T.fly) / 1000) * 2.7 + i * 1.7) * 6];
        [x, y] = bez(from, [W * (.1 + (i % 4) * .2), H * 1.05], h, e);
        r = (1 - f) * (i % 2 ? -14 : 14) * Math.sin(f * Math.PI);
      }
      p.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${k.toFixed(3)})`;
    });
    if (t < T.loop) raf = requestAnimationFrame(frame);
  }

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cycle = () => {
    timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf);
    reset(); seal.classList.remove("on"); slit.classList.remove("go"); mark(0);
    if (still) {
      pieces.forEach((p, i) => { const [x, y] = home(i); p.style.transform = `translate(${x}px, ${y}px)`; });
      edits.forEach(([i, t, who]) => { $(".txt", pieces[i]).textContent = t; $(".who", pieces[i]).textContent = who; });
      seal.textContent = "a014902 · pushed to git"; seal.classList.add("on"); mark(3);
      return;
    }
    t0 = performance.now(); raf = requestAnimationFrame(frame);
    at(T.split, () => { slit.classList.add("go"); mark(1); });
    at(T.fly - 100, () => pieces.forEach((p) => p.classList.add("apart")));
    edits.forEach(([i, t, who], k) => at(T.hover + 400 + k * 650, () => {
      mark(2);
      const p = pieces[i];
      $(".txt", p).textContent = t; $(".who", p).textContent = who;
      p.classList.remove("hit"); void p.offsetWidth; p.classList.add("hit");
    }));
    at(T.dive, () => mark(3));
    at(T.land + 300, () => pieces.forEach((p) => p.classList.remove("apart")));
    at(T.land + 500, () => { seal.textContent = Math.random().toString(16).slice(2, 9) + " · pushed to git"; seal.classList.add("on"); });
    at(T.loop, cycle);
  };
  stopIntro = () => { timers.forEach(clearTimeout); cancelAnimationFrame(raf); };
  cycle();
}

// ---- the command palette ---------------------------------------------------------------
// Commands depend on where you are. Each names the one API call it makes.
async function commands() {
  const out = [], add = (group, ic, title, apiCall, run, ask) => out.push({ group, ic, title, api: apiCall, run, ask });
  const c = ctx, u = me();
  if (c.view === "f") {
    const range = c.sel ? (c.sel[0] === c.sel[1] ? `line ${c.sel[0]}` : `lines ${c.sel[0]}–${c.sel[1]}`) : null;
    if (u) add("This file", "share-2", range ? `Share ${range}` : "Share lines…", `POST /api/repos/${c.owner}/${c.repo}/shares`, async (arg) => {
      const [from, to] = c.sel ?? String(arg).split(/[-–, ]+/).map(Number);
      const s = await api(`/repos/${c.owner}/${c.repo}/shares`, { path: c.path, from, to: to || from });
      copy(`${location.origin}/#/s/${s.id}`, `Link to lines ${s.from}–${s.to} copied`);
    }, c.sel ? null : "which lines, like 4-12");
    if (c.canWrite) add("This file", "git-commit-horizontal", "Commit this file", `POST /api/repos/${c.owner}/${c.repo}/do/commit`, async (msg) => {
      const r = await api(`${c.base}/commit${c.q}`, { message: msg }); toast(r.git?.commit ? `Pushed ${r.git.commit.slice(0, 7)}` : "Committed");
    }, "commit message");
  }
  if (c.view === "f" || c.view === "r") {
    if (c.canWrite) add("This repo", "file-plus", "Add a file", `POST /api/repos/${c.owner}/${c.repo}/files`, async (p) => {
      await api(`/repos/${c.owner}/${c.repo}/files`, { path: p, content: "" }); location.hash = `#/f/${c.owner}/${c.repo}/${encodeURIComponent(p)}`;
    }, "path, like src/hello.ts");
    if (c.isOwner) add("This repo", "user-plus", "Invite someone to the crew", `POST /api/repos/${c.owner}/${c.repo}/collaborators`, async (name) => {
      await api(`/repos/${c.owner}/${c.repo}/collaborators`, { name }); toast(`${name} joined the crew`); route();
    }, "their handle");
    if (c.isOwner) add("This repo", c.visibility === "private" ? "globe" : "lock", c.visibility === "private" ? "Make this repo public" : "Make this repo private", `PUT /api/repos/${c.owner}/${c.repo}`, async () => {
      await api(`/repos/${c.owner}/${c.repo}`, { visibility: c.visibility === "private" ? "public" : "private" }, "PUT"); route();
    });
    if (c.clone) add("This repo", "terminal", "Copy the git clone command", `GET /api/repos/${c.owner}/${c.repo}`, () => copy(c.clone, "Clone command copied"));
    add("This repo", "gamepad-2", "Play this repo's backrooms", `WS /api/game/r/${c.owner}/${c.repo}/ws`, () => (location.href = `/play.html#r/${c.owner}/${c.repo}`));
  }
  if (c.view === "l" && c.level?.status === "ready") {
    if (u) add("This level", "git-fork", `Fork ${c.level.title}`, `POST /api/levels/${c.slug}/fork`, async (name) => {
      const r = await api(`/levels/${c.slug}/fork`, { name: name || c.slug }); location.hash = `#/r/${r.owner}/${r.name}`;
    }, "name for your copy");
    add("This level", "gamepad-2", `Play ${c.level.title}`, `WS /api/game/l/${c.slug}/ws`, () => (location.href = `/play.html#l/${c.slug}`));
  }
  add("Anywhere", "search", "Search code", "GET /api/search?q=", (q) => (location.hash = "#/search/" + encodeURIComponent(q)), "what to look for");
  if (u) add("Anywhere", "book-plus", "New repo", "POST /api/repos", async (name) => { await api("/repos", { name }); location.hash = `#/r/${u}/${name}`; }, "repo name");
  if (u) add("Anywhere", "user", "Your profile", `GET /api/users/${u}`, () => (location.hash = `#/u/${u}`));
  for (const l of await api("/levels").catch(() => [])) if (l.status === "ready") add("Levels", "landmark", `Go to ${l.title}`, `GET /api/levels/${l.slug}/tree`, () => (location.hash = `#/l/${l.slug}`));
  add("Anywhere", "home", "Home", "", () => (location.hash = "#/"));
  if (u) add("Anywhere", "log-out", "Sign out", session.mode === "accounts" ? "POST /api/auth/sign-out" : "POST /api/logout", signOut);
  return out;
}

const palette = {
  el: $("#palette"), input: $("#pal-q"), list: $("#pal-list"), all: [], shown: [], at: 0, asking: null,
  async open() {
    this.asking = null; $("#pal-ask").hidden = true; this.input.placeholder = "Type a command, or search code";
    this.el.hidden = false; this.input.value = ""; this.input.focus();
    this.all = await commands(); this.render();
  },
  close() { this.el.hidden = true; },
  render() {
    if (this.asking) { this.list.innerHTML = `<li class="on">${icon(this.asking.ic)}<span>${esc(this.asking.title)}: press Enter</span><span class="api">${esc(this.asking.api)}</span></li>`; return icons(); }
    const q = this.input.value.trim().toLowerCase();
    this.shown = this.all.filter((c) => !q || c.title.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
    // Words that match nothing: offer them as a code search.
    if (q && !this.shown.length) this.shown = [{ group: "Search", ic: "search", title: `Search code for “${this.input.value.trim()}”`, api: "GET /api/search?q=", run: () => (location.hash = "#/search/" + encodeURIComponent(this.input.value.trim())) }];
    this.at = Math.min(this.at, Math.max(0, this.shown.length - 1));
    let group = null;
    this.list.innerHTML = this.shown.map((c, i) => (c.group !== group ? `<li class="group">${esc((group = c.group))}</li>` : "")
      + `<li data-i="${i}" class="${i === this.at ? "on" : ""}">${icon(c.ic)}<span>${esc(c.title)}${c.ask ? "…" : ""}</span><span class="api">${esc(c.api)}</span></li>`).join("");
    icons();
    this.list.querySelector("li.on")?.scrollIntoView({ block: "nearest" });
  },
  async run(c) {
    if (c.ask && !this.asking) {
      this.asking = c; $("#pal-ask").hidden = false; $("#pal-ask").textContent = c.title;
      this.input.value = ""; this.input.placeholder = c.ask; this.render(); return;
    }
    const arg = this.input.value.trim();
    if (c.ask && !arg) return;
    this.close();
    try { await c.run(arg); } catch (e) { toast(String(e.message || e)); }
  },
};
palette.input.addEventListener("input", () => { palette.at = 0; palette.render(); });
palette.input.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); return palette.asking ? palette.open() : palette.close(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); palette.at = (palette.at + (e.key === "ArrowDown" ? 1 : -1) + palette.shown.length) % Math.max(1, palette.shown.length); return palette.render(); }
  if (e.key === "Enter") { e.preventDefault(); const c = palette.asking ?? palette.shown[palette.at]; if (c) palette.run(c); }
});
palette.list.addEventListener("click", (e) => { const li = e.target.closest("li[data-i]"); if (li) palette.run(palette.shown[Number(li.dataset.i)]); });
palette.el.addEventListener("click", (e) => { if (e.target === palette.el) palette.close(); });
$("#jump").addEventListener("click", () => palette.open());
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palette.el.hidden ? palette.open() : palette.close(); }
});

// Views and how many plain segments come before a path tail: #/f/owner/repo/<path>.
const FIXED = { f: 2, r: 2, l: 1 };
async function route() {
  socket?.close(); socket = null;
  stopIntro();
  document.body.classList.remove("ide-mode");
  const [, view = "home", ...args] = location.hash.replace(/^#/, "").split("/");
  const n = FIXED[view];
  const parts = n === undefined ? args.map(decodeURIComponent) : [...args.slice(0, n).map(decodeURIComponent), decodeURIComponent(args.slice(n).join("/"))];
  try { await (views[view] && view !== "repoHead" && view !== "wireRepoHead" ? views[view] : views.home)(...parts); }
  catch (err) { app.innerHTML = `<div class="wrap" style="padding-top:24px"><div class="box"><div class="body">${esc(err.message)}</div></div></div>`; }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
refreshSession().then(() => { header(); route(); });
icons();
