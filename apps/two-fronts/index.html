<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Two Fronts</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%234c8dff%22/%3E%3Cpath d=%22M8 2a6 6 0 0 1 0 12z%22 fill=%22%23e5533d%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="war-room">
      <section class="map">
        <div id="map" class="map-view"></div>
        <div id="topbar" class="topbar"></div>
        <div id="overview" class="overview"></div>
        <div class="turnbox"><span id="turn-n" class="turn-n"></span><button type="button" id="end-turn" class="next">End turn</button></div>
      </section>
      <aside class="panel">
        <header><h1>Two Fronts</h1><button type="button" id="restart" class="icon-btn" title="New campaign" aria-label="New campaign"></button></header>
        <p class="tagline">The Wooka came with a furry ferocity unseen by the likes of man.</p>
        <div class="quick"><button type="button" id="hold-line" class="primary" title="Quick battle on Doren: the hunters become the hunted. Hold the shield generator against the Wooka">Hold the line</button><button type="button" id="be-horde" title="Quick battle on Doren: be the Wooka, and hunt the armoured ones through your forest">Be the horde</button><button type="button" id="dogfight" title="Quick battle: fly a fighter for the orbit over Doren" aria-label="Space battle"></button></div>
        <div id="status" class="status"></div>
        <div id="detail" class="detail"></div>
        <h3 id="orders-h">Orders</h3>
        <ul id="orders" class="orders"></ul>
        <h3 id="log-h">Last turn</h3>
        <ul id="log" class="log"></ul>
      </aside>
    </main>
    <section class="battle" aria-label="The hero battle">
      <canvas id="battle-view"></canvas>
      <div id="battle-hud" class="battle-hud"></div>
      <div class="crosshair" aria-hidden="true"></div>
    </section>
    <div id="flash" class="flash" role="alert" hidden></div>
    <div id="modal" class="modal" hidden><div id="modal-body" class="modal-body" role="dialog" aria-modal="true"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
