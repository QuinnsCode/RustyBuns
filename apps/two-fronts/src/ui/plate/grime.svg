<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <!-- Grime over the brushed steel (#3546): oil blooms, soot in the low spots, and long fine scratches. Tiles. -->
  <filter id="oil" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0 0.01  0 0 0 -2.4 1.25"/>
  </filter>
  <filter id="scratch" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.006" numOctaves="1" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.93  0 0 0 0 0.97  0 0 0 9 -7.6"/>
  </filter>
  <rect width="320" height="320" filter="url(#oil)" opacity="0.55"/>
  <rect width="320" height="320" filter="url(#scratch)" opacity="0.22" transform="rotate(-8 160 160)"/>
</svg>
