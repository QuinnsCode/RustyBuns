<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <!-- Brushed gunmetal, tiled behind every menu plate (#3531): fine horizontal grain, a few scuffs. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.8" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.72  0 0 0 0 0.78  0 0 0 0 0.86  1.6 0 0 0 -0.62"/>
  </filter>
  <filter id="scuff" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.035 0.11" numOctaves="1" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.88  0 0 0 0 0.92  3.2 0 0 0 -1.9"/>
  </filter>
  <rect width="256" height="256" fill="#1a1f26"/>
  <rect width="256" height="256" filter="url(#grain)" opacity="0.13"/>
  <rect width="256" height="256" filter="url(#scuff)" opacity="0.07"/>
</svg>
