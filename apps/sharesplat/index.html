<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ShareSplat</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <b class="brand"><span data-icon="box"></span><span data-copy="brand"></span></b>
      <span class="tag" data-copy="tag"></span>
    </header>
    <main>
      <section class="panel capture" aria-labelledby="cap-h">
        <h2 id="cap-h"><span data-icon="camera"></span><span data-copy="takePhotos"></span></h2>
        <p class="hint" data-copy="hint"></p>
        <div class="plans" role="radiogroup" aria-label="Capture plan">
          <button type="button" role="radio" data-plan="six" aria-checked="false">
            <b data-copy="six"></b><small data-copy="sixSub"></small>
          </button>
          <button type="button" role="radio" data-plan="orbit" aria-checked="true">
            <b data-copy="round"></b><small data-copy="roundSub"></small>
          </button>
        </div>
        <svg id="dial" viewBox="-110 -110 220 220" aria-label="Which shots are done"></svg>
        <p id="say" class="say" aria-live="polite"></p>
        <div class="row">
          <label class="btn primary"><span data-icon="aperture"></span><span data-copy="takePhoto"></span>
            <input id="shoot" type="file" accept="image/*" capture="environment" hidden />
          </label>
          <label class="btn"><span data-icon="images"></span><span data-copy="addMany"></span>
            <input id="batch" type="file" accept="image/*,video/*" multiple hidden />
          </label>
          <button id="reset" type="button" class="btn icon" title="Start over"><span data-icon="rotate-ccw"></span></button>
        </div>
        <p id="status" class="status"></p>
        <div id="thumbs" class="thumbs"></div>
      </section>

      <section class="panel view" aria-labelledby="view-h">
        <h2 id="view-h"><span data-icon="rotate-3d"></span><span data-copy="yourView"></span></h2>
        <div id="stage" class="stage">
          <canvas id="canvas"></canvas>
          <div id="drop" class="drop"><span data-icon="upload"></span><span><span data-copy="haveScan"></span> <label class="link"><span data-copy="pickOne"></span><input id="file" type="file" accept=".ply,.spz,.sog,.splat,.ksplat" hidden /></label><span data-copy="orExample"></span> <button id="example" type="button" class="link" data-copy="example"></button><span data-copy="end"></span></span></div>
        </div>
        <div class="row">
          <button id="spin" type="button" class="btn icon" title="Turntable on/off" aria-pressed="true"><span data-icon="refresh-cw"></span></button>
          <button id="bg" type="button" class="btn icon" title="Studio white / dark"><span data-icon="sun-moon"></span></button>
          <button id="clean" type="button" class="btn icon" title="Clean up: cut away the table and stray bits" disabled><span data-icon="scissors"></span></button>
          <button id="online" type="button" class="btn icon" title="Put it online (sign in with eqosys)" disabled><span data-icon="cloud-upload"></span></button>
          <span id="info" class="status"></span>
        </div>
        <details id="embed" class="embed">
          <summary><span data-icon="code"></span>Put it on a product page</summary>
          <p id="embed-how">Put it online (the cloud button), or host the splat file anywhere public, then paste this into the product description (Shopify: Show HTML).</p>
          <p><a id="page" target="_blank" rel="noopener" hidden></a></p>
          <textarea id="snippet" readonly rows="3"></textarea>
        </details>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
