<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound Guy Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&family=Metal+Mania&family=Permanent+Marker&family=Shantell+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main>
    <canvas id="stage" aria-label="Sound Guy Simulator"></canvas>
    <div id="hud">
      <p id="next" class="underlined" hidden></p>
      <div id="cross"></div>
      <p id="toward" class="gaff" hidden><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg><span id="toward-what"></span></p>
      <p id="hint" class="gaff"></p>
      <p id="carry" class="gaff"></p>
      <p id="mess" class="gaff" hidden></p>
      <button id="speakers" class="gaff" type="button">Speakers down: M to bring them up</button>
      <div id="controls-host"></div>
      <button id="arms" class="touch" type="button" title="Look at your arms (hold)" aria-label="Look at your arms (hold)">Ink</button>
    </div>
    <section id="menu">
      <div class="flyer">
        <p class="kicker" data-copy="kicker"></p>
        <h1 id="title" class="flyer-title"><span data-copy="titleTop"></span> <span data-copy="titleBottom"></span></h1>
        <p class="blurb" data-copy="blurb"></p>
        <div class="ticket-row">
          <button id="play" class="stub" type="button"><small aria-hidden="true" data-copy="stub"></small><span data-copy="play"></span></button>
          <div id="dial-host"></div>
        </div>
        <div id="tour-host"></div>
        <div id="ink-host"></div>
        <div class="side">
          <div id="home-host"></div>
          <p class="keys paper tape-r"><b data-copy="howToWork"></b><span data-copy="keys"></span></p>
        </div>
        <div class="flyer-foot">
          <div id="account"></div>
          <div id="party" class="paper tape" hidden>
            <button id="make" type="button" data-copy="makeParty"></button>
            <form id="join"><input id="joincode" data-copy-placeholder="partyCode" maxlength="12" data-copy-aria-label="partyCode"><button data-copy="join"></button></form>
            <p id="code" class="num"></p>
            <p id="crew"></p>
            <button id="start" hidden data-copy="start"></button>
          </div>
          <p id="note"></p>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
