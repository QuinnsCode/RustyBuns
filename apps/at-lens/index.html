<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AT Lens</title>
    <meta name="description" content="Type a handle and walk the AT Protocol: domain to DID, DID to data server, data server to records, and the account live on the firehose." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22none%22 stroke=%22%23f97316%22 stroke-width=%222%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222%22 fill=%22%23f97316%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <h1>AT Lens</h1>
      <p>Your name is a domain, your data sits on a server you pick, and every change is on a public stream. Type a handle to see each step.</p>
      <form id="ask">
        <input id="q" name="q" autocomplete="off" spellcheck="false" placeholder="atproto.com or did:plc:..." aria-label="Handle or DID" />
        <button type="submit">Look</button>
      </form>
      <p class="try">Try <a href="?q=atproto.com">atproto.com</a> <a href="?q=bsky.app">bsky.app</a></p>
    </header>
    <main>
      <section id="walk" aria-live="polite"></section>
      <section id="repo"></section>
      <section id="live"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
