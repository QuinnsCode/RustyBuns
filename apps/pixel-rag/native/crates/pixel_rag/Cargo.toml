[package]
name = "pixel_rag"
version = "0.0.1"
edition = "2021"

[lib]
# cdylib: bun:ffi on the host, and wasm32 on one shared memory in the page. Plain extern "C",
# no wasm-bindgen, so every lane runs the same code over the same bytes.
crate-type = ["cdylib", "rlib"]

# The face models natively on the desktop host (src/infer.rs): ONNX Runtime linked into the cdylib,
# which takes it from ~0.1 MB to ~16 MB. `--no-default-features` is the lite build (bun run
# build:native --lite): the host has no face models and the page runs them on onnxruntime-web, as a
# tab does. Never on wasm32, where the page always does.
[features]
default = ["faces"]
faces = ["dep:ort"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "download-binaries", "tls-rustls"], optional = true }
