<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cron Swanson</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23f0883e%27/%3E%3Ccircle cx=%2712%27 cy=%2713%27 r=%276%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3Cpath d=%27M12 10v3l2 1%27 stroke=%27white%27 stroke-width=%272%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./page.css" />
</head>
<body>
  <div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i><i class="cloud c5"></i></div>

  <header class="topbar">
    <div class="brand"><span class="logo" id="logo"></span><b>Cron Swanson</b></div>
    <button id="gear" class="ghost round" type="button" title="Settings" aria-haspopup="dialog"></button>
  </header>

  <div id="gate" class="gate card" hidden></div>

  <main class="view">
    <section id="v-busses" class="busses">
      <div class="bus-icons" id="bus-icons"></div>
      <canvas id="roll" class="roll"></canvas>
      <div class="empty" id="roll-empty" hidden></div>
    </section>

    <section id="v-list" class="card all" hidden>
      <header class="bar">
        <label class="search"><span id="search-icon"></span><input id="q" type="search" placeholder="Search" autocomplete="off" /></label>
        <label class="sort" title="Order"><select id="sort" aria-label="Order"></select></label>
      </header>
      <nav id="flows" class="chips flows" aria-label="Lanes"></nav>
      <div class="chips" id="apps"></div>
      <div class="chips" id="tags"></div>
      <section id="list" class="list"></section>
    </section>

    <section id="v-calendar" class="card calendar" hidden>
      <header class="bar">
        <button type="button" class="ghost round" id="cal-prev" title="Last week"></button>
        <b id="cal-label"></b>
        <button type="button" class="ghost round" id="cal-next" title="Next week"></button>
        <button type="button" class="ghost" id="cal-today" title="This week"></button>
      </header>
      <div id="cal"></div>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tip" id="tip" hidden></div>

  <nav class="dock">
    <button id="plus" class="fab primary" type="button" title="New alarm" aria-haspopup="dialog"></button>
    <canvas id="yule" class="yule" aria-hidden="true"></canvas>
    <button id="views" class="fab" type="button" title="Views" aria-haspopup="menu"></button>
  </nav>

  <div id="views-menu" class="pop pop-views card" role="menu" hidden>
    <div class="seg icons" id="view-picks"></div>
    <div class="chips" id="spans"></div>
  </div>

  <div id="settings" class="pop pop-gear card" role="dialog" aria-label="Settings" hidden>
    <div class="set"><span id="set-theme-icon"></span><div class="seg icons" id="theme-picks"></div></div>
    <div class="set"><span id="set-sound-icon"></span><button type="button" class="toggle" id="sound"></button></div>
    <div class="set"><span id="set-alert-icon"></span><button type="button" class="toggle" id="alerts"></button></div>
    <div class="set"><span id="set-font-icon"></span><div class="seg" id="font-picks" aria-label="Font"></div></div>
    <div class="set" id="set-account"></div>
    <p class="quiet keys"><kbd>⌘K</kbd> every command</p>
  </div>

  <dialog id="adder" class="adder">
    <form id="quick" method="dialog" autocomplete="off">
      <input id="what" class="what" name="what" required maxlength="120" placeholder="What?" />
      <div class="line">
        <span class="ico" id="every-icon" title="Every"></span>
        <input id="n" class="n digital" type="number" min="0" max="60" value="1" inputmode="numeric" aria-label="How many" />
        <div class="seg" id="units"></div>
      </div>
      <div class="line" id="start-line">
        <span class="ico" id="start-icon" title="Starting"></span>
        <input id="when" type="datetime-local" aria-label="Starting" />
      </div>
      <p class="hint digital" id="quick-hint"></p>
      <footer>
        <button type="button" class="ghost" id="new" title="More options"></button>
        <span class="grow"></span>
        <button type="button" class="ghost" id="adder-close" title="Close"></button>
        <button type="submit" class="primary big" id="add"></button>
      </footer>
    </form>
  </dialog>

  <dialog id="editor">
    <form id="form" method="dialog">
      <header><h2 id="editor-title">New job</h2><button type="button" class="ghost" id="close" title="Close"></button></header>
      <div class="grid">
        <label class="wide">Name<input name="name" required maxlength="120" placeholder="Back up the CRM" /></label>
        <label>App<input name="app" required maxlength="40" list="app-list" placeholder="qcrm" /><datalist id="app-list"></datalist></label>
        <label>Time zone<input name="tz" required list="tz-list" /><datalist id="tz-list"></datalist></label>
      </div>

      <fieldset>
        <legend>When</legend>
        <div class="seg" id="kinds"></div>
        <div class="when" data-kind="once"><label>At<input name="at" type="datetime-local" /></label></div>
        <div class="when" data-kind="every">
          <label>Every<input name="every" type="number" min="1" value="15" /></label>
          <label>Unit<select name="unit"><option value="1">minutes</option><option value="60">hours</option><option value="1440">days</option></select></label>
        </div>
        <div class="when" data-kind="daily weekly monthly yearly"><label>Time<input name="time" type="time" value="09:00" /></label></div>
        <div class="when" data-kind="weekly"><div class="days" id="days"></div></div>
        <div class="when" data-kind="monthly"><label>Day<select name="mday" id="mday"></select></label></div>
        <div class="when" data-kind="yearly">
          <label>Month<select name="month" id="month"></select></label>
          <label>Day<input name="yday" type="number" min="1" max="31" value="1" /></label>
        </div>
        <div class="when" data-kind="cron"><label class="wide">Cron line<input name="expr" placeholder="*/15 9-17 * * 1-5" spellcheck="false" /></label></div>
        <p class="preview" id="preview"></p>
      </fieldset>

      <fieldset>
        <legend>Does</legend>
        <div class="seg" id="actions"></div>
        <div class="grid" id="hook">
          <label class="wide">URL<input name="url" type="url" placeholder="https://qcrm.example.com/api/cron/backup" /></label>
          <label>Method<select name="method"><option>POST</option><option>GET</option></select></label>
        </div>
      </fieldset>

      <div class="grid">
        <label class="wide">Why<input name="why" maxlength="500" placeholder="Nightly copy in case D1 eats itself" /></label>
        <label class="wide">Tags<input name="tags" placeholder="backup, billing" /></label>
        <label class="wide">Note<textarea name="note" rows="3" maxlength="4000"></textarea></label>
        <label class="check"><input name="enabled" type="checkbox" checked /> Running</label>
      </div>
      <p class="error" id="error" role="alert"></p>
      <footer>
        <button type="button" class="danger" id="delete">Delete</button>
        <span class="grow"></span>
        <button type="button" class="ghost" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="./page.ts"></script>
</body>
</html>
