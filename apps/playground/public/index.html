body:has(.sky){--t0:0;animation:clock 360s linear infinite;animation-delay:calc(var(--t0) * -1s);
 --th:calc(var(--t) * 1turn);
 --el:sin(var(--th));
 --day:clamp(0,calc(0.42 + var(--el) * 1.9),1);
 --night:calc(1 - var(--day));
 --glow:clamp(0,calc(1 - var(--el) * var(--el) * 11),1);

 --dayp:calc(var(--day) * 100%);

 --cloud:color-mix(in oklab,color-mix(in oklab,#fff var(--dayp),#1c2440),#ffb38f calc(var(--glow) * 45%));
 --hill:color-mix(in oklab,#6f8f86 var(--dayp),#070a14);

.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(#05070f,#0b1020 55%,#141c33)}

.sky .day{inset:0;background:linear-gradient(#2f6fcf,#6ea9e6 45%,#bfdcf2 85%,#e8f1f7);opacity:var(--day)}

.sky .haze{inset:auto 0 0 0;height:45vh;background:linear-gradient(transparent,rgba(255,255,255,.55));opacity:var(--day)}

.sky .milk{left:18vw;top:114vh;width:0;height:0;opacity:calc(clamp(0,calc(var(--night) * 1.5 - .5),1) * .5);animation:wheel 1440s linear infinite;animation-delay:calc(var(--t0) * -1s)}
.sky .milk b{position:absolute;left:-150vmax;top:-70vmax;width:300vmax;height:40vmax;transform:rotate(34.4deg);transform-origin:50% 50%;
 background:linear-gradient(transparent,rgba(170,185,230,.1) 35%,rgba(205,215,245,.2) 50%,rgba(170,185,230,.1) 65%,transparent);filter:blur(18px)}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
.sky .meteor{top:12vh;left:20vw;width:16vw;height:1px;transform:rotate(28deg);transform-origin:0 0;opacity:0;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));animation:shoot 53s linear infinite;animation-delay:-50s}
.sky .meteor+.meteor{top:30vh;left:55vw;width:11vw;animation-duration:79s;animation-delay:-23s;transform:rotate(38deg)}
@keyframes shoot{0%,100%{translate:0 0;opacity:0}.4%{opacity:var(--night)}2.4%{translate:30vw 16vh;opacity:0}}
.sky .sun{left:0;top:0;width:9vmin;height:9vmin;border-radius:50%;translate:var(--sx) var(--sy);margin:-4.5vmin 0 0 -4.5vmin;
 --sunc:color-mix(in oklab,#fff6dc,#ff9a4a calc(var(--glow) * 75%));
 background:radial-gradient(circle,#fffdf5 0 30%,var(--sunc) 52%,color-mix(in oklab,var(--sunc) 55%,transparent) 100%);
 box-shadow:0 0 5vmin 2vmin color-mix(in oklab,var(--sunc) 55%,transparent),0 0 24vmin 10vmin color-mix(in oklab,var(--sunc) 22%,transparent);
 opacity:clamp(0,calc(.6 + var(--el) * 8),1)}
.sky .moon{left:0;top:0;width:6vmin;height:6vmin;border-radius:50%;translate:var(--mx) var(--my);margin:-3vmin 0 0 -3vmin;
 background:radial-gradient(circle at 36% 38%,rgba(0,0,0,.14) 0 7%,transparent 8%),radial-gradient(circle at 62% 62%,rgba(0,0,0,.12) 0 10%,transparent 11%),
 radial-gradient(circle at 30% 68%,rgba(0,0,0,.1) 0 5%,transparent 6%),radial-gradient(circle at 65% 30%,rgba(0,0,0,.08) 0 4%,transparent 5%),
 radial-gradient(circle at 40% 40%,#f4f6fb,#d9deea);
 box-shadow:inset 1.3vmin -.4vmin 1vmin rgba(6,9,20,.55),0 0 3vmin 1vmin rgba(200,215,255,.22),0 0 12vmin 4vmin rgba(180,200,255,.1);
 opacity:clamp(.1,calc(.55 - var(--el) * 3),1)}
.sky .cl{left:0;width:200vw;display:flex;will-change:transform;mask-image:linear-gradient(transparent,#000 30%,#000 78%,transparent)}
.sky .cl svg{width:100vw;height:100%;flex:none;display:block}
.sky .cl1{top:2vh;height:40vh;opacity:calc(.45 + var(--day) * .47);animation:drift 440s linear infinite}
.sky .cl2{top:16vh;height:34vh;opacity:calc(.3 + var(--day) * .4);animation:drift 290s linear infinite reverse}
.sky .cl feFlood{flood-color:var(--cloud)}
@keyframes drift{to{transform:translateX(-50%)}}
.sky .hills{left:0;bottom:0;width:100%;height:22vh}

<style>
  /* The sky (below) is eqosys's, baked in by `bun run sky`. Paper, ink and orange are codeSplitter's, and follow the sky's clock. */
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #0b1020; }
  main {
    --ink: color-mix(in oklab, #1f2328 var(--flipp), #f1f3f8);
    --mute: color-mix(in oklab, #59636e var(--flipp), #aab3c5);
    --paper: color-mix(in oklab, #fff var(--flipp), #141a2b);
    --edge: color-mix(in oklab, #d1d9e0 var(--flipp), #3a4460);
    --grain: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1.2px) 0 0 / 5px 5px;
    --acc: #f26b1d; --acc-soft: color-mix(in oklab, #f26b1d 16%, transparent);
    color: var(--ink); font: 17px/1.45 Brawler, Georgia, serif; max-width: 1040px; margin: 0 auto; padding: 40px 16px 120px;
  }
  header { text-align: center; margin: 4vh 0 36px; }
  .sunmark { display: inline-block; width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #fff3c4, var(--acc) 70%);
    box-shadow: 0 0 40px 8px color-mix(in oklab, var(--acc) 55%, transparent); animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-9px) rotate(8deg) scale(1.06); } }
  h1 { margin: 14px 0 6px; font-weight: 700; font-size: clamp(34px, 8vw, 76px); line-height: 1; letter-spacing: -.01em;
    color: #fff; text-shadow: 0 3px 0 var(--acc), 0 6px 0 rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35); }
  h1 .word { display: inline-block; white-space: nowrap; }
  h1 .word span { display: inline-block; animation: hop 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * 70ms); }
  @keyframes hop { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-.18em) rotate(-4deg); } }
  header p { margin: 0 auto 22px; max-width: 34em; font-size: 19px; color: #fff; padding: 8px 16px; border-radius: 8px; background: rgba(15,22,40,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .tools { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font: 700 15px/1 Brawler, Georgia, serif; padding: 11px 15px 10px; border: 1px solid var(--edge);
    border-radius: 6px; background: var(--grain), var(--paper); color: var(--ink); text-decoration: none; cursor: pointer;
    box-shadow: 0 2px 0 var(--edge); transition: transform .12s, box-shadow .12s, background .12s, border-color .12s; }
  .btn:hover { transform: translateY(-2px) rotate(-1.5deg); box-shadow: 0 4px 0 var(--edge); background: var(--grain), linear-gradient(0deg, var(--acc-soft), var(--paper) 85%); }
  .btn:active { transform: translateY(1px); box-shadow: 0 0 0 var(--edge); }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .btn.play { background: var(--acc); border-color: #c4500f; color: #fff; box-shadow: 0 2px 0 #c4500f; }
  .btn.play:hover { background: #ff7a2e; box-shadow: 0 4px 0 #c4500f; }
  .btn.play svg { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(3px); } }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  input { font: 17px Brawler, Georgia, serif; padding: 10px 14px; border: 1px solid var(--edge); border-radius: 6px; background: var(--paper); color: var(--ink); min-width: 220px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .card { position: relative; border: 1px solid var(--edge); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px;
    background: var(--grain), var(--paper); box-shadow: 0 3px 0 var(--edge), 0 18px 40px -22px rgba(0,0,0,.55);
    transform: rotate(var(--tilt)); transition: transform .18s cubic-bezier(.3,1.6,.5,1), box-shadow .18s;
    animation: pop .5s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(var(--n) * 45ms); }
  @keyframes pop { from { opacity: 0; transform: translateY(24px) rotate(0) scale(.9); } }
  .card:hover { transform: rotate(0) translateY(-6px) scale(1.025); box-shadow: 0 6px 0 var(--acc), 0 28px 50px -22px rgba(0,0,0,.6); }
  .card h2 { margin: 0; font-size: 24px; line-height: 1.1; display: flex; align-items: center; gap: 10px; }
  .card h2 i { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--acc); color: #fff; font-style: normal; font-size: 18px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .card p { margin: 0; color: var(--mute); flex: 1; }
  .tag { position: absolute; top: -10px; right: 12px; background: var(--acc); color: #fff; font-size: 12px; padding: 4px 9px 3px; border-radius: 4px; transform: rotate(4deg); box-shadow: 0 2px 0 #c4500f; letter-spacing: .04em; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .soon { color: var(--mute); font-size: 14px; }
  .empty { grid-column: 1 / -1; text-align: center; color: #fff; font-size: 22px; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  @media (prefers-reduced-motion: reduce) { .sunmark, h1 span, .card, .btn.play svg { animation: none; } .card, .btn { transition: none; } }
</style>
</head>

#cl2)"></rect></svg></div><div class="hills"><svg viewBox="0 0 1000 120" preserveAspectRatio="none" aria-hidden="true"><path class="h0" d="M0 60 C150 30 260 52 380 40 S560 10 680 34 S860 20 1000 30 V120 H0Z"></path><path class="h1" d="M0 70 C120 40 180 56 260 50 S420 20 520 44 S700 30 790 52 S920 48 1000 38 V120 H0Z"></path><path class="h2" d="M0 96 C90 80 160 92 240 84 S400 62 480 80 S640 70 740 88 S900 78 1000 72 V120 H0Z"></path></svg></div><div class="mist"></div></div>

<main>
  <header>
    <div class="sunmark" aria-hidden="true"></div>
    <h1 id="title" aria-label="Rusty Buns Playground">Rusty Buns Playground</h1>
    <p>Pick a world and jump in. Playable ones open in your browser; the rest are a download away.</p>
    <div class="tools">
      <input id="q" type="search" placeholder="Find an app" aria-label="Find an app" autocomplete="off">
      <button class="btn play" id="lucky" type="button"></button>
    </div>
  </header>
  <div id="grid"></div>
</main>
<script type="module">
const REPO = "https://github.com/QuinnsCode/RustyBuns";
const CYCLE = 360;
// Same sky as everyone else: the phase comes from the clock, so a reload carries on where the sky was.
document.body.style.setProperty("--t0", Math.floor(Date.now() / 1000) % CYCLE);

// The title letters hop in a wave.
const title = document.getElementById("title");
title.textContent = "";
let i = 0;
"Rusty Buns Playground".split(" ").forEach((word, w) => {
  const g = document.createElement("span");
  g.className = "word";
  g.setAttribute("aria-hidden", "true");
  for (const ch of word) {
    const s = document.createElement("span");
    s.style.setProperty("--i", i++);
    s.textContent = ch;
    g.append(s);
  }
  title.append(g, " ");
});

const SVG = "http://www.w3.org/2000/svg";
const icon = (d) => {
  const s = document.createElementNS(SVG, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("aria-hidden", "true");
  for (const p of d) { const e = document.createElementNS(SVG, "path"); e.setAttribute("d", p); s.append(e); }
  return s;
};
const ICONS = {
  play: ["M6 4l14 8-14 8z"],
  download: ["M12 3v12", "M7 11l5 5 5-5", "M5 21h14"],
  source: ["M16 18l6-6-6-6", "M8 6l-6 6 6 6"],
  dice: ["M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z", "M8 8h.01", "M16 8h.01", "M12 12h.01", "M8 16h.01", "M16 16h.01"],
};
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n[k] = v;
  n.append(...kids);
  return n;
};
const link = (text, href, kind, cls = "btn") => el("a", { href, className: cls, rel: "noopener" }, icon(ICONS[kind]), text);

const apps = await (await fetch("apps.json")).json();
const grid = document.getElementById("grid");
const q = document.getElementById("q");
const playable = apps.filter((a) => a.play);

const lucky = document.getElementById("lucky");
lucky.append(icon(ICONS.dice), "Surprise me");
lucky.hidden = playable.length === 0;
lucky.onclick = () => { open(playable[Math.floor(Math.random() * playable.length)].play, "_blank", "noopener"); };

const draw = () => {
  const needle = q.value.trim().toLowerCase();
  grid.replaceChildren();
  const shown = apps.filter((a) => !needle || `${a.name} ${a.line}`.toLowerCase().includes(needle));
  shown.forEach((a, n) => {
    const links = el("div", { className: "links" });
    if (a.play) links.append(link("Play", a.play, "play", "btn play"));
    if (a.download) links.append(link("Download", `${REPO}/releases?q=${a.download}&expanded=true`, "download"));
    if (a.app) links.append(link("Source", `${REPO}/tree/main/apps/${a.app}`, "source"));
    if (!a.play) links.append(el("span", { className: "soon", textContent: a.download ? "Browser version soon" : "Coming soon" }));
    const card = el("div", { className: "card" }, el("h2", {}, el("i", { textContent: a.name[0] }), a.name), el("p", { textContent: a.line }), links);
    if (a.play) card.prepend(el("span", { className: "tag", textContent: "PLAY NOW" }));
    card.style.setProperty("--n", n);
    card.style.setProperty("--tilt", `${((n * 7) % 5 - 2) * 0.5}deg`);
    grid.append(card);
  });
  if (!shown.length) grid.append(el("p", { className: "empty", textContent: "Nothing here yet. Try another word." }));
};
q.oninput = draw;
draw();
</script>
