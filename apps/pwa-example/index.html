<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8590c">
  <meta name="description" content="Roll dice offline. A Rusty Buns PWA: TypeScript page, Rust roller in wasm.">
  <title>Pocket Dice</title>
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icons/192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/192.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header>
    <h1>Pocket Dice</h1>
    <span id="status" class="chip"></span>
  </header>
  <main>
    <div id="dice" class="dice" aria-live="polite"></div>
    <p id="total" class="total"></p>
    <div class="pickers">
      <label>Dice <select id="count"></select></label>
      <label>Sides <select id="sides"></select></label>
    </div>
    <button id="roll" class="roll"></button>
    <ol id="history" class="history"></ol>
  </main>
  <footer>
    <button id="share" class="ghost"></button>
    <button id="install" class="ghost" hidden></button>
    <span id="engine" class="chip"></span>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
