[package]
name = "qcrm_engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "qCRM's wave shader and CRM analysis engine, compiled to wasm (scripts/wasm.ts)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Standalone: keep the root native/Cargo.toml workspace (native/crates/*) from claiming this crate.
[workspace]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]
