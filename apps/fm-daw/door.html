<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1013" />
<title>Qollab Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231d1f23%22/%3E%3Cpath d=%22M2 9h2l2-5 2 9 2-7 2 3h2%22 fill=%22none%22 stroke=%22%23ff6b4a%22 stroke-width=%221.6%22/%3E%3C/svg%3E" />
<style>
  html, body { margin: 0; min-height: 100%; background: #0f1013; color: #f4f1ea; font: 400 15px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
  main { box-sizing: border-box; max-width: 1080px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px 32px; }
  h1 { font: 600 40px/1 "Barlow Condensed", sans-serif; letter-spacing: .02em; margin: 8px 0 6px; }
  h1 span { color: #ff6b4a; }
  .lede { margin: 0 0 22px; color: #b9b4aa; max-width: 60ch; }
  #paths { display: grid; gap: 28px; }
  .sector { --tone: #0f766e; display: grid; gap: 10px; }
  .sector[data-sector="build"] { --tone: #c2410c; }
  .sector[data-sector="play"] { --tone: #4f46e5; }
  .sector h2 { margin: 0; font: 600 15px/1 "Barlow Condensed", sans-serif; letter-spacing: .18em; text-transform: uppercase; color: color-mix(in srgb, var(--tone) 55%, #f4f1ea); }
  .sector .line { margin: -4px 0 2px; color: #8b877f; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
  .path { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 14px; background: #1a1c21; color: inherit; text-decoration: none; border: 1px solid #2a2d33; transition: background .15s, border-color .15s, transform .15s; }
  .path:hover, .path:focus-visible { background: #20242a; border-color: var(--tone); transform: translateY(-1px); outline: none; }
  .icon { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: var(--tone); color: #f4f1ea; }
  .text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .text b { font: 600 22px/1.1 "Barlow Condensed", sans-serif; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .does { color: #b9b4aa; }
  .tag { align-self: flex-start; margin-top: 4px; padding: 2px 8px; border-radius: 999px; background: #2a2d33; color: #d8d3c8; font-size: 12px; white-space: nowrap; }
  .foot { margin: 22px 0 0; color: #8b877f; font-size: 13px; }
  @media (min-width: 1000px) { h1 { font-size: 52px; } .cards { grid-template-columns: repeat(3, 1fr); } }
</style>
</head><body>
<main>
  <h1>Qollab <span>Studio</span></h1>
  <p class="lede">Learn it, build it, play it live. Pick what you came to do: each card opens on its first step, and the Paths button on every page brings you back here.</p>
  <nav id="paths" aria-label="Learn, build and play"></nav>
  <p class="foot">Only The Event asks you to sign in: it is a room you share with friends. Everything else works signed out.</p>
</main>
<script type="module" src="/src/front.ts"></script>
</body></html>
