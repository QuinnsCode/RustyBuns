<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Studio Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231d1f23%22/%3E%3Crect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 fill=%22none%22 stroke=%22%23ff6b4a%22 stroke-width=%221.6%22/%3E%3Ccircle cx=%226.5%22 cy=%227%22 r=%221.3%22 fill=%22%23ff6b4a%22/%3E%3C/svg%3E" />
</head><body>
<header>
  <h1>Studio builder</h1>
  <label>Start from <select id="preset"></select></label>
  <p id="about"></p>
</header>
<main>
  <section id="plan-box">
    <div id="tools" role="toolbar" aria-label="Build tools"></div>
    <div id="catalog" hidden></div>
    <div id="stage">
      <canvas id="view" aria-label="Your studio in 3D, cut away so you can see in"></canvas>
      <svg id="plan" role="img" aria-label="The room from above" hidden></svg>
      <div id="orbit"></div>
      <div id="measure" hidden></div>
    </div>
    <p id="why" role="status"></p>
  </section>
  <aside id="side">
    <div id="sound"></div>
    <div id="pa"></div>
    <div id="edit"></div>
  </aside>
</main>
<script type="module" src="/src/studio/page.ts"></script>
<script type="module">import { mountBack } from "/src/way.ts"; mountBack();</script>
</body></html>
