<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1013" />
<title>QDJs set: listen live</title>
<style>
html, body { margin: 0; min-height: 100%; background: #0b0c0e; color: #e8e9ec; font: 16px "IBM Plex Sans", system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 20px 40px; display: grid; gap: 18px; }
small { color: #9aa0aa; letter-spacing: 0.08em; font: 600 14px "Barlow Condensed", sans-serif; text-transform: uppercase; }
h1 { margin: 0; font: 600 38px/1.05 "Barlow Condensed", sans-serif; overflow-wrap: anywhere; }
#status { margin: 0; color: #9aa0aa; }
#limit:empty { display: none; }
#status.live { color: #ff6b4a; }
#status.live::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #ff4a4a; margin-right: 8px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
#play { justify-self: start; font: 600 22px "Barlow Condensed", sans-serif; padding: 12px 30px; border-radius: 12px; border: 0; background: #ff6b4a; color: #15171b; cursor: pointer; }
#play[aria-pressed="true"] { background: #2a2d33; color: #e8e9ec; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
li { background: #17191d; border-radius: 10px; padding: 8px 12px; overflow-wrap: anywhere; }
li span { color: #9aa0aa; font-variant-numeric: tabular-nums; margin-right: 6px; }
/* the light look (the pick in the room pill, src/ui/theme.ts) */
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="light"] body { background: #e4e6e9; color: #17191c; }
:root[data-theme="light"] small, :root[data-theme="light"] #status, :root[data-theme="light"] li span { color: #555c66; }
:root[data-theme="light"] #status.live { color: #c2361c; }
:root[data-theme="light"] #play[aria-pressed="true"] { background: #cfd3d8; color: #17191c; }
:root[data-theme="light"] li { background: #f4f5f6; }
</style>
</head><body>
<main>
  <small>QDJs, live</small>
  <h1 id="name">QDJs set</h1>
  <p id="status"></p>
  <div id="limit"></div>
  <button id="play" type="button" aria-pressed="false">Play</button>
  <small>Track list</small>
  <ol id="cues"></ol>
</main>
<script type="module" src="/src/dj/listen-page.ts"></script>
</body></html>
