<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- A moulded-plastic sprue for border-image (slice 40, repeat round): an olive runner; each edge tile (the middle
       160) carries one gate rib, so gates land about every 110 px whatever the card's size; each corner is a round
       sprue node with a numbered part tab (A1, A2, B1, B2) on its stub. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f8f4e"/><stop offset=".5" stop-color="#55632f"/><stop offset="1" stop-color="#3a4420"/></linearGradient>
    <radialGradient id="n" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#a9ba72"/><stop offset=".45" stop-color="#5d6b35"/><stop offset="1" stop-color="#343d1c"/></radialGradient>
    <g id="rib"><rect x="-4" y="14" width="8" height="24" rx="2.5" fill="#55632f" stroke="#2e3618" stroke-width="1.2"/><rect x="-2" y="16" width="2" height="18" fill="#a9ba72" opacity=".55"/></g>
    <g id="tab"><rect x="-11" y="-7" width="22" height="14" rx="3" fill="url(#n)" stroke="#2e3618" stroke-width="1.2"/></g>
  </defs>
  <rect x="12" y="12" width="216" height="216" rx="8" fill="none" stroke="#262c14" stroke-width="15"/>
  <rect x="12" y="12" width="216" height="216" rx="8" fill="none" stroke="url(#g)" stroke-width="12"/>
  <rect x="10" y="10" width="220" height="220" rx="9" fill="none" stroke="#b8c98a" stroke-opacity=".35" stroke-width="1.3"/>
  <use href="#rib" transform="translate(120 0)"/><use href="#rib" transform="translate(120 240) rotate(180)"/>
  <use href="#rib" transform="translate(0 120) rotate(-90)"/><use href="#rib" transform="translate(240 120) rotate(90)"/>
  <use href="#tab" transform="translate(27 27) rotate(45)"/><use href="#tab" transform="translate(213 27) rotate(-45)"/>
  <use href="#tab" transform="translate(27 213) rotate(-45)"/><use href="#tab" transform="translate(213 213) rotate(45)"/>
  <g font-family="Arial Narrow, Arial, sans-serif" font-size="9" font-weight="700" fill="#1f270c" text-anchor="middle" dominant-baseline="central">
    <text transform="translate(27 27) rotate(45)">A1</text><text transform="translate(213 27) rotate(-45)">A2</text>
    <text transform="translate(27 213) rotate(-45)">B1</text><text transform="translate(213 213) rotate(45)">B2</text>
  </g>
  <g stroke="#2e3618" stroke-width="1.2"><circle cx="12" cy="12" r="11" fill="url(#n)"/><circle cx="228" cy="12" r="11" fill="url(#n)"/><circle cx="12" cy="228" r="11" fill="url(#n)"/><circle cx="228" cy="228" r="11" fill="url(#n)"/></g>
  <g fill="#fff" fill-opacity=".45"><circle cx="8.5" cy="8.5" r="2.8"/><circle cx="224.5" cy="8.5" r="2.8"/><circle cx="8.5" cy="224.5" r="2.8"/><circle cx="224.5" cy="224.5" r="2.8"/></g>
</svg>
