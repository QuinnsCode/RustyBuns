[package]
name = "mythic_sim"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mythic Masters' fight sim and bot, bit for bit with src/sim.ts and src/bot.ts, for the balance tuner (scripts/tune.ts --rust)"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mythic-sim"
path = "src/main.rs"

# No dependencies: the same code builds native and to wasm32-unknown-unknown, offline.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Standalone: not part of the root native/Cargo.toml workspace, and never a desktop cdylib.
[workspace]
