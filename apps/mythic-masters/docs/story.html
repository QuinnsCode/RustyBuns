<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythic Masters: the story map</title>
<style>
:root { --paper: #efe4c8; --paper-2: #e6d6b0; --ink: #2a2118; --faint: #6d5c45; --rust: #8c3b1f; --line: #b79f74;
  --main: #8c3b1f; --sub: #2f5a6b; --side: #4d6a2f; --unlock: #7a5a12; }
* { box-sizing: border-box; }
body { margin: 0; background: #3b2f22; color: var(--ink); font: 15px/1.45 Georgia, "Iowan Old Style", serif; }
header { padding: 18px 24px 10px; color: var(--paper); display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
header h1 { margin: 0; font-size: 26px; font-weight: normal; letter-spacing: .02em; }
header .card { font-size: 13px; opacity: .85; }
header .card b { color: #f0c27a; font-weight: normal; }
.legend { display: flex; gap: 14px; font-size: 13px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; background: var(--c); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: inherit; font-size: 12px; background: transparent; color: var(--paper); border: 1px solid #8a7656; border-radius: 12px; padding: 2px 10px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
main { position: relative; margin: 0 16px 16px; background: var(--paper) radial-gradient(ellipse at 30% 20%, #f6eed8, transparent 60%); border-radius: 4px;
  box-shadow: inset 0 0 60px rgba(80,50,20,.35), 0 8px 30px rgba(0,0,0,.5); overflow-x: auto; }
.grid { display: grid; grid-template-columns: 92px repeat(var(--cols), minmax(190px, 1fr)); position: relative; min-width: calc(92px + var(--cols) * 190px); }
.head, .kind { position: sticky; top: 0; background: var(--paper-2); border-bottom: 1px solid var(--line); padding: 10px 10px 8px; z-index: 2; }
.head h2 { margin: 0; font-size: 15px; font-weight: normal; }
.head small, .kind small { color: var(--faint); font-size: 12px; display: block; }
.kind { position: static; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; border-right: 1px solid var(--line); color: var(--c); font-variant: small-caps; font-size: 17px; letter-spacing: .08em; }
.cell { border-left: 1px dashed rgba(120,90,50,.25); border-bottom: 1px solid rgba(120,90,50,.25); padding: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 1; }
.beat { position: relative; text-align: left; font: inherit; font-size: 13px; line-height: 1.3; background: rgba(255,250,235,.8); color: var(--ink); border: 1px solid var(--line);
  border-left: 4px solid var(--c); border-radius: 3px; padding: 5px 7px 5px 8px; cursor: pointer; }
.beat:hover, .beat:focus-visible { background: #fffaf0; outline: 2px solid var(--c); }
.beat .t { display: block; }
.beat .m { display: block; color: var(--faint); font-size: 11px; }
.beat.game { background: rgba(240,230,205,.7); border-style: dashed; border-left-style: solid; }
.beat.idea .t::after { content: " (idea)"; color: var(--faint); font-size: 11px; }
.beat.owner { box-shadow: inset 0 0 0 1px var(--rust); }
.beat.dim { opacity: .2; }
.beat.lit { outline: 2px solid var(--c); background: #fffaf0; }
svg.threads { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: visible; }
svg.threads path { fill: none; stroke: var(--rust); stroke-width: 1.2; opacity: .18; }
svg.threads path.lit { opacity: .9; stroke-width: 2; }
.area { padding: 8px 10px; font-size: 12.5px; color: var(--faint); border-left: 1px dashed rgba(120,90,50,.25); }
.area p { margin: 0 0 6px; color: var(--ink); font-style: italic; }
.area ul { margin: 0; padding-left: 16px; }
.area li.built { color: var(--ink); }
.area li.built::marker { content: "+ "; color: var(--side); }
aside { position: fixed; right: 16px; top: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); background: var(--paper); border-radius: 4px; padding: 18px 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,.6); overflow: auto; z-index: 10; display: none; }
aside.open { display: block; }
aside h3 { margin: 0 0 4px; font-weight: normal; font-size: 21px; }
aside .meta { color: var(--faint); font-size: 13px; margin-bottom: 10px; }
aside label { display: block; font-size: 12px; color: var(--faint); margin-top: 10px; }
aside input, aside textarea, aside select { width: 100%; font: inherit; font-size: 14px; background: #fffaf0; border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; color: var(--ink); }
aside textarea { min-height: 150px; resize: vertical; }
aside .row { display: flex; gap: 8px; margin-top: 14px; }
aside button.act { font: inherit; background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; padding: 7px 14px; cursor: pointer; }
aside button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
aside .x { position: absolute; right: 12px; top: 10px; background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--faint); }
aside .msg { margin-top: 10px; font-size: 13px; white-space: pre-wrap; }
aside .msg.bad { color: var(--rust); }
aside a { color: var(--sub); }
.problems { margin: 0 16px 10px; padding: 8px 12px; background: #f3d9c9; color: #6b2010; border-radius: 3px; font-size: 13px; }
</style></head>
<body>
<header>
  <h1>The story map</h1>
  <div class="card" id="card"></div>
  <div class="legend"><span style="--c:var(--main)">main</span><span style="--c:var(--sub)">sub</span><span style="--c:var(--side)">side</span><span style="--c:var(--unlock)">unlock</span><span style="color:#d8c8a8">dashed: the game plays it</span></div>
  <div class="filters" id="filters"></div>
</header>
<div id="problems"></div>
<main><div class="grid" id="grid"></div><svg class="threads" id="threads"></svg></main>
<aside id="panel" aria-live="polite"></aside>
<script>
const D = {"road":[{"n":1,"id":"pine-barrens","name":"Pine Barrens","level":2},{"n":2,"id":"appalachian-hollows","name":"Appalachian hollows","level":10},{"n":3,"id":"great-north-woods","name":"Great North Woods","level":18},{"n":5,"id":"great-lakes-and-lake-champlain","name":"Great Lakes and Lake Champlain","level":34},{"n":4,"id":"pacific-northwest-rainforest","name":"Pacific Northwest rainforest","level":26},{"n":6,"id":"southwest-desert","name":"Southwest desert","level":42},{"n":7,"id":"bayou-and-everglades","name":"Bayou and Everglades","level":50},{"n":8,"id":"ozarks-and-the-southern-plains","name":"Ozarks and the southern plains","level":58}],"arcs":[{"id":"ledger","kind":"main","title":"The ledger: every region's mythic","pitch":"The trail of each playable region ends at its mythic. The Book wants them all.","game":true},{"id":"roads","kind":"unlock","title":"The roads","pitch":"Each mythic beaten opens the roads to its neighbours; some need a flier or a swimmer in the line-up.","game":true},{"id":"slots","kind":"unlock","title":"The line-up grows","pitch":"The line-up starts at 3 and gains a place for each of the first mythics, up to 5.","game":true},{"id":"office","kind":"sub","title":"The Office of Unlisted Fauna","pitch":"The Book is government property. It is a register. It left its shelf without Form 9-C. The Office will log it, seize it and file it. A register does not talk. Reports that this register talks are errors in the report.","game":true},{"id":"institute","kind":"sub","title":"The Halloway Institute","pitch":"The Book is a field instrument. It is a catalogue that sorts specimens by a measure. We do not have that measure yet. We will have it before the grant ends. Then we will not need the Carrier.","game":true},{"id":"lamplighters","kind":"sub","title":"The Lamplighters","pitch":"The Book is a cage with pages. A cage cannot walk, so it hires a hand. You are the hand. We read the tracks for years and we are sure. Do not ask the cage. A cage says what a cage says.","game":true},{"id":"boards","kind":"side","title":"Sighting boards","pitch":"Two cryptid contracts a region, pinned in a town: read the report, follow three signs, find the named creature.","game":true},{"id":"book-wakes","kind":"main","title":"The Book wakes","pitch":"The Book's ledger, region by region. Each mythic you bring it is a name it already knew, and each region shows a little more of why something is waking the cryptids. What the Book is stays the owner's to write; these beats only point at it.","game":false},{"id":"gary","kind":"sub","title":"Gary's documentary","pitch":"Gary narrates the found tapes, always one region ahead of you and always just missing the shot. His tapes get stranger and closer, until you meet him at Fouke, where the old drive-in still shows a monster film.","game":false},{"id":"last-bearer","kind":"sub","title":"The last bearer","pitch":"The rust thumbprint on every page belongs to someone. Their trail runs through lumber camps, a ghost town and a bayou: a hat, a field guide, a pirogue. Who they were is the owner's to write.","game":false},{"id":"believers-letters","kind":"sub","title":"Letters between the fires","pitch":"The eight believer groups write to each other but never meet. Carry their letters camp to camp along the road and, at the end, they hold their first convention at the Howl-Back Club's ridge. Each letter makes the next camp trust you sooner.","game":false},{"id":"sides-east","kind":"side","title":"Evenings in the east","pitch":"One place, one evening each: a fire tower, a flooded bog, a logging train, a feud, a county fair, a portage.","game":false},{"id":"sides-west","kind":"side","title":"Evenings in the west","pitch":"A fallen giant, a missing reel, an island with no cars, a wolf count, a cave of bats, a crater survey.","game":false},{"id":"sides-south","kind":"side","title":"Evenings in the south","pitch":"A faith healer, a smugglers' bay, a diamond field, a storm chase.","game":false},{"id":"tools","kind":"unlock","title":"Tools of the road","pitch":"What you carry decides where you can go: a lamp for the night, a radio for rumours, a canoe for the lakes, a bicycle for the island, a second pen for the Book. Each comes from someone you meet, at a level.","game":false}],"beats":[{"id":"mythic-pine-barrens","title":"Jersey Devil at Leeds Point","at":"mythic:1","fights":["jersey-devil"],"text":"The last stone of the Pine Barrens trail: the region's mythic, Jersey Devil, in its lair. Beat it and the Book can hold it.","arc":"ledger","kind":"main","status":"built","game":true,"where":{"region":1,"level":10,"label":"Pine Barrens: Leeds Point"}},{"id":"mythic-appalachian-hollows","title":"Mothman at Point Pleasant","at":"mythic:2","fights":["mothman"],"text":"The last stone of the Appalachian hollows trail: the region's mythic, Mothman, in its lair. Beat it and the Book can hold it.","arc":"ledger","kind":"main","status":"built","game":true,"where":{"region":2,"level":18,"label":"Appalachian hollows: Point Pleasant"}},{"id":"mythic-great-north-woods","title":"Hidebehind at The hidebehind","at":"mythic:3","fights":["hidebehind"],"text":"The last stone of the Great North Woods trail: the region's mythic, Hidebehind, in its lair. Beat it and the Book can hold it.","arc":"ledger","kind":"main","status":"built","game":true,"where":{"region":3,"level":26,"label":"Great North Woods: The hidebehind"}},{"id":"mythic-great-lakes-and-lake-champlain","title":"Champ at Champ's water","at":"mythic:5","fights":["champ"],"text":"The last stone of the Great Lakes and Lake Champlain trail: the region's mythic, Champ, in its lair. Beat it and the Book can hold it.","arc":"ledger","kind":"main","status":"built","game":true,"where":{"region":5,"level":42,"label":"Great Lakes and Lake Champlain: Champ's water"}},{"id":"mythic-pacific-northwest-rainforest","title":"Sasquatch at Sasquatch's ridge","at":"mythic:4","fights":["sasquatch"],"text":"The last stone of the Pacific Northwest rainforest trail: the region's mythic, Sasquatch, in its lair. Beat it and the Book can hold it.","arc":"ledger","kind":"main","status":"built","game":true,"where":{"region":4,"level":34,"label":"Pacific Northwest rainforest: Sasquatch's ridge"}},{"id":"mythic-southwest-desert","title":"Chupacabra at The ranch","at":"mythic:6","fights":["chupacabra"],"text":"The last stone of the Southwest desert trail: the region's mythic, Chupacabra, in its lair. Beat it and the Book can hold it.","arc":"ledger","kind":"main","status":"built","game":true,"where":{"region":6,"level":50,"label":"Southwest desert: The ranch"}},{"id":"mythic-bayou-and-everglades","title":"Rougarou at The rougarou's swamp","at":"mythic:7","fights":["rougarou"],"text":"The last stone of the Bayou and Everglades trail: the region's mythic, Rougarou, in its lair. Beat it and the Book can hold it.","arc":"ledger","kind":"main","status":"built","game":true,"where":{"region":7,"level":58,"label":"Bayou and Everglades: The rougarou's swamp"}},{"id":"mythic-ozarks-and-the-southern-plains","title":"Ozark Howler at The howler's hollow","at":"mythic:8","fights":["ozark-howler"],"text":"The last stone of the Ozarks and the southern plains trail: the region's mythic, Ozark Howler, in its lair. Beat it and the Book can hold it.","arc":"ledger","kind":"main","status":"built","game":true,"where":{"region":8,"level":66,"label":"Ozarks and the southern plains: The howler's hollow"}},{"id":"road-appalachian-hollows","title":"The road to the Appalachian hollows","at":"mythic:1","needs":["mythic-pine-barrens"],"text":"Beating Jersey Devil opens the road from the Pine Barrens to the Appalachian hollows; a gorge too wide to walk: bring a flier in your line-up (the Jersey Devil, once you have beaten it and bound it).","opens":"region 2, Appalachian hollows, from level 10 (needs a flier)","arc":"roads","kind":"unlock","status":"built","game":true,"where":{"region":1,"level":10,"label":"Pine Barrens: Leeds Point"}},{"id":"road-great-north-woods","title":"The road to the Great North Woods","at":"mythic:1","needs":["mythic-pine-barrens"],"text":"Beating Jersey Devil opens the road from the Pine Barrens to the Great North Woods.","opens":"region 3, Great North Woods, from level 18","arc":"roads","kind":"unlock","status":"built","game":true,"where":{"region":1,"level":10,"label":"Pine Barrens: Leeds Point"}},{"id":"road-great-lakes-and-lake-champlain","title":"The road to the Great Lakes and Lake Champlain","at":"mythic:3","needs":["mythic-great-north-woods"],"text":"Beating Hidebehind opens the road from the Great North Woods to the Great Lakes and Lake Champlain.","opens":"region 5, Great Lakes and Lake Champlain, from level 34","arc":"roads","kind":"unlock","status":"built","game":true,"where":{"region":3,"level":26,"label":"Great North Woods: The hidebehind"}},{"id":"road-pacific-northwest-rainforest","title":"The road to the Pacific Northwest rainforest","at":"mythic:5","needs":["mythic-great-lakes-and-lake-champlain"],"text":"Beating Champ opens the road from the Great Lakes and Lake Champlain to the Pacific Northwest rainforest.","opens":"region 4, Pacific Northwest rainforest, from level 26","arc":"roads","kind":"unlock","status":"built","game":true,"where":{"region":5,"level":42,"label":"Great Lakes and Lake Champlain: Champ's water"}},{"id":"road-southwest-desert","title":"The road to the Southwest desert","at":"mythic:4","needs":["mythic-pacific-northwest-rainforest"],"text":"Beating Sasquatch opens the road from the Pacific Northwest rainforest to the Southwest desert.","opens":"region 6, Southwest desert, from level 42","arc":"roads","kind":"unlock","status":"built","game":true,"where":{"region":4,"level":34,"label":"Pacific Northwest rainforest: Sasquatch's ridge"}},{"id":"road-bayou-and-everglades","title":"The road to the Bayou and Everglades","at":"mythic:2","needs":["mythic-appalachian-hollows"],"text":"Beating Mothman opens the road from the Appalachian hollows to the Bayou and Everglades.","opens":"region 7, Bayou and Everglades, from level 50","arc":"roads","kind":"unlock","status":"built","game":true,"where":{"region":2,"level":18,"label":"Appalachian hollows: Point Pleasant"}},{"id":"road-ozarks-and-the-southern-plains","title":"The road to the Ozarks and the southern plains","at":"mythic:5","needs":["mythic-great-lakes-and-lake-champlain"],"text":"Beating Champ opens the road from the Great Lakes and Lake Champlain to the Ozarks and the southern plains.","opens":"region 8, Ozarks and the southern plains, from level 58","arc":"roads","kind":"unlock","status":"built","game":true,"where":{"region":5,"level":42,"label":"Great Lakes and Lake Champlain: Champ's water"}},{"id":"slot-4","title":"A line-up of 4","at":"mythic:1","needs":["mythic-pine-barrens"],"text":"Beating Jersey Devil gives the line-up one more place.","opens":"line-up slot 4","arc":"slots","kind":"unlock","status":"built","game":true,"where":{"region":1,"level":10,"label":"Pine Barrens: Leeds Point"}},{"id":"slot-5","title":"A line-up of 5","at":"mythic:2","needs":["mythic-appalachian-hollows"],"text":"Beating Mothman gives the line-up one more place.","opens":"line-up slot 5","arc":"slots","kind":"unlock","status":"built","game":true,"where":{"region":2,"level":18,"label":"Appalachian hollows: Point Pleasant"}},{"id":"office-1","title":"Form 9-C","at":"stage:office.1","text":"The Office stopped you under the fire tower on Apple Pie Hill and opened a file.","fights":["hodag","wampus-cat"],"arc":"office","kind":"sub","status":"built","game":true,"where":{"region":1,"level":4,"label":"the Office: Form 9-C"}},{"id":"office-2","title":"Quiet Zone","at":"stage:office.2","text":"At Green Bank the Office ordered the Book switched off, and Agent Quist asked about the mothman.","needs":["office-1"],"fights":["flatwoods-monster","snallygaster"],"arc":"office","kind":"sub","status":"built","game":true,"where":{"region":2,"level":13,"label":"the Office: Quiet Zone"}},{"id":"office-3","title":"The Wooden One","at":"stage:office.3","text":"At Rhinelander, Agent Pell guarded a crate that holds the wired wooden hodag of the 1896 fair.","needs":["office-2"],"fights":["teakettler","snallygaster"],"arc":"office","kind":"sub","status":"built","game":true,"where":{"region":3,"level":18,"label":"the Office: The Wooden One"}},{"id":"office-4","title":"The Frames","at":"stage:office.4","text":"The Office called your camcorder evidence and asked for the tape.","needs":["office-3"],"fights":["splintercat","teakettler","champ"],"arc":"office","kind":"sub","status":"built","game":true,"where":{"region":5,"level":37,"label":"the Office: The Frames"}},{"id":"office-5","title":"The Tandem","at":"stage:office.5","text":"At Bluff Creek Control started Protocol QUIET, and Agent Quist asked what the Book does with them.","needs":["office-4"],"fights":["loveland-frogman","dover-demon","beast-of-bray-road"],"arc":"office","kind":"sub","status":"built","game":true,"where":{"region":4,"level":30,"label":"the Office: The Tandem"}},{"id":"office-6","title":"Annex 9","at":"stage:office.6","text":"You stood inside Annex 9, the Office store at Roswell, and the cordon showed you out.","needs":["office-5"],"fights":["lizard-man","hoop-snake"],"arc":"office","kind":"sub","status":"built","game":true,"where":{"region":6,"level":42,"label":"the Office: Annex 9"}},{"id":"office-7","title":"Jurisdiction","at":"stage:office.7","text":"In Barataria the Office chased Lamplighter boats in a pirogue and asked you where they go.","needs":["office-6"],"fights":["lizard-man","hoop-snake","champ"],"arc":"office","kind":"sub","status":"built","game":true,"where":{"region":7,"level":52,"label":"the Office: Jurisdiction"}},{"id":"office-8","title":"Two Forms","at":"stage:office.8","text":"In Texarkana, Section Chief Brandt came in person with two forms and Asset 0.","needs":["office-7"],"fights":["squonk","rougarou","hidebehind"],"arc":"office","kind":"sub","status":"built","game":true,"where":{"region":8,"level":62,"label":"the Office: Two Forms"}},{"id":"institute-1","title":"Baseline","at":"stage:institute.1","text":"Toby Reyes of the Halloway Institute asked for a baseline at Blue Hole.","fights":["wampus-cat","champ"],"arc":"institute","kind":"sub","status":"built","game":true,"where":{"region":1,"level":6,"label":"the Institute: Baseline"}},{"id":"institute-2","title":"Cold Room","at":"stage:institute.2","text":"Dr. Vale offered Reagent 12 at the McClintic igloos, for data on the Book.","needs":["institute-1"],"fights":["flatwoods-monster","snallygaster"],"arc":"institute","kind":"sub","status":"built","game":true,"where":{"region":2,"level":15,"label":"the Institute: Cold Room"}},{"id":"institute-3","title":"Field Guide","at":"stage:institute.3","text":"Dr. Vale asked for squonk tears at Cox's field guide.","needs":["institute-2"],"fights":["teakettler","dover-demon"],"arc":"institute","kind":"sub","status":"built","game":true,"where":{"region":3,"level":24,"label":"the Institute: Field Guide"}},{"id":"institute-4","title":"The Count","at":"stage:institute.4","text":"Ms. Carrow counted deliverables on Isle Royale: twelve needed, nine held.","needs":["institute-3"],"fights":["splintercat","beast-of-bray-road","champ"],"arc":"institute","kind":"sub","status":"built","game":true,"where":{"region":5,"level":37,"label":"the Institute: The Count"}},{"id":"institute-5","title":"The Long Study","at":"stage:institute.5","text":"Toby Reyes asked for one specimen out of the cold room at Mount St. Helens.","needs":["institute-4"],"fights":["loveland-frogman","teakettler","splintercat"],"arc":"institute","kind":"sub","status":"built","game":true,"where":{"region":4,"level":28,"label":"the Institute: The Long Study"}},{"id":"institute-6","title":"Field Strength","at":"stage:institute.6","text":"Dr. Vale read the Book with her meter at Meteor Crater and did not say the result.","needs":["institute-5"],"fights":["hoop-snake","fresno-nightcrawler","lizard-man"],"arc":"institute","kind":"sub","status":"built","game":true,"where":{"region":6,"level":44,"label":"the Institute: Field Strength"}},{"id":"institute-7","title":"Grant Review","at":"stage:institute.7","text":"At Okeechobee the grant review needed a tagged rougarou, and Toby Reyes was the lure.","needs":["institute-6"],"fights":["hoop-snake","lizard-man","champ"],"arc":"institute","kind":"sub","status":"built","game":true,"where":{"region":7,"level":53,"label":"the Institute: Grant Review"}},{"id":"institute-8","title":"Final Report","at":"stage:institute.8","text":"On the plains Dr. Vale ran her last test: the Book on the scale.","needs":["institute-7"],"fights":["lizard-man","ahuizotl","chupacabra"],"arc":"institute","kind":"sub","status":"built","game":true,"where":{"region":8,"level":62,"label":"the Institute: Final Report"}},{"id":"lamplighters-1","title":"First Lamp","at":"stage:lamplighters.1","text":"Wren Ashby stopped me at a path light in Wharton Forest and asked why I carry the Book.","fights":["wampus-cat"],"arc":"lamplighters","kind":"sub","status":"built","game":true,"where":{"region":1,"level":3,"label":"Lamplighters: First Lamp"}},{"id":"lamplighters-2","title":"Dead Drop","at":"stage:lamplighters.2","text":"Pip asked me to carry a paper message past the Office cordon on the Tug Fork.","needs":["lamplighters-1"],"fights":["snallygaster","wampus-cat"],"arc":"lamplighters","kind":"sub","status":"built","game":true,"where":{"region":2,"level":14,"label":"Lamplighters: Dead Drop"}},{"id":"lamplighters-3","title":"Tall Tales","at":"stage:lamplighters.3","text":"Old Dutch asked me at the logging camp to leave the hidebehind alone.","needs":["lamplighters-2"],"fights":["teakettler","splintercat"],"arc":"lamplighters","kind":"sub","status":"built","game":true,"where":{"region":3,"level":19,"label":"Lamplighters: Tall Tales"}},{"id":"lamplighters-4","title":"The Road Shut","at":"stage:lamplighters.4","text":"Wren Ashby shut the road west at Lake Champlain and asked me for a promise about the giant.","needs":["lamplighters-3"],"fights":["splintercat","loveland-frogman","wampus-cat"],"arc":"lamplighters","kind":"sub","status":"built","game":true,"where":{"region":5,"level":38,"label":"Lamplighters: The Road Shut"}},{"id":"lamplighters-5","title":"Night Boat","at":"stage:lamplighters.5","text":"Pip asked me to ride the night boat down Redwood Creek with three passengers.","needs":["lamplighters-4"],"fights":["loveland-frogman","beast-of-bray-road","champ"],"arc":"lamplighters","kind":"sub","status":"built","game":true,"where":{"region":4,"level":30,"label":"Lamplighters: Night Boat"}},{"id":"lamplighters-6","title":"Annex Raid","at":"stage:lamplighters.6","text":"Wren Ashby led a night raid on Annex 9 from the dunes at White Sands.","needs":["lamplighters-5"],"fights":["fresno-nightcrawler","lizard-man"],"arc":"lamplighters","kind":"sub","status":"built","game":true,"where":{"region":6,"level":43,"label":"Lamplighters: Annex Raid"}},{"id":"lamplighters-7","title":"Smugglers' Bay","at":"stage:lamplighters.7","text":"Old Dutch and I held the bay at Barataria against an Office boat.","needs":["lamplighters-6"],"fights":["lizard-man","hoop-snake","fresno-nightcrawler"],"arc":"lamplighters","kind":"sub","status":"built","game":true,"where":{"region":7,"level":52,"label":"Lamplighters: Smugglers' Bay"}},{"id":"lamplighters-8","title":"The Long Haul","at":"stage:lamplighters.8","text":"Wren Ashby and the four who walk with her met me at Old Dutch's truck on Route 66.","needs":["lamplighters-7"],"fights":["rougarou","splintercat","ahuizotl","wampus-cat"],"arc":"lamplighters","kind":"sub","status":"built","game":true,"where":{"region":8,"level":61,"label":"Lamplighters: The Long Haul"}},{"id":"board-1-1","title":"The Mullica River Prowler","at":"board:1:1","fights":["wampus-cat"],"text":"A sighting board in Mullica River: the ranger saw the Wampus Cat. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":1,"level":6,"label":"The Mullica River Prowler"}},{"id":"board-1-6","title":"The Cranberry bogs Brute","at":"board:1:6","fights":["rougarou"],"text":"A sighting board in Cranberry bogs: the birdwatcher saw the Rougarou. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":1,"level":9,"label":"The Cranberry bogs Brute"}},{"id":"board-2-1","title":"The Skyline Drive Shrieker","at":"board:2:1","fights":["snallygaster"],"text":"A sighting board in Skyline Drive: the trucker saw the Snallygaster. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":2,"level":14,"label":"The Skyline Drive Shrieker"}},{"id":"board-2-6","title":"The New River Gorge Shrieker","at":"board:2:6","fights":["snallygaster"],"text":"A sighting board in New River Gorge: the birdwatcher saw the Snallygaster. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":2,"level":17,"label":"The New River Gorge Shrieker"}},{"id":"board-3-1","title":"The Nicolet Brute","at":"board:3:1","fights":["beast-of-bray-road"],"text":"A sighting board in Nicolet: the birdwatcher saw the Beast of Bray Road. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":3,"level":22,"label":"The Nicolet Brute"}},{"id":"board-3-6","title":"The Boundary Waters Brute","at":"board:3:6","fights":["splintercat"],"text":"A sighting board in Boundary Waters: the deputy saw the Splintercat. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":3,"level":25,"label":"The Boundary Waters Brute"}},{"id":"board-4-1","title":"The Lake Quinault Brute","at":"board:4:1","fights":["splintercat"],"text":"A sighting board in Lake Quinault: the birdwatcher saw the Splintercat. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":4,"level":30,"label":"The Lake Quinault Brute"}},{"id":"board-4-6","title":"The Bluff Creek Prowler","at":"board:4:6","fights":["wampus-cat"],"text":"A sighting board in Bluff Creek: the farmhand saw the Wampus Cat. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":4,"level":33,"label":"The Bluff Creek Prowler"}},{"id":"board-5-1","title":"The Lake Erie Prowler","at":"board:5:1","fights":["dover-demon"],"text":"A sighting board in Lake Erie: the trucker saw the Dover Demon. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":5,"level":38,"label":"The Lake Erie Prowler"}},{"id":"board-5-6","title":"The Isle Royale Brute","at":"board:5:6","fights":["beast-of-bray-road"],"text":"A sighting board in Isle Royale: the trucker saw the Beast of Bray Road. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":5,"level":41,"label":"The Isle Royale Brute"}},{"id":"board-6-1","title":"The Roswell Prowler","at":"board:6:1","fights":["fresno-nightcrawler"],"text":"A sighting board in Roswell: the ranger saw the Fresno Nightcrawler. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":6,"level":46,"label":"The Roswell Prowler"}},{"id":"board-6-6","title":"The Monument Valley Prowler","at":"board:6:6","fights":["hoop-snake"],"text":"A sighting board in Monument Valley: the diner cook saw the Hoop Snake. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":6,"level":49,"label":"The Monument Valley Prowler"}},{"id":"board-7-1","title":"The Atchafalaya Prowler","at":"board:7:1","fights":["hoop-snake"],"text":"A sighting board in Atchafalaya: the deputy saw the Hoop Snake. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":7,"level":54,"label":"The Atchafalaya Prowler"}},{"id":"board-7-6","title":"The Okeechobee Prowler","at":"board:7:6","fights":["hoop-snake"],"text":"A sighting board in Okeechobee: the diner cook saw the Hoop Snake. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":7,"level":57,"label":"The Okeechobee Prowler"}},{"id":"board-8-1","title":"The Buffalo River Brute","at":"board:8:1","fights":["lizard-man"],"text":"A sighting board in Buffalo River: the ranger saw the Lizard Man of Scape Ore Swamp. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":8,"level":62,"label":"The Buffalo River Brute"}},{"id":"board-8-6","title":"The Wichita Mountains Prowler","at":"board:8:6","fights":["hoop-snake"],"text":"A sighting board in Wichita Mountains: the farmhand saw the Hoop Snake. Three signs lead to its lair.","arc":"boards","kind":"side","status":"built","game":true,"where":{"region":8,"level":65,"label":"The Wichita Mountains Prowler"}},{"id":"item-one","title":"Item 1","text":"The two greys drop you in the pines at Batsto with a book that talks. Its first demand is written in rust over the printed page: every cryptid on earth, start with three. The rust on the page is the same colour as the bog iron in the streams.","at":"section:1:0","status":"built","arc":"book-wakes","kind":"main","where":{"region":1,"level":2,"label":"Pine Barrens: Batsto Village"}},{"id":"page-already-written","title":"A page already written","text":"When the Jersey Devil's ink holds, its page is not blank. A faded entry is already there, in the same rust hand, older than the Leeds house. The Book says nothing about it. Owner writes what the Book says, if anything.","at":"mythic:1","needs":["mythic-pine-barrens"],"owner":true,"status":"idea","arc":"book-wakes","kind":"main","where":{"region":1,"level":10,"label":"Pine Barrens: Leeds Point"}},{"id":"someone-writes-back","title":"Someone writes back","text":"Inside the Radio Quiet Zone, where no phone works, the Book's hand moves on a page you did not open. A line is added under the last demand, in a hand that is not the Book's. The Office's agents are at Green Bank for the same silence.","at":"section:2:5","needs":["page-already-written","office-2"],"owner":true,"status":"idea","arc":"book-wakes","kind":"main","where":{"region":2,"level":13,"label":"Appalachian hollows: Green Bank"}},{"id":"the-warning","title":"The warning on the pier","text":"At the Silver Bridge's old piers, Mothman stands on the far bank and does not fight. In the legend it comes before a disaster. It looks at the Book, not at you. The next section's stone is where you fight it.","at":"section:2:10","needs":["someone-writes-back"],"fights":["mothman"],"status":"idea","arc":"book-wakes","kind":"main","where":{"region":2,"level":16,"label":"Appalachian hollows: Silver Bridge"}},{"id":"margin-notes","title":"Margin notes, 1910","text":"A copy of Cox's Fearsome Creatures of the Lumberwoods, left in a camp stove, has notes in its margins in the Book's own rust hand: the Book was carried through the lumber camps before. Dr. Vale wants the copy; the Book wants you to burn it.","at":"section:3:10","needs":["the-warning","institute-3"],"status":"idea","arc":"book-wakes","kind":"main","where":{"region":3,"level":24,"label":"Great North Woods: Cox's field guide"}},{"id":"the-torn-page","title":"The torn page","text":"In the corner of the 1977 Champ photograph there is a pale square on the water: a page. The Book has a stub where a leaf was cut. Champ's water holds it; beating Champ lets you dive for it.","at":"section:5:9","needs":["margin-notes"],"status":"idea","arc":"book-wakes","kind":"main","where":{"region":5,"level":39,"label":"Great Lakes and Lake Champlain: The photograph"}},{"id":"page-comes-home","title":"The page comes home","text":"The wet page goes back in at the stub and the Book reads it out: a list of names, crossed through, region by region. Owner writes what the page says.","at":"mythic:5","needs":["the-torn-page","mythic-great-lakes-and-lake-champlain"],"owner":true,"status":"idea","arc":"book-wakes","kind":"main","where":{"region":5,"level":42,"label":"Great Lakes and Lake Champlain: Champ's water"}},{"id":"ash-layer","title":"What the ash holds","text":"The 1980 ash under the Mount St. Helens forest has rust-coloured flecks in it, and the wild ones roam thickest where the ash lies deepest. Dr. Vale's ash cores say the flecks are not from the volcano. The land itself is waking them.","at":"section:4:4","needs":["page-comes-home","institute-4"],"owner":true,"status":"idea","arc":"book-wakes","kind":"main","where":{"region":4,"level":28,"label":"Pacific Northwest rainforest: Mount St. Helens"}},{"id":"greys-come-back","title":"The greys come back","text":"Lights over Roswell, and the same two greys, very nervous, land in a dry wash. They did not lose the Book: they left it, because of what came after it. They will not say what. They ask if it has been fed.","at":"section:6:1","needs":["ash-layer"],"status":"idea","arc":"book-wakes","kind":"main","where":{"region":6,"level":42,"label":"Southwest desert: Roswell"}},{"id":"curse-passes","title":"The curse passes","text":"In the legend the rougarou's curse passes to whoever draws its blood. After the bayou's mythic is bound, the hand that writes the demands starts to look like yours. Owner writes the turn.","at":"mythic:7","needs":["greys-come-back","mythic-bayou-and-everglades"],"owner":true,"status":"idea","arc":"book-wakes","kind":"main","where":{"region":7,"level":58,"label":"Bayou and Everglades: The rougarou's swamp"}},{"id":"last-page-north","title":"The last page of the north","text":"With the Ozark Howler bound, every North American mythic is in the Book. It turns to a new block of pages, all blank but one name, and points south over the gulf. The road needs a swimmer.","at":"mythic:8","needs":["curse-passes","mythic-ozarks-and-the-southern-plains"],"opens":"the south: regions 9-16, with a swimmer in the line-up","status":"idea","arc":"book-wakes","kind":"main","where":{"region":8,"level":66,"label":"Ozarks and the southern plains: The howler's hollow"}},{"id":"gary-cedar-water","title":"Gary and the cedar water","text":"The first Gary tape: cedar water, tannins, 'the water just moved'. Nobody knows who Gary is; the Lamplighters have heard of a man with a camera.","at":"section:1:1","status":"idea","arc":"gary","kind":"sub","where":{"region":1,"level":2,"label":"Pine Barrens: Mullica River"}},{"id":"gary-gorge","title":"Hold the shot","text":"Gary at the New River Gorge bridge: something on the far cliff waves. If you go to that cliff, his tripod marks are still in the moss and there is a dropped lens cap with a name scratched on it.","at":"section:2:6","needs":["gary-cedar-water"],"status":"idea","arc":"gary","kind":"sub","where":{"region":2,"level":13,"label":"Appalachian hollows: New River Gorge"}},{"id":"gary-tripod","title":"The tripod at Niagara","text":"Gary's tripod stands on the Canadian side of the falls, still running. The tape in it is of you, from the day before. He is ahead of you on purpose.","at":"section:5:0","needs":["gary-gorge"],"status":"idea","arc":"gary","kind":"sub","where":{"region":5,"level":34,"label":"Great Lakes and Lake Champlain: Niagara"}},{"id":"gary-white-sands","title":"Footprints at White Sands","text":"At White Sands the gypsum keeps tracks for days. Gary's boot prints walk beside something with three toes, then the boot prints run.","at":"section:6:2","needs":["gary-tripod"],"status":"idea","arc":"gary","kind":"sub","where":{"region":6,"level":43,"label":"Southwest desert: White Sands"}},{"id":"gary-fouke","title":"Gary in person","text":"In Fouke, Arkansas, Gary is editing his film in a motel room. He is not a hunter; he wants one true shot so people believe him. Show him the Book, or don't. Either way he joins the believers' fire at the Howl-Back Club's ridge.","at":"section:8:9","needs":["gary-white-sands","office-8"],"status":"idea","arc":"gary","kind":"sub","where":{"region":8,"level":63,"label":"Ozarks and the southern plains: Fouke"}},{"id":"hat-in-the-pine","title":"The hat in the pine","text":"Ong's Hat is named for a hat thrown into a pine that never came down. It is still up there. Climb for it and the hat band has a rust thumbprint inside.","at":"section:1:9","needs":["item-one"],"status":"idea","arc":"last-bearer","kind":"sub","where":{"region":1,"level":7,"label":"Pine Barrens: Ong's Hat"}},{"id":"camp-ledger","title":"The camp ledger","text":"The logging camp's 1908 ledger has one man paid in cryptids: hodag, squonk, agropelter, the Book's own starters, with the same thumbprint by his mark.","at":"section:3:2","needs":["hat-in-the-pine","lamplighters-3"],"owner":true,"status":"idea","arc":"last-bearer","kind":"sub","where":{"region":3,"level":19,"label":"Great North Woods: Logging camp"}},{"id":"pirogue","title":"A pirogue in the cypress","text":"In Big Cypress a sunk pirogue has a tin box under its seat. In it, the bearer's last note. Owner writes the note.","at":"section:7:7","needs":["camp-ledger","margin-notes"],"owner":true,"status":"idea","arc":"last-bearer","kind":"sub","where":{"region":7,"level":54,"label":"Bayou and Everglades: Big Cypress"}},{"id":"letter-hatters","title":"A letter in foil","text":"The Hatters of Ong's Hat give you a letter wrapped in tin foil for the Porchlight Vigil, 'so the mothmen can't read it'.","at":"believers:hatters","status":"built","arc":"believers-letters","kind":"sub","where":{"region":1,"label":"The Hatters of Ong's Hat"}},{"id":"letter-porchlight","title":"A moth-wing seal","text":"The Porchlight Vigil reads the letter by porch light and writes back, sealed with a moth wing, to the Backwards Lodge.","at":"believers:porchlight","needs":["letter-hatters"],"status":"built","arc":"believers-letters","kind":"sub","where":{"region":2,"label":"The Porchlight Vigil"}},{"id":"letter-backwards","title":"Written backwards","text":"The Backwards Lodge answers in mirror writing. Hold it to your lamp at the Frog Watch's landing to read it.","at":"believers:backwards","needs":["letter-porchlight"],"status":"built","arc":"believers-letters","kind":"sub","where":{"region":3,"label":"The Backwards Lodge"}},{"id":"letter-frogwatch","title":"A wet letter","text":"The Frog Watch dry the letter by their torches and add a pressed frog (rubber) for the Blurry Society.","at":"believers:frogwatch","needs":["letter-backwards"],"status":"built","arc":"believers-letters","kind":"sub","where":{"region":5,"label":"The Frog Watch"}},{"id":"letter-blurry","title":"A blurry photograph","text":"The Blurry Society send their best photograph, which shows nothing at all, to the Antler Choir.","at":"believers:blurry","needs":["letter-frogwatch"],"status":"built","arc":"believers-letters","kind":"sub","where":{"region":4,"label":"The Blurry Society"}},{"id":"letter-antlers","title":"A sung letter","text":"The Antler Choir can't write; they sing the answer, and you carry the tune to the Thirteen Counters.","at":"believers:antlers","needs":["letter-blurry"],"status":"built","arc":"believers-letters","kind":"sub","where":{"region":6,"label":"The Antler Choir"}},{"id":"letter-counters","title":"Thirteen beans","text":"The Thirteen Counters send a jar of beans, counted. Don't spill it on the way to the Ozarks.","at":"believers:counters","needs":["letter-antlers"],"status":"built","arc":"believers-letters","kind":"sub","where":{"region":7,"label":"The Thirteen Counters"}},{"id":"convention","title":"The first convention","text":"All eight groups at the Howl-Back Club's ridge, one big fire, hats, capes, mirrors, goggles, waders, antlers, beans and earmuffs. They tell you where a cryptid you don't hold yet roams, in every region at once.","at":"believers:howlback","needs":["letter-counters"],"opens":"every believer's hint at once, on the big map","status":"built","arc":"believers-letters","kind":"sub","where":{"region":8,"label":"The Howl-Back Club"}},{"id":"fire-tower-watch","title":"Fire tower watch","text":"The warden at Apple Pie Hill's fire tower needs a night watcher. From the cab you can see Philadelphia's glow and Atlantic City's. Mark three lights moving over the pines that are not planes; the third one is the Jersey Devil, and its route shows the 1909 trail.","at":"section:1:4","needs":["lamplighters-1"],"status":"idea","arc":"sides-east","kind":"side","where":{"region":1,"level":4,"label":"Pine Barrens: Apple Pie Hill"}},{"id":"flood-the-bog","title":"Flood the bog","text":"At harvest a grower floods the cranberry bog so the ripe berries float. Open the sluice gates in order. When the red rises, something heavy is moving under it.","at":"section:1:6","fights":["rougarou"],"status":"idea","arc":"sides-east","kind":"side","where":{"region":1,"level":5,"label":"Pine Barrens: Cranberry bogs"}},{"id":"shay-up-the-grade","title":"The Shay up the grade","text":"Ride the geared Shay locomotive from Cass up to Bald Knob. Halfway, the snallygaster drops on the train. Fight on the flatcar while the grade gets steeper.","at":"section:2:4","fights":["snallygaster"],"status":"idea","arc":"sides-east","kind":"side","where":{"region":2,"level":12,"label":"Appalachian hollows: Cass"}},{"id":"feud-lines","title":"Feud lines","text":"Two families on either side of the Tug Fork both say they saw the wampus cat first, and both want it shot. Walk both banks, read the tracks, and find it saw them.","at":"section:2:8","needs":["board-2-6"],"fights":["wampus-cat"],"status":"idea","arc":"sides-east","kind":"side","where":{"region":2,"level":14,"label":"Appalachian hollows: Tug Fork"}},{"id":"fair-hodag","title":"The fair hodag","text":"Rhinelander's fair wants Shepard's 1896 wired wooden hodag rebuilt. Find the parts in town. On fair night a real one comes to look at it.","at":"section:3:0","needs":["office-3"],"fights":["hodag"],"status":"idea","arc":"sides-east","kind":"side","where":{"region":3,"level":18,"label":"Great North Woods: Rhinelander"}},{"id":"portage","title":"Portage","text":"In the Boundary Waters you carry a canoe lake to lake over the portage trails. Every portage has a snapped spruce on it, snapped from the inside: a splintercat's trail.","at":"section:3:6","fights":["splintercat"],"status":"idea","arc":"sides-east","kind":"side","where":{"region":3,"level":21,"label":"Great North Woods: Boundary Waters"}},{"id":"count-the-rings","title":"Count the rings","text":"Toby Reyes needs the rings of a fallen Sitka spruce in the Hoh counted before dark. Every ring has a year; one ring is scorched in a year with no fire on record.","at":"section:4:0","needs":["institute-4"],"status":"idea","arc":"sides-west","kind":"side","where":{"region":4,"level":26,"label":"Pacific Northwest rainforest: Hoh Rain Forest"}},{"id":"the-missing-frames","title":"The missing frames","text":"The 1967 Bluff Creek film runs about a minute. A collector says there were more frames, cut and lost. Find three cans of film at the creek's old camps.","at":"section:4:7","needs":["board-4-6"],"status":"idea","arc":"sides-west","kind":"side","where":{"region":4,"level":30,"label":"Pacific Northwest rainforest: The film"}},{"id":"no-cars","title":"No cars on Mackinac","text":"Cars have been banned on Mackinac Island since 1898. The Office's sedan is stuck at the ferry dock. Deliver their forms by bicycle before the last boat.","at":"section:5:5","needs":["office-4"],"status":"idea","arc":"sides-west","kind":"side","where":{"region":5,"level":37,"label":"Great Lakes and Lake Champlain: Mackinac Island"}},{"id":"wolf-count","title":"The wolf count","text":"Wolves and moose on Isle Royale have been counted every winter since 1958, the longest study of its kind. Help the count from a snow camp; one set of tracks is not a wolf's.","at":"section:5:6","needs":["board-5-6"],"status":"idea","arc":"sides-west","kind":"side","where":{"region":5,"level":37,"label":"Great Lakes and Lake Champlain: Isle Royale"}},{"id":"bat-flight","title":"The bat flight","text":"Summer dusk at Carlsbad Caverns: hundreds of thousands of Mexican free-tailed bats pour out of the cave mouth. Sit in the amphitheatre with the ranger. One shape in the swarm is far too big.","at":"section:6:3","status":"idea","arc":"sides-west","kind":"side","where":{"region":6,"level":43,"label":"Southwest desert: Carlsbad Caverns"}},{"id":"crater-survey","title":"Crater survey","text":"Meteor Crater is about 1.2 km across and 50,000 years old. Walk the rim with a survey stake and place five marks. The fourth mark is already there, in rust.","at":"section:6:4","needs":["institute-6"],"status":"idea","arc":"sides-west","kind":"side","where":{"region":6,"level":44,"label":"Southwest desert: Meteor Crater"}},{"id":"traiteur","title":"The traiteur","text":"In Acadiana a traiteur, a Cajun folk healer, treats your knocked-out beast with a prayer said under the breath. It works. She won't take money; she asks for one true story about the rougarou.","at":"section:7:3","status":"idea","arc":"sides-south","kind":"side","where":{"region":7,"level":51,"label":"Bayou and Everglades: Acadiana"}},{"id":"smugglers-pirogue","title":"By pirogue to Barataria","text":"Jean Lafitte's smugglers used the Barataria marshes. Pole a pirogue through the cuts at night with Old Dutch's cousin, lamps out, past the Office's boat.","at":"section:7:4","needs":["lamplighters-7"],"status":"idea","arc":"sides-south","kind":"side","where":{"region":7,"level":52,"label":"Bayou and Everglades: Barataria"}},{"id":"diamond-dig","title":"Finders keepers","text":"At Crater of Diamonds State Park you keep any stone you find. Dig in the ploughed field after rain, when the stones shine. One of them is warm.","at":"section:8:4","needs":["board-8-1"],"status":"idea","arc":"sides-south","kind":"side","where":{"region":8,"level":60,"label":"Ozarks and the southern plains: Crater of Diamonds"}},{"id":"storm-chase","title":"Storm chase","text":"Ride with a storm spotter under a supercell in Tornado Alley. Call the hail size and the wall cloud. In the roar a howl answers, and the spotter writes it down as wind.","at":"section:8:7","fights":["ozark-howler"],"status":"idea","arc":"sides-south","kind":"side","where":{"region":8,"level":62,"label":"Ozarks and the southern plains: Tornado Alley"}},{"id":"fires-travel","title":"Lit fires","text":"Every campfire you light is a rest and a place to travel back to.","at":"believers:hatters","opens":"travel between lit fires","status":"built","arc":"tools","kind":"unlock","where":{"region":1,"label":"The Hatters of Ong's Hat"}},{"id":"the-lamp","title":"The lamp","text":"Wren Ashby gives you a Lamplighters' lamp. With it lit, the wild ones keep back a little after dark, and the dim lights on the night paths show you the way.","at":"stage:lamplighters.1","needs":["lamplighters-1"],"opens":"walking the night paths by lamp","status":"idea","arc":"tools","kind":"unlock","where":{"region":1,"level":3,"label":"Lamplighters: First Lamp"}},{"id":"the-radio","title":"Sparrow's radio","text":"Pip gives you a radio tuned to the Lamplighters' channel. Sightings come in as rumours and show on the big map. In the Quiet Zone it hisses.","at":"stage:lamplighters.2","needs":["lamplighters-2","the-lamp"],"opens":"rumours on the big map","status":"idea","arc":"tools","kind":"unlock","where":{"region":2,"level":14,"label":"Lamplighters: Dead Drop"}},{"id":"the-canoe","title":"The canoe","text":"After the portage, the canoe is yours. Lakes and slow rivers in the north woods become roads.","at":"section:3:6","needs":["portage"],"opens":"paddling lakes and slow rivers","status":"idea","arc":"tools","kind":"unlock","where":{"region":3,"level":21,"label":"Great North Woods: Boundary Waters"}},{"id":"second-pen","title":"The second pen","text":"The Book grows a second pen loop in its spine and wants it filled. With two pens, a bind gets a fourth try.","at":"mythic:5","needs":["page-comes-home"],"opens":"a fourth try when binding","status":"idea","arc":"tools","kind":"unlock","where":{"region":5,"level":42,"label":"Great Lakes and Lake Champlain: Champ's water"}},{"id":"the-canteen","title":"The canteen","text":"A rancher outside Roswell fills you a canvas canteen. Without it the deep desert in the heat of the day wears your line-up down; with it you can cross the flats at noon.","at":"section:6:1","needs":["greys-come-back"],"opens":"crossing the open desert by day","status":"idea","arc":"tools","kind":"unlock","where":{"region":6,"level":42,"label":"Southwest desert: Roswell"}},{"id":"the-airboat","title":"The airboat","text":"After the traiteur's story, her nephew lends you his airboat. The sawgrass and the open marsh become fast roads, loud enough that the wild ones hear you coming.","at":"section:7:5","needs":["traiteur"],"opens":"fast travel over marsh and sawgrass","status":"idea","arc":"tools","kind":"unlock","where":{"region":7,"level":53,"label":"Bayou and Everglades: River of Grass"}},{"id":"float-trip","title":"The float trip","text":"An outfitter on the Buffalo River rents you a jon boat. Float the river from bluff to bluff; each gravel bar you camp on is a fire to travel back to.","at":"section:8:1","needs":["board-8-1"],"opens":"floating rivers downstream, gravel-bar fires","status":"idea","arc":"tools","kind":"unlock","where":{"region":8,"level":58,"label":"Ozarks and the southern plains: Buffalo River"}}],"story":{"arcs":[{"id":"book-wakes","kind":"main","title":"The Book wakes","pitch":"The Book's ledger, region by region. Each mythic you bring it is a name it already knew, and each region shows a little more of why something is waking the cryptids. What the Book is stays the owner's to write; these beats only point at it.","beats":[{"id":"item-one","title":"Item 1","text":"The two greys drop you in the pines at Batsto with a book that talks. Its first demand is written in rust over the printed page: every cryptid on earth, start with three. The rust on the page is the same colour as the bog iron in the streams.","at":"section:1:0","status":"built"},{"id":"page-already-written","title":"A page already written","text":"When the Jersey Devil's ink holds, its page is not blank. A faded entry is already there, in the same rust hand, older than the Leeds house. The Book says nothing about it. Owner writes what the Book says, if anything.","at":"mythic:1","needs":["mythic-pine-barrens"],"owner":true,"status":"idea"},{"id":"someone-writes-back","title":"Someone writes back","text":"Inside the Radio Quiet Zone, where no phone works, the Book's hand moves on a page you did not open. A line is added under the last demand, in a hand that is not the Book's. The Office's agents are at Green Bank for the same silence.","at":"section:2:5","needs":["page-already-written","office-2"],"owner":true,"status":"idea"},{"id":"the-warning","title":"The warning on the pier","text":"At the Silver Bridge's old piers, Mothman stands on the far bank and does not fight. In the legend it comes before a disaster. It looks at the Book, not at you. The next section's stone is where you fight it.","at":"section:2:10","needs":["someone-writes-back"],"fights":["mothman"],"status":"idea"},{"id":"margin-notes","title":"Margin notes, 1910","text":"A copy of Cox's Fearsome Creatures of the Lumberwoods, left in a camp stove, has notes in its margins in the Book's own rust hand: the Book was carried through the lumber camps before. Dr. Vale wants the copy; the Book wants you to burn it.","at":"section:3:10","needs":["the-warning","institute-3"],"status":"idea"},{"id":"the-torn-page","title":"The torn page","text":"In the corner of the 1977 Champ photograph there is a pale square on the water: a page. The Book has a stub where a leaf was cut. Champ's water holds it; beating Champ lets you dive for it.","at":"section:5:9","needs":["margin-notes"],"status":"idea"},{"id":"page-comes-home","title":"The page comes home","text":"The wet page goes back in at the stub and the Book reads it out: a list of names, crossed through, region by region. Owner writes what the page says.","at":"mythic:5","needs":["the-torn-page","mythic-great-lakes-and-lake-champlain"],"owner":true,"status":"idea"},{"id":"ash-layer","title":"What the ash holds","text":"The 1980 ash under the Mount St. Helens forest has rust-coloured flecks in it, and the wild ones roam thickest where the ash lies deepest. Dr. Vale's ash cores say the flecks are not from the volcano. The land itself is waking them.","at":"section:4:4","needs":["page-comes-home","institute-4"],"owner":true,"status":"idea"},{"id":"greys-come-back","title":"The greys come back","text":"Lights over Roswell, and the same two greys, very nervous, land in a dry wash. They did not lose the Book: they left it, because of what came after it. They will not say what. They ask if it has been fed.","at":"section:6:1","needs":["ash-layer"],"status":"idea"},{"id":"curse-passes","title":"The curse passes","text":"In the legend the rougarou's curse passes to whoever draws its blood. After the bayou's mythic is bound, the hand that writes the demands starts to look like yours. Owner writes the turn.","at":"mythic:7","needs":["greys-come-back","mythic-bayou-and-everglades"],"owner":true,"status":"idea"},{"id":"last-page-north","title":"The last page of the north","text":"With the Ozark Howler bound, every North American mythic is in the Book. It turns to a new block of pages, all blank but one name, and points south over the gulf. The road needs a swimmer.","at":"mythic:8","needs":["curse-passes","mythic-ozarks-and-the-southern-plains"],"opens":"the south: regions 9-16, with a swimmer in the line-up","status":"idea"}]},{"id":"gary","kind":"sub","title":"Gary's documentary","pitch":"Gary narrates the found tapes, always one region ahead of you and always just missing the shot. His tapes get stranger and closer, until you meet him at Fouke, where the old drive-in still shows a monster film.","beats":[{"id":"gary-cedar-water","title":"Gary and the cedar water","text":"The first Gary tape: cedar water, tannins, 'the water just moved'. Nobody knows who Gary is; the Lamplighters have heard of a man with a camera.","at":"section:1:1","status":"idea"},{"id":"gary-gorge","title":"Hold the shot","text":"Gary at the New River Gorge bridge: something on the far cliff waves. If you go to that cliff, his tripod marks are still in the moss and there is a dropped lens cap with a name scratched on it.","at":"section:2:6","needs":["gary-cedar-water"],"status":"idea"},{"id":"gary-tripod","title":"The tripod at Niagara","text":"Gary's tripod stands on the Canadian side of the falls, still running. The tape in it is of you, from the day before. He is ahead of you on purpose.","at":"section:5:0","needs":["gary-gorge"],"status":"idea"},{"id":"gary-white-sands","title":"Footprints at White Sands","text":"At White Sands the gypsum keeps tracks for days. Gary's boot prints walk beside something with three toes, then the boot prints run.","at":"section:6:2","needs":["gary-tripod"],"status":"idea"},{"id":"gary-fouke","title":"Gary in person","text":"In Fouke, Arkansas, Gary is editing his film in a motel room. He is not a hunter; he wants one true shot so people believe him. Show him the Book, or don't. Either way he joins the believers' fire at the Howl-Back Club's ridge.","at":"section:8:9","needs":["gary-white-sands","office-8"],"status":"idea"}]},{"id":"last-bearer","kind":"sub","title":"The last bearer","pitch":"The rust thumbprint on every page belongs to someone. Their trail runs through lumber camps, a ghost town and a bayou: a hat, a field guide, a pirogue. Who they were is the owner's to write.","beats":[{"id":"hat-in-the-pine","title":"The hat in the pine","text":"Ong's Hat is named for a hat thrown into a pine that never came down. It is still up there. Climb for it and the hat band has a rust thumbprint inside.","at":"section:1:9","needs":["item-one"],"status":"idea"},{"id":"camp-ledger","title":"The camp ledger","text":"The logging camp's 1908 ledger has one man paid in cryptids: hodag, squonk, agropelter, the Book's own starters, with the same thumbprint by his mark.","at":"section:3:2","needs":["hat-in-the-pine","lamplighters-3"],"owner":true,"status":"idea"},{"id":"pirogue","title":"A pirogue in the cypress","text":"In Big Cypress a sunk pirogue has a tin box under its seat. In it, the bearer's last note. Owner writes the note.","at":"section:7:7","needs":["camp-ledger","margin-notes"],"owner":true,"status":"idea"}]},{"id":"believers-letters","kind":"sub","title":"Letters between the fires","pitch":"The eight believer groups write to each other but never meet. Carry their letters camp to camp along the road and, at the end, they hold their first convention at the Howl-Back Club's ridge. Each letter makes the next camp trust you sooner.","beats":[{"id":"letter-hatters","title":"A letter in foil","text":"The Hatters of Ong's Hat give you a letter wrapped in tin foil for the Porchlight Vigil, 'so the mothmen can't read it'.","at":"believers:hatters","status":"built"},{"id":"letter-porchlight","title":"A moth-wing seal","text":"The Porchlight Vigil reads the letter by porch light and writes back, sealed with a moth wing, to the Backwards Lodge.","at":"believers:porchlight","needs":["letter-hatters"],"status":"built"},{"id":"letter-backwards","title":"Written backwards","text":"The Backwards Lodge answers in mirror writing. Hold it to your lamp at the Frog Watch's landing to read it.","at":"believers:backwards","needs":["letter-porchlight"],"status":"built"},{"id":"letter-frogwatch","title":"A wet letter","text":"The Frog Watch dry the letter by their torches and add a pressed frog (rubber) for the Blurry Society.","at":"believers:frogwatch","needs":["letter-backwards"],"status":"built"},{"id":"letter-blurry","title":"A blurry photograph","text":"The Blurry Society send their best photograph, which shows nothing at all, to the Antler Choir.","at":"believers:blurry","needs":["letter-frogwatch"],"status":"built"},{"id":"letter-antlers","title":"A sung letter","text":"The Antler Choir can't write; they sing the answer, and you carry the tune to the Thirteen Counters.","at":"believers:antlers","needs":["letter-blurry"],"status":"built"},{"id":"letter-counters","title":"Thirteen beans","text":"The Thirteen Counters send a jar of beans, counted. Don't spill it on the way to the Ozarks.","at":"believers:counters","needs":["letter-antlers"],"status":"built"},{"id":"convention","title":"The first convention","text":"All eight groups at the Howl-Back Club's ridge, one big fire, hats, capes, mirrors, goggles, waders, antlers, beans and earmuffs. They tell you where a cryptid you don't hold yet roams, in every region at once.","at":"believers:howlback","needs":["letter-counters"],"opens":"every believer's hint at once, on the big map","status":"built"}]},{"id":"sides-east","kind":"side","title":"Evenings in the east","pitch":"One place, one evening each: a fire tower, a flooded bog, a logging train, a feud, a county fair, a portage.","beats":[{"id":"fire-tower-watch","title":"Fire tower watch","text":"The warden at Apple Pie Hill's fire tower needs a night watcher. From the cab you can see Philadelphia's glow and Atlantic City's. Mark three lights moving over the pines that are not planes; the third one is the Jersey Devil, and its route shows the 1909 trail.","at":"section:1:4","needs":["lamplighters-1"],"status":"idea"},{"id":"flood-the-bog","title":"Flood the bog","text":"At harvest a grower floods the cranberry bog so the ripe berries float. Open the sluice gates in order. When the red rises, something heavy is moving under it.","at":"section:1:6","fights":["rougarou"],"status":"idea"},{"id":"shay-up-the-grade","title":"The Shay up the grade","text":"Ride the geared Shay locomotive from Cass up to Bald Knob. Halfway, the snallygaster drops on the train. Fight on the flatcar while the grade gets steeper.","at":"section:2:4","fights":["snallygaster"],"status":"idea"},{"id":"feud-lines","title":"Feud lines","text":"Two families on either side of the Tug Fork both say they saw the wampus cat first, and both want it shot. Walk both banks, read the tracks, and find it saw them.","at":"section:2:8","needs":["board-2-6"],"fights":["wampus-cat"],"status":"idea"},{"id":"fair-hodag","title":"The fair hodag","text":"Rhinelander's fair wants Shepard's 1896 wired wooden hodag rebuilt. Find the parts in town. On fair night a real one comes to look at it.","at":"section:3:0","needs":["office-3"],"fights":["hodag"],"status":"idea"},{"id":"portage","title":"Portage","text":"In the Boundary Waters you carry a canoe lake to lake over the portage trails. Every portage has a snapped spruce on it, snapped from the inside: a splintercat's trail.","at":"section:3:6","fights":["splintercat"],"status":"idea"}]},{"id":"sides-west","kind":"side","title":"Evenings in the west","pitch":"A fallen giant, a missing reel, an island with no cars, a wolf count, a cave of bats, a crater survey.","beats":[{"id":"count-the-rings","title":"Count the rings","text":"Toby Reyes needs the rings of a fallen Sitka spruce in the Hoh counted before dark. Every ring has a year; one ring is scorched in a year with no fire on record.","at":"section:4:0","needs":["institute-4"],"status":"idea"},{"id":"the-missing-frames","title":"The missing frames","text":"The 1967 Bluff Creek film runs about a minute. A collector says there were more frames, cut and lost. Find three cans of film at the creek's old camps.","at":"section:4:7","needs":["board-4-6"],"status":"idea"},{"id":"no-cars","title":"No cars on Mackinac","text":"Cars have been banned on Mackinac Island since 1898. The Office's sedan is stuck at the ferry dock. Deliver their forms by bicycle before the last boat.","at":"section:5:5","needs":["office-4"],"status":"idea"},{"id":"wolf-count","title":"The wolf count","text":"Wolves and moose on Isle Royale have been counted every winter since 1958, the longest study of its kind. Help the count from a snow camp; one set of tracks is not a wolf's.","at":"section:5:6","needs":["board-5-6"],"status":"idea"},{"id":"bat-flight","title":"The bat flight","text":"Summer dusk at Carlsbad Caverns: hundreds of thousands of Mexican free-tailed bats pour out of the cave mouth. Sit in the amphitheatre with the ranger. One shape in the swarm is far too big.","at":"section:6:3","status":"idea"},{"id":"crater-survey","title":"Crater survey","text":"Meteor Crater is about 1.2 km across and 50,000 years old. Walk the rim with a survey stake and place five marks. The fourth mark is already there, in rust.","at":"section:6:4","needs":["institute-6"],"status":"idea"}]},{"id":"sides-south","kind":"side","title":"Evenings in the south","pitch":"A faith healer, a smugglers' bay, a diamond field, a storm chase.","beats":[{"id":"traiteur","title":"The traiteur","text":"In Acadiana a traiteur, a Cajun folk healer, treats your knocked-out beast with a prayer said under the breath. It works. She won't take money; she asks for one true story about the rougarou.","at":"section:7:3","status":"idea"},{"id":"smugglers-pirogue","title":"By pirogue to Barataria","text":"Jean Lafitte's smugglers used the Barataria marshes. Pole a pirogue through the cuts at night with Old Dutch's cousin, lamps out, past the Office's boat.","at":"section:7:4","needs":["lamplighters-7"],"status":"idea"},{"id":"diamond-dig","title":"Finders keepers","text":"At Crater of Diamonds State Park you keep any stone you find. Dig in the ploughed field after rain, when the stones shine. One of them is warm.","at":"section:8:4","needs":["board-8-1"],"status":"idea"},{"id":"storm-chase","title":"Storm chase","text":"Ride with a storm spotter under a supercell in Tornado Alley. Call the hail size and the wall cloud. In the roar a howl answers, and the spotter writes it down as wind.","at":"section:8:7","fights":["ozark-howler"],"status":"idea"}]},{"id":"tools","kind":"unlock","title":"Tools of the road","pitch":"What you carry decides where you can go: a lamp for the night, a radio for rumours, a canoe for the lakes, a bicycle for the island, a second pen for the Book. Each comes from someone you meet, at a level.","beats":[{"id":"fires-travel","title":"Lit fires","text":"Every campfire you light is a rest and a place to travel back to.","at":"believers:hatters","opens":"travel between lit fires","status":"built"},{"id":"the-lamp","title":"The lamp","text":"Wren Ashby gives you a Lamplighters' lamp. With it lit, the wild ones keep back a little after dark, and the dim lights on the night paths show you the way.","at":"stage:lamplighters.1","needs":["lamplighters-1"],"opens":"walking the night paths by lamp","status":"idea"},{"id":"the-radio","title":"Sparrow's radio","text":"Pip gives you a radio tuned to the Lamplighters' channel. Sightings come in as rumours and show on the big map. In the Quiet Zone it hisses.","at":"stage:lamplighters.2","needs":["lamplighters-2","the-lamp"],"opens":"rumours on the big map","status":"idea"},{"id":"the-canoe","title":"The canoe","text":"After the portage, the canoe is yours. Lakes and slow rivers in the north woods become roads.","at":"section:3:6","needs":["portage"],"opens":"paddling lakes and slow rivers","status":"idea"},{"id":"second-pen","title":"The second pen","text":"The Book grows a second pen loop in its spine and wants it filled. With two pens, a bind gets a fourth try.","at":"mythic:5","needs":["page-comes-home"],"opens":"a fourth try when binding","status":"idea"},{"id":"the-canteen","title":"The canteen","text":"A rancher outside Roswell fills you a canvas canteen. Without it the deep desert in the heat of the day wears your line-up down; with it you can cross the flats at noon.","at":"section:6:1","needs":["greys-come-back"],"opens":"crossing the open desert by day","status":"idea"},{"id":"the-airboat","title":"The airboat","text":"After the traiteur's story, her nephew lends you his airboat. The sawgrass and the open marsh become fast roads, loud enough that the wild ones hear you coming.","at":"section:7:5","needs":["traiteur"],"opens":"fast travel over marsh and sawgrass","status":"idea"},{"id":"float-trip","title":"The float trip","text":"An outfitter on the Buffalo River rents you a jon boat. Float the river from bluff to bluff; each gravel bar you camp on is a fire to travel back to.","at":"section:8:1","needs":["board-8-1"],"opens":"floating rivers downstream, gravel-bar fires","status":"idea"}]}],"areas":[{"region":"pine-barrens","feel":"Flat, sandy, hushed and endless: pitch pine and scrub oak to every edge, tea-brown rivers, white sugar-sand roads, and ghost towns where iron was once made from the bogs.","world":[{"kind":"place","what":"Batsto Village: the ironmaster's mansion, the sawmill, the gristmill and the workers' cottages along the lake, built of local stone and cedar.","at":"section:1:0","status":"built"},{"kind":"place","what":"Apple Pie Hill's steel fire tower with a cab on top, the only high point for miles, the Batona Trail passing its foot.","at":"section:1:4","status":"built"},{"kind":"place","what":"Sugar-sand roads: white, soft and deep-rutted, with the pines close on both sides and puddles the colour of tea.","status":"built"},{"kind":"place","what":"Cranberry bogs in rows behind low dykes and sluice gates, flooded red at harvest.","at":"section:1:6","status":"built"},{"kind":"place","what":"Atsion Lake: cedar water the colour of strong tea, a sand beach and a dock, white cedars dark round the far shore.","at":"section:1:2","status":"built"},{"kind":"place","what":"Rivers and streams the colour of tea from the cedar swamps, running out dark into the bay.","status":"built"},{"kind":"life","what":"Short, crooked pitch pines, none much over ten metres, standing open over waist-high scrub oak and huckleberry.","status":"built"},{"kind":"life","wh const $ = (s) => document.querySelector(s), esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const byId = new Map(D.beats.map((b) => [b.id, b]));
const col = (b) => { const i = D.road.findIndex((r) => r.n === b.where?.region); return i < 0 ? 0 : i; };
let arcFilter = null;

$("#card").innerHTML = "Story card <b>" + D.score + " / 5</b> · " + D.card.map((c) => c.id + " " + c.points.toFixed(2)).join(" · ");
if (D.problems.length || D.clashes.length) $("#problems").innerHTML = '<div class="problems">' + [...D.problems, ...D.clashes.map((c) => "game: " + c)].map(esc).join("<br>") + "</div>";
$("#filters").innerHTML = '<button aria-pressed="true" data-arc="">all threads</button>' + D.arcs.map((a) => '<button aria-pressed="false" data-arc="' + a.id + '">' + esc(a.title) + "</button>").join("");
$("#filters").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; arcFilter = b.dataset.arc || null;
  for (const x of $("#filters").children) x.setAttribute("aria-pressed", String(x === b)); paint(); };

function draw() {
  const g = $("#grid"); g.style.setProperty("--cols", D.road.length);
  let h = '<div class="head"></div>' + D.road.map((r, i) => '<div class="head"><h2>' + (i + 1) + ". " + esc(r.name) + "</h2><small>region " + r.n + " · from level " + r.level + "</small></div>").join("");
  for (const k of KINDS) {
    h += '<div class="kind" style="--c:var(--' + k + ')">' + k + "</div>";
    for (let i = 0; i < D.road.length; i++) {
      const here = D.beats.filter((b) => b.kind === k && col(b) === i).sort((a, b) => (a.where?.level ?? 0) - (b.where?.level ?? 0));
      h += '<div class="cell">' + here.map((b) => '<button class="beat ' + (b.game ? "game " : "") + b.status + (b.owner ? " owner" : "") + '" style="--c:var(--' + k + ')" data-id="' + b.id + '"><span class="t">' + esc(b.title) + '</span><span class="m">' + esc(b.where?.label ?? b.at) + (b.where?.level ? " · L" + b.where.level : "") + "</span></button>").join("") + "</div>";
    }
  }
  h += '<div class="kind" style="--c:var(--faint)">world</div>' + D.road.map((r) => { const a = D.areas.find((x) => x.region === r.id);
    return '<div class="area">' + (a ? "<p>" + esc(a.feel) + "</p><ul>" + a.world.map((w) => '<li class="' + w.status + '"><b>' + w.kind + "</b> " + esc(w.what) + "</li>").join("") + "</ul>" : "nothing written yet") + "</div>"; }).join("");
  g.innerHTML = h;
  threads();
}
function threads() {
  const svg = $("#threads"), box = $("main").getBoundingClientRect(), m = $("main");
  svg.setAttribute("width", m.scrollWidth); svg.setAttribute("height", m.scrollHeight);
  const at = (id) => { const el = document.querySelector('.beat[data-id="' + id + '"]'); if (!el) return null; const r = el.getBoundingClientRect();
    return { x: r.left - box.left + m.scrollLeft, y: r.top - box.top + m.scrollTop, w: r.width, h: r.height }; };
  let p = "";
  for (const b of D.beats) for (const n of b.needs ?? []) { const a = at(n), c = at(b.id); if (!a || !c) continue;
    const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = c.x + c.w / 2, y2 = c.y, my = (y1 + y2) / 2;
    p += '<path data-from="' + n + '" data-to="' + b.id + '" d="M' + x1 + "," + y1 + " C" + x1 + "," + my + " " + x2 + "," + my + " " + x2 + "," + y2 + '"/>'; }
  svg.innerHTML = p; paint();
}
function chain(id) { const s = new Set([id]); const up = (x) => { for (const n of byId.get(x)?.needs ?? []) if (!s.has(n)) { s.add(n); up(n); } };
  const down = (x) => { for (const b of D.beats) if ((b.needs ?? []).includes(x) && !s.has(b.id)) { s.add(b.id); down(b.id); } }; up(id); down(id); return s; }
let picked = null;
function paint() {
  const lit = picked ? chain(picked) : null;
  for (const el of document.querySelectorAll(".beat")) { const b = byId.get(el.dataset.id);
    el.classList.toggle("dim", (arcFilter && b.arc !== arcFilter) || (lit && !lit.has(b.id))); el.classList.toggle("lit", !!lit && lit.has(b.id)); }
  for (const p of document.querySelectorAll("#threads path")) p.classList.toggle("lit", !!lit && lit.has(p.dataset.from) && lit.has(p.dataset.to));
}
function findJson(id) { for (const a of D.story?.arcs ?? []) { const b = a.beats.find((x) => x.id === id); if (b) return b; } return null; }
function open(id) {
  picked = id; paint(); const b = byId.get(id), j = findJson(id), arc = D.arcs.find((a) => a.id === b.arc), p = $("#panel");
  const needs = (b.needs ?? []).map((n) => '<a href="#" data-go="' + n + '">' + esc(byId.get(n)?.title ?? n) + "</a>").join(", ") || "nothing";
  let h = '<button class="x" aria-label="Close">×</button><h3>' + esc(b.title) + '</h3><div class="meta">' + esc(b.kind) + " · " + esc(arc?.title ?? b.arc) + " · " + esc(b.where?.label ?? b.at) + (b.where?.level ? " · level " + b.where.level : "") + " · " + b.status + (b.owner ? " · the owner writes this" : "") + "</div>";
  if (j && live) {
    h += '<label>Title<input id="f-title" value="' + esc(j.title) + '"></label><label>What happens<textarea id="f-text">' + esc(j.text) + "</textarea></label>" +
      '<label>Where (' + esc(b.at) + ')<input id="f-at" value="' + esc(j.at) + '"></label><label>Needs (beat ids, commas)<input id="f-needs" value="' + esc((j.needs ?? []).join(", ")) + '"></label>' +
      '<label>Opens<input id="f-opens" value="' + esc(j.opens ?? "") + '"></label><label>Status<select id="f-status">' + ["idea", "approved", "built"].map((s) => "<option" + (s === j.status ? " selected" : "") + ">" + s + "</option>").join("") + "</select></label>" +
      '<div class="row"><button class="act" id="save">Save to content/story.json</button><button class="act ghost" id="cancel">Close</button></div><div class="msg" id="msg"></div>';
  } else {
    h += "<p>" + esc(b.text) + "</p>" + (b.opens ? "<p><b>Opens:</b> " + esc(b.opens) + "</p>" : "");
    h += '<p class="meta">' + (b.game ? "The game plays this; it is read from the game's own files, so edit it there." : live ? "" : "Run <code>bun run story --serve</code> in apps/mythic-masters to edit here, or edit content/story.json (also in <code>bun run cms</code>).") + "</p>";
  }
  h += '<p class="meta">Needs: ' + needs + "</p>";
  p.innerHTML = h; p.classList.add("open");
  p.querySelector(".x").onclick = close; const c = p.querySelector("#cancel"); if (c) c.onclick = close;
  for (const a of p.querySelectorAll("[data-go]")) a.onclick = (e) => { e.preventDefault(); open(a.dataset.go); };
  const s = p.querySelector("#save"); if (s) s.onclick = () => save(j);
}
function close() { picked = null; $("#panel").classList.remove("open"); paint(); }
async function save(j) {
  const v = (id) => document.getElementById(id).value.trim();
  j.title = v("f-title"); j.text = v("f-text"); j.at = v("f-at"); j.status = v("f-status");
  const needs = v("f-needs").split(",").map((s) => s.trim()).filter(Boolean); if (needs.length) j.needs = needs; else delete j.needs;
  const opens = v("f-opens"); if (opens) j.opens = opens; else delete j.opens;
  const res = await fetch("/save", { method: "POST", body: JSON.stringify(D.story, null, 2) }), out = await res.json(), msg = $("#msg");
  if (out.ok) { msg.className = "msg"; msg.textContent = "Saved. Reloading."; setTimeout(() => location.reload(), 400); }
  else { msg.className = "msg bad"; msg.textContent = "Not saved:\n" + out.problems.join("\n"); }
}
$("#grid").addEventListener("click", (e) => { const b = e.target.closest(".beat"); if (b) open(b.dataset.id); });
addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
addEventListener("resize", threads);
draw();
</script></body></html>
