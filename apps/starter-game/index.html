<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starter Game</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main>
    <canvas id="stage" aria-label="Starter Game"></canvas>
    <section id="menu">
      <h1 id="title" data-copy="title"></h1>
      <p id="goal" data-copy="goal"></p>
      <p id="how"><span id="desktop" data-copy="computer"></span> <span id="phone" data-copy="phone"></span></p>
      <button id="play" data-copy="play"></button>
      <div id="account"></div>
      <div id="party" hidden>
        <button id="make" data-copy="makeParty"></button>
        <form id="join"><input id="joincode" data-copy-placeholder="partyCode" maxlength="12" data-copy-aria-label="partyCode"><button data-copy="join"></button></form>
        <p id="code"></p>
        <p id="crew"></p>
        <button id="start" hidden data-copy="start"></button>
      </div>
      <p id="note"></p>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
