<title>PR Board Circuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the circuit board with a tour card beside it (below it on a narrow screen). */
:root { --bg:#eef2ef; --board:#f9fbf9; --ink:#16201c; --muted:#5a6962; --line:#d2dbd5; --trace:#8a4f1c; --proposed:#b07800; --spark:#0a8f5f; --chip:#fff; --pin:#b9c4bd;
  --display:"Space Grotesk",Inter,system-ui,sans-serif; --body:Inter,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#08110e; --board:#0d211a; --ink:#e4eee8; --muted:#8ea39a; --line:#21402f; --trace:#d08f50; --proposed:#e8c25a; --spark:#6ff5bd; --chip:#12302a; --pin:#c9a36f; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#08110e; --board:#0d211a; --ink:#e4eee8; --muted:#8ea39a; --line:#21402f; --trace:#d08f50; --proposed:#e8c25a; --spark:#6ff5bd; --chip:#12302a; --pin:#c9a36f; color-scheme:dark }
body { background:var(--bg); color:var(--ink); font:16px/1.5 var(--body); }
.wrap { max-width:1500px; margin:0 auto; padding-block:20px 40px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:grid; gap:12px; }
h1,h2,h3 { font-family:var(--display); margin:0; line-height:1.15; }
h1 { font-size:1.8rem; } h2 { font-size:1.35rem; } h3 { font:600 .75rem var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--trace); }
p { margin:0; }
.legend { display:flex; flex-wrap:wrap; gap:6px 20px; font-size:.85rem; color:var(--muted); align-items:center; }
.legend span { display:inline-flex; gap:7px; align-items:center; }
.legend svg { width:18px; height:18px; flex:none; } .legend .ln { width:28px; height:10px; }
.row { display:flex; flex-wrap:wrap; gap:8px; }
button { font:600 .85rem var(--body); color:var(--ink); background:var(--chip); border:1.5px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; justify-content:center; }
button[aria-pressed="true"] { border-color:var(--spark); box-shadow:0 0 0 3px color-mix(in srgb,var(--spark) 25%,transparent); }
button:focus-visible, .node:focus-visible rect.body { outline:2px solid var(--spark); outline-offset:2px; }
button:disabled { opacity:.4; cursor:default; }
button svg, .tour-top svg { width:16px; height:16px; flex:none; }
.stage { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:12px; align-items:start; }
@media (max-width:1100px) { .stage { grid-template-columns:minmax(0,1fr); } }
.boardbox { overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--board); }
#board { display:block; width:100%; min-width:800px; height:auto; max-height:calc(100vh - 150px); }
#board text { font-family:var(--mono); }
.node { cursor:pointer; outline:none; transition:opacity .25s; }
.node rect.body { fill:var(--chip); stroke:var(--ink); stroke-width:1.4; }
.node:hover rect.body { stroke:var(--spark); }
.node.proposed rect.body { stroke:var(--proposed); stroke-dasharray:6 4; }
.node.here rect.body { stroke:var(--spark); stroke-width:4; }
.node .t { font-weight:600; font-size:14px; fill:var(--ink); }
.node .s { font-size:10px; fill:var(--muted); }
.node .ic { color:var(--ink); } .node.ai .ic { color:var(--spark); }
.pin { fill:var(--pin); }
.edge { transition:opacity .25s; }
.edge path { fill:none; stroke-width:2.4; stroke-linejoin:round; }
.edge.built path.w { stroke:var(--trace); } .edge.proposed path.w { stroke:var(--proposed); stroke-dasharray:7 5; }
.edge path.flow { stroke:var(--spark); stroke-width:3.2; stroke-dasharray:10 22; opacity:0; }
.edge .lab { font-size:10.5px; fill:var(--muted); paint-order:stroke; stroke:var(--board); stroke-width:4px; }
.edge circle.via { fill:var(--board); stroke-width:2; }
.edge.built circle.via { stroke:var(--trace); } .edge.proposed circle.via { stroke:var(--proposed); }
.bus { fill:var(--trace); } .node.bar rect.body { fill:var(--trace); stroke:var(--trace); } .node.bar.here rect.body { stroke:var(--spark); }
.node.bar text { font-weight:600; font-size:13px; fill:var(--board); letter-spacing:.2em; }
svg.lit .edge, svg.lit .node { opacity:.14; }
svg.lit .node.near { opacity:.6; }
svg.lit .edge.past { opacity:.75; }
svg.lit .edge.on, svg.lit .node.here { opacity:1; }
svg.lit .edge.on path.flow { opacity:1; animation:run 1.1s linear infinite; }
svg.lit .edge.on .lab { fill:var(--ink); }
@keyframes run { to { stroke-dashoffset:-32; } }
@media (prefers-reduced-motion: reduce) { svg.lit .edge.on path.flow { animation:none; stroke-dasharray:none; opacity:.55; } }
.tour { position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); bottom:8px; display:grid; gap:12px; background:var(--board); border:1px solid var(--line); border-radius:12px; padding:16px; min-width:0; box-shadow:0 10px 30px rgba(0,0,0,.18); }
@media (max-width:1100px) { .tour { position:static; } }
.tour-top { display:flex; align-items:center; gap:8px; } .tour-top h2 { flex:1; min-width:0; } .tour-top svg { width:22px; height:22px; }
#count { font:.8rem var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.qa { display:grid; gap:12px; align-content:start; } .qa div { display:grid; gap:3px; }
.tour .qa { min-height:15.5rem; }
#scrub { width:100%; margin:0; accent-color:var(--spark); cursor:pointer; }
.btns { display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:6px; } .btns button { padding:8px 6px; }
dialog { width:min(520px,calc(100vw - 32px)); max-height:calc(100vh - 48px); box-sizing:border-box; background:var(--board); color:var(--ink); border:1.5px solid var(--spark); border-radius:14px; padding:20px; font-size:1.05rem; }
dialog::backdrop { background:rgba(0,0,0,.6); }
dialog[open] { display:grid; gap:16px; }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M12 18v-5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3l14 9-14 9z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--trace)"/></marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--proposed)"/></marker>
  </defs>
</svg>

<div class="wrap">
  <h1>PR Board Circuit</h1>
  <div class="legend">
    <span><svg style="color:var(--spark)"><use href="#i-bot"/></svg>AI agent</span>
    <span><svg><use href="#i-brain"/></svg>Computer program</span>
    <span><svg><use href="#i-user"/></svg>You</span>
    <span><svg class="ln" viewBox="0 0 30 10"><path d="M0 5h30" stroke="var(--trace)" stroke-width="2.4"/></svg>We have it</span>
    <span><svg class="ln" viewBox="0 0 30 10"><path d="M0 5h30" stroke="var(--proposed)" stroke-width="2.4" stroke-dasharray="7 5"/></svg>Not built yet</span>
  </div>
  <div class="row" id="chapters" role="group" aria-label="Parts of the tour"></div>
  <div class="stage">
    <div class="boardbox"><svg id="board" viewBox="0 0 1120 850" aria-label="How a change gets to main. Select a box to read about it."></svg></div>
    <div class="tour">
      <div class="tour-top"><h2 id="title"></h2><span id="count"></span></div>
      <div class="qa" id="qa" aria-live="polite"></div>
      <input type="range" id="scrub" min="0" aria-label="Slide">
      <div class="btns">
        <button type="button" id="back">Back</button>
        <button type="button" id="play"></button>
        <button type="button" id="next">Next</button>
      </div>
    </div>
  </div>
</div>

<dialog id="more" aria-labelledby="m-title">
  <h2 id="m-title"></h2>
  <div class="qa" id="m-qa"></div>
  <button type="button" id="close">Close</button>
</dialog>

<script>
const NS = "http://www.w3.org/2000/svg";
const W = 180, H = 66;
// [x, y, kind, name, note]
const nodes = {
  you:[40,40,"user","You","you pick the goals"], lead:[280,40,"ai","Lead","writes the task"], queue:[520,40,"brain","Task queue","tasks wait here"],
  pressure:[800,40,"brain","Catch-up gauge","not built yet"], tests:[40,250,"brain","Own tests","before you push"], worker:[280,250,"ai","Worker","does one task"],
  preflight:[520,250,"brain","Preflight","looks for overlap"], mervin:[800,250,"brain","Mervin","sets merge order"], why:[280,440,"brain","Why red?","read the failure"],
  ci:[520,440,"brain","CI","tests the change"], merger:[800,440,"ai","PR agent","merges or repairs"], triage:[280,620,"brain","Ester","finds shared fails"],
  blocker:[520,620,"ai","Blocker lead","one fix, one agent"], after:[800,620,"brain","after.ts","updates waiting PRs"], rings:[280,750,"brain","Release rings","slower, wider tests"],
  finder:[520,750,"brain","Cause finder","finds the bad merge"], hourly:[800,750,"brain","Hourly check","tests all of main"],
};
// id: [from, to, points, built?, label, labelX, labelY]
const edges = {
  goal:["you","lead",[[220,73],[280,73]],1,"",0,0],
  task:["lead","queue",[[460,73],[520,73]],1,"tasks",470,64],
  hire:["queue","worker",[[600,106],[600,190],[370,190],[370,250]],1,"hire",470,182],
  run:["worker","tests",[[280,266],[220,266]],1,"run",238,258],
  fail:["tests","worker",[[220,296],[280,296]],1,"fix",240,290],
  pr:["worker","preflight",[[460,283],[520,283]],1,"PR",480,274],
  push:["preflight","ci",[[600,316],[600,440]],1,"push",608,360],
  green:["ci","merger",[[700,473],[800,473]],1,"green",726,464],
  merge:["merger","main",[[980,462],[1040,462]],1,"merge",990,454],
  red:["ci","why",[[520,473],[460,473]],1,"red",476,464],
  mine:["why","merger",[[420,440],[420,390],[780,390],[780,455],[800,455]],1,"my change broke it",612,382],
  repair:["merger","ci",[[850,506],[850,532],[640,532],[640,506]],1,"push fix",772,524],
  shared:["why","triage",[[370,506],[370,620]],1,"same test",378,545],
  many:["triage","blocker",[[460,653],[520,653]],1,"3+ PRs",468,644],
  first:["blocker","merger",[[700,640],[760,640],[760,495],[800,495]],1,"fix merges first",706,600],
  moved:["main","after",[[1040,653],[980,653]],1,"moved",992,644],
  again:["after","ci",[[890,620],[890,566],[660,566],[660,506]],1,"merge main in, rerun",700,558],
  overlap:["preflight","mervin",[[700,283],[800,283]],1,"merge after",712,274],
  order:["mervin","merger",[[890,316],[890,440]],1,"order, stack",898,380],
  merged:["main","hourly",[[1040,766],[980,766]],1,"merged",988,757],
  mainred:["hourly","finder",[[800,783],[700,783]],1,"red",740,774],
  maingreen:["hourly","rings",[[890,816],[890,840],[370,840],[370,816]],1,"green",600,833],
  revert:["finder","merger",[[610,750],[610,732],[1012,732],[1012,490],[980,490]],1,"revert PR",884,724],
  flight:["triage","worker",[[280,666],[240,666],[240,312],[280,312]],0,"fix in flight",150,470],
  jump:["blocker","queue",[[600,686],[600,712],[20,712],[20,18],[580,18],[580,40]],0,"blocker jumps the line",40,705],
  join:["worker","blocker",[[450,316],[450,372],[490,372],[490,596],[560,596],[560,620]],0,"join the block",496,590],
  waits:["preflight","queue",[[660,250],[660,106]],0,"waits on",668,180],
  rate:["merger","pressure",[[980,448],[1010,448],[1010,92],[980,92]],0,"merge rate",940,150],
  open:["queue","pressure",[[700,58],[800,58]],0,"open rate",714,50],
  throttle:["pressure","queue",[[800,88],[700,88]],0,"throttle",720,102],
  early:["mervin","ci",[[800,300],[760,300],[760,420],[680,420],[680,440]],0,"dry-run early",690,412],
};

// Wording follows ASD-STE100: short sentences, active voice, one idea in each.
// what is here, what gets you here, what gets you out, good to know
const about = {
  you:["You decide what we want.","You see a need.","You tell the lead the goal.","You can look at the work at any time."],
  lead:["An agent that plans the work.","You give it a goal.","It writes a task and puts it in the queue.","A good task says what to do, what not to do, and how to check it."],
  queue:["A line of tasks that wait.","A task arrives.","A desk is free. A new worker starts the task.","A new task gets a new worker."],
  worker:["An agent that does one task.","The queue starts it.","It tests the change, opens a PR, and goes home.","A PR (pull request) is a change that asks to go into main."],
  tests:["The tests for the files you changed.","You made a change.","Pass: open the PR. Fail: fix it first.","This is the cheapest place to find a mistake."],
  preflight:["A check before the PR opens.","Your tests pass and you saved the change.","The PR goes to CI.","If another PR changes the same files, preflight writes \"Merge after\" and its number."],
  ci:["A computer that tests the change.","Somebody sends a change to a PR.","Green: all checks pass. Red: a check fails.","CI checks types, tests, and our code rules."],
  why:["The place where you find the cause. Do this before you repair.","A check is red.","Your change: repair it. Same test on many PRs: wait for one fix. Not the code: see \"Red: not the code\".","Read the failure first. Do not just run it again."],
  merger:["An agent that looks after open PRs.","A PR is green or red.","Green: it merges. Red: it repairs, or gets an agent to repair.","You can also merge a green PR."],
  main:["The one good copy of our code.","A green PR merges.","The change is in. Later checks test all of main.","All changes go in through a PR."],
  mervin:["A program that puts PRs in a safe order.","Two or more PRs change the same files.","The PRs merge one by one in that order.","It can combine some changes. A person decides the hard ones."],
  triage:["A program that looks for one test that fails on many PRs.","The same test is red on 3 PRs. Or on 1 PR and on the hourly check.","It writes one issue and one repair task. It tells other workers to wait.","A failure that holds many PRs is a \"blocker\"."],
  blocker:["The one agent that repairs the blocker.","A repair task starts.","The repair merges before the PRs that wait for it.","The repair does not yet go to the front of the queue."],
  after:["A program that updates PRs that wait.","Main changes.","It adds the new main to the PR. CI tests it again.","If the two changes disagree, it tells the author."],
  hourly:["A test of everything on main.","Changes merge. It does not start for each PR.","Green: the rings can use this copy. Red: find the cause.","The name says hourly. It can start less often."],
  finder:["A program that finds which merge broke main.","The hourly check is red, and the test fails again on a second computer.","It tells the author. After 60 minutes with no repair, it opens a PR that removes the change.","If the test passes the second time, it blames nobody."],
  rings:["Wider and slower tests: hourly, daily, then stable.","A copy of main passes the ring before.","Stable: users get it. The owner must say yes.","A red ring stops that copy. Work on main continues."],
  pressure:["An idea: compare new PRs with merged PRs.","PRs open faster than they merge.","Start less new work until the line is shorter.","We did not build this."],
};

// each trip: [name, steps]. A step: [box, lines that bring you there, title, what, in, out]; blank text uses the box's own.
const trips = [
  ["All green", [["you",[]],["lead",["goal"]],["queue",["task"]],["worker",["hire"]],["tests",["run"]],["preflight",["pr"]],["ci",["push"]],["merger",["green"]],["main",["merge"]],["hourly",["merged"]],["rings",["maingreen"]]]],
  ["Red: my change", [
    ["tests",["run","fail"],"Can it not be red?","Run your tests before you push. Many red checks stop here.","You made a change.","Fail: fix it now. Pass: push it."],
    ["ci",["pr","push"],"Red in CI","CI found a failure that you did not find.","You push the change.","A check fails."],
    ["why",["red"],"Why red?","Read the failure. This time your change caused it.","A check is red.","The PR agent takes the PR."],
    ["merger",["mine"],"Repair","The worker went home, so the PR agent has the PR.","Your change broke a check.","It repairs, or gets an agent to repair. Then it pushes."],
    ["ci",["repair"],"Test again","CI runs the checks again.","A repair arrives.","Green: merge. Red: ask why again."]]],
  ["Red: many PRs", [
    ["why",["push","red"],"Not only you","The same test fails on other PRs too.","A check is red.","Do not repair it yourself."],
    ["triage",["shared"]],["blocker",["many"]],
    ["merger",["first"],"Fix goes first","The one repair merges before the PRs it holds.","The repair is green.","The PR agent merges it."],
    ["after",["merge","moved"],"Update the others","The held PRs get the repair from main.","The blocker issue closes.","CI tests each held PR again."],
    ["ci",["again"],"Test again","The held PRs now have the repair.","after.ts adds the new main.","Green: they merge."]]],
  ["Red: not the code", [
    ["why",["push","red"],"A test that is not steady","The test passes some times and fails other times.","A check is red, but your change does not touch it.","Write an issue. Do not run it again and again."],
    ["ci",["push"],"No check started","Sometimes CI does not start at all.","You pushed, but you see no checks.","Push one empty save. This starts the checks."]]],
  ["Main moved", [
    ["preflight",["pr"],"Overlap","Two PRs change the same files.","You open a PR.","It writes \"Merge after\" and the other PR's number."],
    ["mervin",["overlap"]],["merger",["order"],"Merge in order","The first PR merges.","Mervin set the order.","Main now has new code."],
    ["after",["merge","moved"],"Main moved","Your PR passed with the old main. That is not enough.","Another PR merged.","after.ts adds the new main to your PR."],
    ["ci",["again"],"Test with the new main","CI tests both changes together.","after.ts updates your PR.","Green: merge. Red or a clash: the author or the PR agent repairs it."]]],
  ["After merge", [
    ["hourly",["merge","merged"]],["finder",["mainred"]],
    ["merger",["revert"],"Remove the change","A PR that takes the bad change out of main.","No repair came in 60 minutes.","The PR agent handles it like all PRs."],
    ["rings",["maingreen"],"All good","If the hourly check is green, the copy moves to the next ring.","The hourly check passes.","Daily, then stable. Then users get it."]]],
  ["Not built", [["pressure",["open","rate","throttle"],"Ideas","All dashed lines are ideas. For example: slow new work when PRs pile up.","PRs open faster than they merge.","We did not build these."]]],
];
const slides = trips.flatMap(([, steps], trip) => steps.map(([node, via, title, ...text]) => ({ trip, node, via, title: title || (nodes[node] ? nodes[node][3] : "Main"), text: text.length ? text : about[node] })));

const $ = id => document.getElementById(id);
const svg = $("board");
const el = (n, a = {}, parent = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); parent.append(e); return e; };
const put = (s, a, parent) => { el("text", a, parent).textContent = s; };

const edgeEls = {};
for (const [id, [from, to, pts, built, lab, lx, ly]] of Object.entries(edges)) {
  const g = el("g", { class: "edge " + (built ? "built" : "proposed") });
  const d = pts.map((p, i) => (i ? "L" : "M") + p.join(" ")).join(" ");
  el("path", { d, class: "w", "marker-end": `url(#arrow-${built ? "b" : "p"})` }, g);
  el("path", { d, class: "flow" }, g);
  for (const [cx, cy] of pts.slice(1, -1)) el("circle", { cx, cy, r: 3.5, class: "via" }, g);
  if (lab) put(lab, { x: lx, y: ly, class: "lab" }, g);
  edgeEls[id] = { g, from, to };
}
const nodeEls = {};
const box = (id, attrs, name) => {
  const g = el("g", { ...attrs, tabindex: 0, role: "button", "aria-label": "Explain " + name });
  g.onclick = () => explain(id, name);
  g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); explain(id, name); } };
  return nodeEls[id] = g;
};
const bus = box("main", { class: "node bar" }, "Main");
el("rect", { x: 1040, y: 30, width: 44, height: 810, rx: 8, class: "body" }, bus);
put("MAIN", { x: 1068, y: 365, transform: "rotate(90 1068 365)", "text-anchor": "middle" }, bus);
for (const [id, [x, y, kind, name, note]] of Object.entries(nodes)) {
  const g = box(id, { class: "node " + kind + (id === "pressure" ? " proposed" : ""), transform: `translate(${x} ${y})` }, name);
  for (let i = 0; i < 6; i++) for (const py of [-4, H]) el("rect", { x: 18 + i * 28, y: py, width: 8, height: 4, class: "pin" }, g);
  el("rect", { width: W, height: H, rx: 6, class: "body" }, g);
  el("use", { href: "#i-" + (kind === "ai" ? "bot" : kind), x: 10, y: 19, width: 28, height: 28, class: "ic" }, g);
  put(name, { x: 46, y: 29, class: "t" }, g);
  put(note, { x: 46, y: 47, class: "s" }, g);
}

const answers = (into, text) => {
  const heads = ["What is here?", "What gets you here?", "What gets you out?", "Good to know"];
  into.replaceChildren(...text.map((a, i) => {
    const d = document.createElement("div"), h = document.createElement("h3"), p = document.createElement("p");
    h.textContent = heads[i]; p.textContent = a; d.append(h, p); return d;
  }));
};

let at = 0, timer = 0, whole = false;
function draw() {
  const s = slides[at], trail = slides.slice(0, at + 1).filter(x => x.trip === s.trip);
  svg.classList.toggle("lit", !whole);
  Object.values(nodeEls).forEach(n => n.classList.remove("here", "near"));
  Object.values(edgeEls).forEach(e => e.g.classList.remove("on", "past"));
  if (!whole) {
    // the trip so far stays on the board; only the step you are on moves
    for (const step of trail) {
      nodeEls[step.node].classList.add("near");
      for (const id of step.via) { const e = edgeEls[id]; e.g.classList.add("past"); nodeEls[e.from].classList.add("near"); nodeEls[e.to].classList.add("near"); }
    }
    for (const id of s.via) edgeEls[id].g.classList.add("on");
    nodeEls[s.node].classList.add("here");
    const wrap = svg.parentElement, a = nodeEls[s.node].getBoundingClientRect(), b = wrap.getBoundingClientRect();
    wrap.scrollLeft += a.left + a.width / 2 - b.left - b.width / 2;
  }
  const mine = slides.filter(x => x.trip === s.trip);
  $("title").textContent = whole ? "The whole board" : s.title;
  $("count").textContent = whole ? "" : `${trips[s.trip][0]} · ${mine.indexOf(s) + 1} / ${mine.length}`;
  answers($("qa"), whole ? ["All the paths at one time.", "You saw the paths one by one.", "Select a box, or a path button."] : s.text.slice(0, 3));
  $("scrub").value = at;
  $("back").disabled = at === 0;
  $("next").disabled = at === slides.length - 1;
  $("play").innerHTML = timer ? '<svg><use href="#i-pause"/></svg>Pause' : '<svg><use href="#i-play"/></svg>Play';
  [...$("chapters").children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === trips.length ? whole : !whole && i === s.trip)));
}
// each slide stays long enough to read at an easy pace
const wait = () => 2000 + slides[at].text.slice(0, 3).join(" ").split(" ").length * 250;
function stop() { clearTimeout(timer); timer = 0; }
function tick() { timer = setTimeout(() => { at++; if (at < slides.length - 1) tick(); else timer = 0; draw(); }, wait()); }
function go(i) { stop(); whole = false; at = Math.max(0, Math.min(slides.length - 1, i)); draw(); }
function explain(id, name) {
  stop(); draw();
  $("m-title").textContent = name;
  answers($("m-qa"), about[id]);
  $("more").showModal();
}

$("scrub").max = slides.length - 1;
$("scrub").oninput = e => go(Number(e.target.value));
$("back").onclick = () => go(at - 1);
$("next").onclick = () => go(at + 1);
$("play").onclick = () => {
  if (timer) stop(); else { whole = false; if (at === slides.length - 1) at = 0; tick(); }
  draw();
};
$("close").onclick = () => $("more").close();
const chip = (name, onclick) => { const b = document.createElement("button"); b.type = "button"; b.textContent = name; b.onclick = onclick; $("chapters").append(b); };
trips.forEach(([name], i) => chip(name, () => go(slides.findIndex(s => s.trip === i))));
chip("See all", () => { stop(); whole = true; draw(); });
addEventListener("keydown", e => {
  if ($("more").open || e.target.id === "scrub") return;
  if (e.key === "ArrowRight") go(at + 1); else if (e.key === "ArrowLeft") go(at - 1);
});
draw();
</script>
